const _urlLang=new URLSearchParams(location.search).get('lang'); let lang=(_urlLang&&['en','es','nah'].includes(_urlLang))?_urlLang:(localStorage.getItem('wotg_lang')||'en'); if(_urlLang) localStorage.setItem('wotg_lang',_urlLang);
function TX(k){ return (STRINGS[lang]&&STRINGS[lang][k]) || STRINGS.en[k] || k; }
function toggleLang(){ lang=lang==='en'?'es':lang==='es'?'nah':'en'; localStorage.setItem('wotg_lang',lang); }
function gstr(g, field){ if(lang==='nah') return g[field+'_nah']||g[field+'_es']||g[field]; if(lang==='es') return g[field+'_es']||g[field]; return g[field]; }
function getStoryLevel(idx){
  const base=STORY_LEVELS[idx]||{};
  const nah=STORY_LEVELS_NAH[idx]||{};
  const loc=lang==='es'?(STORY_LEVELS_ES[idx]||{}):lang==='nah'?nah:{};
  return {...base,...loc,
    intro:loc.intro||base.intro,
    outro:loc.outro||base.outro,
    advice:loc.advice||base.advice};
}

let showHelp=false;
function drawHelp(){
  // Fondo semitransparente
  cx.fillStyle='rgba(0,0,0,0.82)';cx.fillRect(0,0,W,H);
  // Panel central
  const pw=460,ph=310,px=(W-pw)/2,py=(H-ph)/2;
  cx.fillStyle='#1a0a00';cx.fillRect(px,py,pw,ph);
  cx.strokeStyle='#c8a060';cx.lineWidth=2;cx.strokeRect(px,py,pw,ph);
  cx.strokeStyle='#5a3010';cx.lineWidth=1;cx.strokeRect(px+4,py+4,pw-8,ph-8);
  // Título
  cx.fillStyle='#ffd700';cx.font='bold 14px monospace';cx.textAlign='center';
  cx.fillText(TX('helpTitle'),W/2,py+26);
  // Separador
  cx.fillStyle='#5a3010';cx.fillRect(px+20,py+34,pw-40,1);
  // Columnas P1 y P2
  const col1=px+30,col2=px+pw/2+10,cy0=py+52;
  const rows=[
    [TX('helpMove'),   'A / D',          '← / →'],
    [TX('helpJump'),   'W',              '↑'],
    [TX('helpAtk'),    'J',              'L'],
    [TX('helpSpec'),   'G',              ';'],
    [TX('helpBack'),   'ESC',            'ESC'],
  ];
  // Cabeceras columnas
  cx.fillStyle='#c8a060';cx.font='bold 10px monospace';cx.textAlign='left';
  cx.fillText(TX('helpP1'),col1+60,cy0-10);
  cx.fillText(TX('helpP2'),col2+60,cy0-10);
  cx.fillStyle='#888877';cx.fillText('⌨',col1,cy0-10);
  // Filas de controles
  rows.forEach(([label,k1,k2],i)=>{
    const ry=cy0+i*34;
    cx.fillStyle='#998866';cx.font='9px monospace';cx.textAlign='left';
    cx.fillText(label,col1,ry);
    cx.fillStyle='#ffd700';cx.font='bold 11px monospace';
    cx.fillText(k1,col1,ry+14);
    cx.fillText(k2,col2,ry+14);
    cx.fillStyle='#333322';cx.fillRect(px+20,ry+20,pw-40,1);
  });
  // Sección móvil
  const my=cy0+rows.length*34+8;
  cx.fillStyle='#c8a060';cx.font='bold 10px monospace';cx.textAlign='left';
  cx.fillText(TX('helpMobile')+':',col1,my);
  cx.fillStyle='#998866';cx.font='9px monospace';
  cx.fillText(TX('helpMobileDesc'),col1,my+14);
  // Sección historia
  cx.fillStyle='#cc88ff';cx.font='bold 9px monospace';
  cx.fillText(TX('helpStory')+':',col1,my+32);
  cx.fillStyle='#998866';cx.font='9px monospace';
  cx.fillText(TX('helpStoryNav'),col1,my+44);
  // Cierre
  cx.fillStyle='#555544';cx.font='9px monospace';cx.textAlign='center';
  cx.fillText(TX('helpClose'),W/2,py+ph-12);
  cx.textAlign='left';
}
function drawHelpButton(){
  const bw=18,bh=18,bx=W-bw-8,by=H-bh-28; // encima del botón de idioma
  cx.fillStyle=showHelp?'#5a3010':'rgba(0,0,0,0.55)';cx.fillRect(bx,by,bw,bh);
  cx.strokeStyle='#5a4010';cx.lineWidth=1;cx.strokeRect(bx,by,bw,bh);
  cx.fillStyle='#ffd700';cx.font='bold 11px monospace';cx.textAlign='center';
  cx.fillText('?',bx+bw/2,by+13);cx.textAlign='left';
}

  ];
  // Reset camera to full-arena view at fight start (no zoom carry-over)
  camZoom = 1.0; camX = W / 2; camY = PLAT.y - 60;
  _camTgtZoom = 1.0; _camTgtX = W / 2; _camTgtY = PLAT.y - 60;
}

function updateCamera(dt) {
  if (F.length < 2) return;
  const f0 = F[0], f1 = F[1];
  const c0x = f0.x + f0.w * 0.5, c0y = f0.y + f0.h * 0.5;
  const c1x = f1.x + f1.w * 0.5, c1y = f1.y + f1.h * 0.5;

  // Target camera center: midpoint of both fighters, slight upward bias
  _camTgtX = (c0x + c1x) * 0.5;
  _camTgtY = (c0y + c1y) * 0.5 - 22;

  // Target zoom: closer fighters → zoom in, farther → zoom out
  const spanX = Math.abs(c0x - c1x) + 340; // 170px padding on each side
  _camTgtZoom = Math.max(1.0, Math.min(2.2, W / Math.max(spanX, 300)));

  // Clamp camera so we never reveal void outside world bounds
  const hw = (W * 0.5) / _camTgtZoom;
  const hh = (H * 0.5) / _camTgtZoom;
  _camTgtX = Math.max(hw, Math.min(W - hw, _camTgtX));
  _camTgtY = Math.max(hh, Math.min(H - hh, _camTgtY));

  // Smooth lerp — cinematic feel, not snappy
  const alpha = Math.min(1, dt * 0.0038);
  camZoom += (_camTgtZoom - camZoom) * alpha;
  camX    += (_camTgtX - camX)       * alpha;
  camY    += (_camTgtY - camY)       * alpha;
}

let audioCtx = null;
let masterGain = null;
let musicIntervalId = null;

function getAC() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.28;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, startT, dur, type='square', vol=0.12) {
  const ac = getAC();
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, startT);
  g.gain.exponentialRampToValueAtTime(0.0001, startT + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(startT); osc.stop(startT + dur + 0.05);
}

function playDrum(startT, freq=90, vol=0.35) {
  const ac = getAC();
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startT);
  osc.frequency.exponentialRampToValueAtTime(20, startT + 0.18);
  g.gain.setValueAtTime(vol, startT);
  g.gain.exponentialRampToValueAtTime(0.0001, startT + 0.22);
  osc.connect(g); g.connect(masterGain);
  osc.start(startT); osc.stop(startT + 0.3);
}

function playSnare(startT, vol=0.1) {
  const ac = getAC();
  const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.12), ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1);
  const src = ac.createBufferSource();
  const filt = ac.createBiquadFilter();
  const g = ac.createGain();
  src.buffer = buf;
  filt.type = 'highpass'; filt.frequency.value = 1800;
  g.gain.setValueAtTime(vol, startT);
  g.gain.exponentialRampToValueAtTime(0.0001, startT + 0.12);
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(startT);
}

// ── Humoformic Mysticism — reverb + glitch audio system ──────
let reverbConvolver = null;
let reverbSend     = null; // gain into reverb (wet)
let droneSrc       = null; // ambient drone oscillator

function initReverb(ac) {
  if (reverbConvolver) return;
  // Synthetic stone-cave impulse response (~1.8s, dark decay)
  const sRate = ac.sampleRate;
  const len   = Math.floor(sRate * 1.85);
  const buf   = ac.createBuffer(2, len, sRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      // soft noise with exponential decay + slight early reflections
      const decay  = Math.pow(1 - i / len, 2.4);
      const early  = i < sRate * 0.04 ? 0.8 : 0.25;
      d[i] = (Math.random() * 2 - 1) * decay * early;
    }
  }
  reverbConvolver = ac.createConvolver();
  reverbConvolver.buffer = buf;
  reverbSend = ac.createGain();
  reverbSend.gain.value = 0.18;           // wet mix
  reverbConvolver.connect(reverbSend);
  reverbSend.connect(masterGain);
}

// route a gain node also into reverb
function sendToReverb(gainNode) {
  if (reverbConvolver) gainNode.connect(reverbConvolver);
}

// Bitcrushed digital glitch burst (ancestral-digital fusion)
function playGlitch(startT) {
  const ac  = getAC();
  const len = Math.floor(ac.sampleRate * 0.038);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d   = buf.getChannelData(0);
  let held  = 0;
  for (let i = 0; i < len; i++) {
    if (i % 6 === 0) held = (Math.random() * 2 - 1); // 6-bit crush
    d[i] = held;
  }
  const src  = ac.createBufferSource();
  const filt = ac.createBiquadFilter();
  const g    = ac.createGain();
  src.buffer = buf;
  filt.type  = 'bandpass';
  filt.frequency.value = 2800;
  filt.Q.value         = 1.2;
  g.gain.setValueAtTime(0.028, startT);
  g.gain.exponentialRampToValueAtTime(0.0001, startT + 0.038);
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(startT);
}

// Ambient smoke-drone (continuous bass oscillator during fight)
function startDrone() {
  stopDrone();
  const ac = getAC();
  initReverb(ac);
  const osc1 = ac.createOscillator(); // root D
  const osc2 = ac.createOscillator(); // detuned fifth A
  const lfo  = ac.createOscillator(); // slow tremolo LFO
  const lfoG = ac.createGain();
  const g    = ac.createGain();
  osc1.type = 'sine'; osc1.frequency.value = 73.42;   // D2
  osc2.type = 'sine'; osc2.frequency.value = 110.06;  // A2 (slightly detuned)
  lfo.type  = 'sine'; lfo.frequency.value  = 0.18;    // 0.18 Hz tremolo
  lfoG.gain.value = 0.028;
  g.gain.value    = 0.065;
  lfo.connect(lfoG); lfoG.connect(g.gain);
  osc1.connect(g); osc2.connect(g);
  g.connect(masterGain);
  sendToReverb(g);
  osc1.start(); osc2.start(); lfo.start();
  droneSrc = { osc1, osc2, lfo, g };
}

function stopDrone() {
  if (!droneSrc) return;
  try {
    droneSrc.osc1.stop(); droneSrc.osc2.stop(); droneSrc.lfo.stop();
  } catch(e) {}
  droneSrc = null;
}

// ── Thunder strike — layered noise crack + sub-bass boom + rumble tail ──
function playThunderStrike(ac) {
  const t0 = ac.currentTime, sr = ac.sampleRate;

  // 1. Crack — sharp ionization pop (noise → bandpass)
  const cBuf = ac.createBuffer(1, Math.floor(sr * 0.14), sr);
  const cD = cBuf.getChannelData(0);
  for (let i = 0; i < cD.length; i++) cD[i] = Math.random() * 2 - 1;
  const cSrc = ac.createBufferSource(); cSrc.buffer = cBuf;
  const cFilt = ac.createBiquadFilter();
  cFilt.type = 'bandpass'; cFilt.frequency.value = 1100; cFilt.Q.value = 0.45;
  const cG = ac.createGain();
  cG.gain.setValueAtTime(3.8, t0);
  cG.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
  cSrc.connect(cFilt); cFilt.connect(cG); cG.connect(masterGain);
  if (reverbConvolver) cG.connect(reverbConvolver);
  cSrc.start(t0);

  // 2. Boom body — low filtered noise swell
  const bBuf = ac.createBuffer(1, Math.floor(sr * 2.0), sr);
  const bD = bBuf.getChannelData(0);
  for (let i = 0; i < bD.length; i++) bD[i] = Math.random() * 2 - 1;
  const bSrc = ac.createBufferSource(); bSrc.buffer = bBuf;
  const bFilt = ac.createBiquadFilter();
  bFilt.type = 'lowpass'; bFilt.frequency.value = 160; bFilt.Q.value = 0.9;
  const bG = ac.createGain();
  bG.gain.setValueAtTime(0.001, t0);
  bG.gain.linearRampToValueAtTime(3.0, t0 + 0.06);
  bG.gain.exponentialRampToValueAtTime(0.001, t0 + 2.0);
  bSrc.connect(bFilt); bFilt.connect(bG); bG.connect(masterGain);
  if (reverbConvolver) bG.connect(reverbConvolver);
  bSrc.start(t0);

  // 3. Sub-bass floor shake — 26 Hz sine, hits like a fist
  const sOsc = ac.createOscillator();
  sOsc.type = 'sine';
  sOsc.frequency.setValueAtTime(26, t0);
  sOsc.frequency.exponentialRampToValueAtTime(14, t0 + 0.9);
  const sG = ac.createGain();
  sG.gain.setValueAtTime(0.001, t0);
  sG.gain.linearRampToValueAtTime(3.2, t0 + 0.05);
  sG.gain.exponentialRampToValueAtTime(0.001, t0 + 1.1);
  sOsc.connect(sG); sG.connect(masterGain);
  sOsc.start(t0); sOsc.stop(t0 + 1.2);

  // 4. Rumble tail — 60 Hz bandpass noise, long decay
  const rBuf = ac.createBuffer(1, Math.floor(sr * 3.2), sr);
  const rD = rBuf.getChannelData(0);
  for (let i = 0; i < rD.length; i++) rD[i] = Math.random() * 2 - 1;
  const rSrc = ac.createBufferSource(); rSrc.buffer = rBuf;
  const rFilt = ac.createBiquadFilter();
  rFilt.type = 'bandpass'; rFilt.frequency.value = 60; rFilt.Q.value = 0.65;
  const rG = ac.createGain();
  rG.gain.setValueAtTime(0.001, t0 + 0.08);
  rG.gain.linearRampToValueAtTime(1.4, t0 + 0.22);
  rG.gain.exponentialRampToValueAtTime(0.001, t0 + 3.2);
  rSrc.connect(rFilt); rFilt.connect(rG); rG.connect(masterGain);
  if (reverbConvolver) rG.connect(reverbConvolver);
  rSrc.start(t0 + 0.04);
}

// ── Title screen rain storm ──────────────────────────────────
let rainStorm = null;
let thunderFlashT = -9999;
let thunderBoltX  = 400;

function startTitleRain() {
  stopTitleRain();
  const ac = getAC();
  initReverb(ac);

  // Build a 3-second looping noise buffer
  const sRate = ac.sampleRate;
  const bufLen = sRate * 3;
  const noiseBuf = ac.createBuffer(2, bufLen, sRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = noiseBuf.getChannelData(ch);
    for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;
  }

  // ── Rain layer: bandpass white noise ~2.4kHz ──
  const rainSrc = ac.createBufferSource();
  rainSrc.buffer = noiseBuf;
  rainSrc.loop = true;

  const rainFilt = ac.createBiquadFilter();
  rainFilt.type = 'bandpass';
  rainFilt.frequency.value = 2400;
  rainFilt.Q.value = 0.45;

  const rainGain = ac.createGain();
  rainGain.gain.value = 0;

  rainSrc.connect(rainFilt);
  rainFilt.connect(rainGain);
  rainGain.connect(masterGain);
  sendToReverb(rainGain);

  // ── Heavy-drop layer: bandpass ~900Hz ──
  const dropSrc = ac.createBufferSource();
  dropSrc.buffer = noiseBuf;
  dropSrc.loop = true;
  dropSrc.loopStart = 0.3;

  const dropFilt = ac.createBiquadFilter();
  dropFilt.type = 'bandpass';
  dropFilt.frequency.value = 900;
  dropFilt.Q.value = 0.6;

  const dropGain = ac.createGain();
  dropGain.gain.value = 0;

  dropSrc.connect(dropFilt);
  dropFilt.connect(dropGain);
  dropGain.connect(masterGain);

  // ── Wind layer: lowpass noise + slow LFO ──
  const windSrc = ac.createBufferSource();
  windSrc.buffer = noiseBuf;
  windSrc.loop = true;
  windSrc.loopStart = 0.8;

  const windFilt = ac.createBiquadFilter();
  windFilt.type = 'lowpass';
  windFilt.frequency.value = 380;
  windFilt.Q.value = 1.2;

  const windLFO = ac.createOscillator();
  windLFO.type = 'sine';
  windLFO.frequency.value = 0.08;
  const windLFOGain = ac.createGain();
  windLFOGain.gain.value = 0.035;
  windLFO.connect(windLFOGain);

  const windGain = ac.createGain();
  windGain.gain.value = 0;
  windLFOGain.connect(windGain.gain);

  windSrc.connect(windFilt);
  windFilt.connect(windGain);
  windGain.connect(masterGain);
  sendToReverb(windGain);

  // ── Thunder rumble: very-low oscillator + noise ──
  const rumbleOsc = ac.createOscillator();
  rumbleOsc.type = 'sine';
  rumbleOsc.frequency.value = 48;

  const rumbleLFO = ac.createOscillator();
  rumbleLFO.type = 'sine';
  rumbleLFO.frequency.value = 0.22;
  const rumbleLFOGain = ac.createGain();
  rumbleLFOGain.gain.value = 18;
  rumbleLFO.connect(rumbleLFOGain);
  rumbleLFOGain.connect(rumbleOsc.frequency);

  const rumbleGain = ac.createGain();
  rumbleGain.gain.value = 0;
  rumbleOsc.connect(rumbleGain);
  rumbleGain.connect(masterGain);

  // Start all sources
  const now = ac.currentTime;
  rainSrc.start(now); dropSrc.start(now + 0.05);
  windSrc.start(now + 0.1); windLFO.start(now);
  rumbleOsc.start(now); rumbleLFO.start(now);

  // Fade in over 2.2 s
  rainGain.gain.linearRampToValueAtTime(0.18, now + 2.2);
  dropGain.gain.linearRampToValueAtTime(0.10, now + 2.2);
  windGain.gain.linearRampToValueAtTime(0.09, now + 2.2);
  rumbleGain.gain.linearRampToValueAtTime(0.055, now + 2.2);

  // Occasional distant thunder crack
  function scheduleThunder() {
    if (!rainStorm) return;
    const delay = 6 + Math.random() * 14;
    rainStorm._tId = setTimeout(() => {
      if (!rainStorm) return;
      try {
        const ac2 = getAC();
        playThunderStrike(ac2);
        thunderFlashT = performance.now();
        thunderBoltX  = 80 + Math.floor(Math.random() * 640);
        playElevenLabsThunder();
      } catch(e) {}
      scheduleThunder();
    }, delay * 1000);
  }
  scheduleThunder();

  rainStorm = { rainSrc, rainGain, dropSrc, dropGain, windSrc, windGain, windLFO, rumbleOsc, rumbleLFO, rumbleGain, _tId: null };
}

function stopTitleRain() {
  if (!rainStorm) return;
  const storm = rainStorm;
  rainStorm = null;
  if (storm._tId) clearTimeout(storm._tId);
  try {
    const ac = getAC(), now = ac.currentTime;
    // Disconnect windLFO from windGain.gain before ramp so LFO audio-rate
    // modulation can't keep the gain nonzero after linearRamp reaches 0
    try { storm.windLFO.disconnect(); } catch(e) {}
    [storm.rainGain, storm.dropGain, storm.windGain, storm.rumbleGain].forEach(g => {
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(0, now + 0.8);
    });
    setTimeout(() => {
      [storm.rainSrc, storm.dropSrc, storm.windSrc, storm.windLFO, storm.rumbleOsc, storm.rumbleLFO]
        .forEach(n => { try { n.stop(); } catch(e) {} });
    }, 900);
  } catch(e) {}
}

// Teponaztli – two-tone wooden slit drum (square wave knock)
function playTeponaztli(startT, high) {
  const ac = getAC();
  const freq = high ? 460 : 310;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq, startT);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.55, startT + 0.06);
  g.gain.setValueAtTime(0.17, startT);
  g.gain.exponentialRampToValueAtTime(0.0001, startT + 0.09);
  osc.connect(g); g.connect(masterGain);
  osc.start(startT); osc.stop(startT + 0.12);
}

// Ayacachtli – gourd rattle / shaker
function playShaker(startT) {
  const ac = getAC();
  const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.055), ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const src = ac.createBufferSource();
  const filt = ac.createBiquadFilter();
  const g = ac.createGain();
  src.buffer = buf;
  filt.type = 'highpass'; filt.frequency.value = 5000;
  g.gain.setValueAtTime(0.06, startT);
  g.gain.exponentialRampToValueAtTime(0.0001, startT + 0.05);
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(startT);
}

// Tecciztli – conch shell horn blast
function playConch(startT) {
  const ac = getAC();
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(116, startT);
  osc.frequency.linearRampToValueAtTime(142, startT + 0.28);
  g.gain.setValueAtTime(0, startT);
  g.gain.linearRampToValueAtTime(0.13, startT + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, startT + 0.75);
  osc.connect(g); g.connect(masterGain);
  osc.start(startT); osc.stop(startT + 0.85);
}

    }

    // Huehuetl drum hit
    if (theme.drm[step]) playDrum(t, theme.echo ? 58 : 62, theme.echo ? 0.55 : 0.44);
    // Teponaztli – alternates high/low
    if (theme.tep && theme.tep[step]) playTeponaztli(t, musicStep % 2 === 0);
    // Ayacachtli shaker (quieter in fight for atmospheric feel)
    if (theme.shk && theme.shk[step]) playShaker(t);
    // Conch horn accent (reverb-fed in fight)
    if (theme.con && theme.con[step]) {
      playConch(t);
      if (theme.echo && reverbConvolver) {
        // schedule an attenuated echo of conch through reverb
        setTimeout(() => {
          try {
            const ac3=getAC(); const o=ac3.createOscillator(),gg=ac3.createGain();
            o.type='sawtooth'; o.frequency.setValueAtTime(116,ac3.currentTime);
            o.frequency.linearRampToValueAtTime(134,ac3.currentTime+0.2);
            gg.gain.setValueAtTime(0.04,ac3.currentTime);
            gg.gain.exponentialRampToValueAtTime(0.0001,ac3.currentTime+0.6);
            o.connect(gg); gg.connect(reverbConvolver); o.start(); o.stop(ac3.currentTime+0.65);
          } catch(e){}
        }, 300);
      }
    }
    // Digital glitch artifact (Humoformic digital layer)
    if (theme.glitch && musicStep % 7 === 3 && Math.random() < 0.35) {
      playGlitch(t);
    }

    musicNextTime += stepDur;
    musicStep++;
  }
}

function startChiptune(name) {
  const theme = THEMES[name];
  if (!theme) return;
  const ac = getAC();
  if (theme.echo) { initReverb(ac); startDrone(); }
  else stopDrone();
  musicStep = 0;
  musicNextTime = ac.currentTime + 0.05;
  currentThemeData = theme;
  musicIntervalId = setInterval(() => { if (currentThemeData) scheduleMusic(currentThemeData); }, 40);
}

function startMusic(name) {
  if (musicIntervalId) { clearInterval(musicIntervalId); musicIntervalId = null; }
  currentThemeData = null;
  stopDrone();
  if (bgAudio) { bgAudio.pause(); bgAudio.currentTime = 0; bgAudio = null; }
  if (name === 'title') startTitleRain(); else stopTitleRain();

  // Intenta MP3 → MP4 → chiptune
  function tryPlay(exts) {
    if (!exts.length) { startChiptune(name); return; }
    const a = new Audio(`audio/${name}.${exts[0]}`);
    a.loop = true; a.volume = 0.5;
    a.play().then(() => { bgAudio = a; })
            .catch(() => tryPlay(exts.slice(1)));
  }
  tryPlay(['mp3', 'mp4']);
}

function stopMusic() {
  if (musicIntervalId) { clearInterval(musicIntervalId); musicIntervalId = null; }
  currentThemeData = null;
  stopDrone();
  stopTitleRain();
  if (bgAudio) { bgAudio.pause(); bgAudio.currentTime = 0; bgAudio = null; }
}

// ── God SFX system ───────────────────────────────────────────
// Groups: hit sounds are shared by elemental group (no gender distinction needed for impacts)
// hurt/special: female goddesses use _f variants; Ometeotl uses _dual
const _GOD_GROUP = ['wind','wind','fire','water','fire','earth','water','earth','earth','fire',
                    'dog','cosmos','cosmos','earth','flower','flower','flower'];
// hurt/special suffix per god: '' = base group, '_f' = feminine, '_dual' = Ometeotl
const _GOD_VOICE = ['','','','','','_f','_f','','_f','',
                    '','_f','_dual','','_f','','_f'];
const _GOD_WIN_NAME = ['tezcatlipoca','quetzalcoatl','huitzilopochtli','tlaloc','xipetotec',
                       'coatlicue','chalchihuitlicue','mictlantecuhtli','mictecacihuatl','tonatiuh',
                       'xolotl','coyolxauhqui','ometeotl','tlaltecuhtli','tlazolteotl',
                       'xochipilli','xochiquetzal'];

function _playGodAudio(path, vol, fallback) {
  const a = new Audio(path);
  a.volume = vol;
  a.play().catch(() => { if (fallback) fallback(); });
}

function sfxGodHit(godIdx) {
  const name = _GOD_WIN_NAME[godIdx];
  const g = _GOD_GROUP[godIdx] || 'fire';
  const a = new Audio(`audio/hit_${name}.ogg`);
  a.volume = 0.85;
  a.play().catch(() => {
    const fb = new Audio(`audio/hit_${g}.ogg`);
    fb.volume = 0.85;
    fb.play().catch(() => sfxHit(4));
  });
}

function sfxGodHurt(godIdx, severity, isKO) {
  const name = _GOD_WIN_NAME[godIdx];
  const g = _GOD_GROUP[godIdx] || 'fire';
  const v = _GOD_VOICE[godIdx] || '';
  if (isKO) {
    // The killing blow gets a quiet defeat murmur, not the same full-volume pained
    // cry as a mid-fight hit — silent by design if lose_{name}.ogg doesn't exist yet.
    const ko = new Audio(`audio/lose_${name}.ogg`);
    ko.volume = 0.5;
    ko.play().catch(() => {});
    return;
  }
  const sev = severity ?? 0.5; // same _hitSeverity signal already driving knockback/hitstun/face reaction
  const vol = Math.min(1, Math.max(0.35, 0.80 + (sev-0.5)*0.5));
  const sevRate = 1-(sev-0.5)*0.24;
  // Unique per-god voice first — falls back to the shared elemental-group file
  // (with its _f pitch-up hack) only if this god has no unique file yet.
  const a = new Audio(`audio/hurt_${name}.ogg`);
  a.volume = vol;
  a.playbackRate = sevRate;
  a.play().catch(() => {
    const fb = new Audio(`audio/hurt_${g}${v}.ogg`);
    fb.volume = vol;
    fb.playbackRate = (v==='_f'?1.35:1) * sevRate;
    fb.play().catch(() => {});
  });
}

function sfxGodSpecial(godIdx) {
  const name = _GOD_WIN_NAME[godIdx];
  const g = _GOD_GROUP[godIdx] || 'fire';
  const v = _GOD_VOICE[godIdx] || '';
  sfxSpecial(godIdx);
  const a = new Audio(`audio/special_${name}.ogg`);
  a.volume = 0.90;
  a.play().catch(() => {
    const base = new Audio(`audio/special_${g}${v}.ogg`);
    base.volume = 0.90;
    if (v==='_f') base.playbackRate = 1.35;
    base.play().catch(() => sfxSpecial(godIdx));
  });
}

function sfxGodWin(godIdx) {
  const name = _GOD_WIN_NAME[godIdx];
  if (!name) { sfxWin(); return; }
  _playGodAudio(`audio/win_${name}.ogg`, 1.0, sfxWin);
}

function sfxGodProjectile(godIdx) {
  const name = _GOD_WIN_NAME[godIdx];
  const g = _GOD_GROUP[godIdx] || 'fire';
  _playGodAudio(`audio/whoosh_${name}.ogg`, 0.65, () => _playGodAudio(`audio/whoosh_${g}.ogg`, 0.65, null));
}

function sfxGodSelect(godIdx) {
  const name = _GOD_WIN_NAME[godIdx];
  _playGodAudio(`audio/select_${name}.ogg`, 0.85, null);
}

// ── Ambient sound system ─────────────────────────────────────
let _ambientAudio = null;
let _rainAudio    = null;
let _microTimers  = [];

function startAmbient(name, vol) {
  if (_ambientAudio && _ambientAudio._name === name) return;
  stopAmbient();
  const a = new Audio(`audio/${name}.ogg`);
  a.volume = 0; a.loop = true; a._name = name;
  a.play().catch(() => {});
  // Fade in over 1.5s
  const step = () => { a.volume = Math.min(a.volume + 0.025, vol); if (a.volume < vol) setTimeout(step, 60); };
  setTimeout(step, 60);
  _ambientAudio = a;
}

function stopAmbient() {
  if (!_ambientAudio) return;
  const a = _ambientAudio; _ambientAudio = null;
  const fade = () => { a.volume = Math.max(a.volume - 0.04, 0); if (a.volume > 0) setTimeout(fade, 60); else a.pause(); };
  fade();
}

let _voiceAudio = null;
function startVoiceAmbient(name, vol) {
  if (_voiceAudio && _voiceAudio._name === name && Math.abs(_voiceAudio.volume - vol) < 0.02) return;
  stopVoiceAmbient();
  const a = new Audio(`audio/${name}.ogg`);
  a.volume = 0; a.loop = true; a._name = name;
  a.play().catch(() => {});
  const step = () => { a.volume = Math.min(a.volume + 0.015, vol); if (a.volume < vol) setTimeout(step, 80); };
  setTimeout(step, 80);
  _voiceAudio = a;
}
function stopVoiceAmbient() {
  if (!_voiceAudio) return;
  const a = _voiceAudio; _voiceAudio = null;
  const fade = () => { a.volume = Math.max(a.volume - 0.02, 0); if (a.volume > 0) setTimeout(fade, 80); else a.pause(); };
  fade();
}

function startRainAmbient() {
  if (_rainAudio) return;
  const a = new Audio('audio/ambient_rain.ogg');
  a.volume = 0; a.loop = true;
  a.play().catch(() => {});
  const step = () => { a.volume = Math.min(a.volume + 0.02, 0.55); if (a.volume < 0.55) setTimeout(step, 80); };
  setTimeout(step, 80);
  _rainAudio = a;
}

function stopRainAmbient() {
  if (!_rainAudio) return;
  const a = _rainAudio; _rainAudio = null;
  const fade = () => { a.volume = Math.max(a.volume - 0.03, 0); if (a.volume > 0) setTimeout(fade, 80); else a.pause(); };
  fade();
}

function startMicroAmbients() {
  stopMicroAmbients();
  const schedule = (files, minMs, maxMs, vol) => {
    const fire = () => {
      const f = files[Math.floor(Math.random() * files.length)];
      _playGodAudio(`audio/${f}.ogg`, vol, null);
      _microTimers.push(setTimeout(fire, minMs + Math.random() * (maxMs - minMs)));
    };
    _microTimers.push(setTimeout(fire, minMs + Math.random() * maxMs));
  };
  schedule(['micro_torch'], 8000, 14000, 0.28);
  schedule(['micro_water'], 11000, 18000, 0.32);
  schedule(['micro_wind'],  22000, 38000, 0.22);
}

function stopMicroAmbients() {
  _microTimers.forEach(t => clearTimeout(t));
  _microTimers = [];
}

// ── Keyboard input ──────────────────────────────────────────
const K = {};
const GAME_KEYS = new Set(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
  'KeyW','KeyA','KeyS','KeyD','KeyJ','KeyG','KeyK','KeyL','Semicolon','Enter','Escape','KeyF']);
window.addEventListener('keydown', e => {
  if (!e.ctrlKey && !e.metaKey) e.preventDefault();
  const fresh = !K[e.code];
  K[e.code] = true;
  if (fresh) onPress(e.code);
});
window.addEventListener('keyup', e => { K[e.code]=false; });

function onPress(c) {
  getAC(); // unlock audio on first keypress

  if(c==='Backquote'){ toggleLang(); return; }

  if(c==='Slash'||c==='F1'){ showHelp=!showHelp; return; }
  if(showHelp){ if(c==='Escape') showHelp=false; return; }

  if (gs===GS.LOADING) { gs=GS.TITLE; startMusic('title'); return; }

  if (gs===GS.TITLE) {
    if (c==='ArrowUp'||c==='KeyW')   titleSel=(titleSel+2)%3;
    if (c==='ArrowDown'||c==='KeyS') titleSel=(titleSel+1)%3;
    if (c==='Space'||c==='Enter'){
      if(titleSel===0){ storyMode=false; modeStep=0; gs=GS.MODE; startMusic('select'); }
      else if(titleSel===1){ gs=GS.STORY_MAP; startMusic('select'); }
      else { lorePageIdx=0; gs=GS.LORE; stopMusic(); }
    }
    return;
  }
  if (gs===GS.STORY_MAP) {
    if (c==='KeyA'||c==='ArrowLeft')  storyLevel=Math.max(0,storyLevel-1);
    if (c==='KeyD'||c==='ArrowRight'){
      const maxUnlocked=storyCompleted.length;
      storyLevel=Math.min(storyLevel+1,Math.min(maxUnlocked,STORY_LEVELS.length-1));
    }
    if (c==='KeyW'||c==='ArrowUp')    storyLevel=Math.max(0,storyLevel-5);
    if (c==='KeyS'||c==='ArrowDown'){
      const maxUnlocked=storyCompleted.length;
      storyLevel=Math.min(storyLevel+5,Math.min(maxUnlocked,STORY_LEVELS.length-1));
    }
    if (c==='Digit1') difficulty=0;
    if (c==='Digit2') difficulty=1;
    if (c==='Digit3') difficulty=2;
    if (c==='Space'||c==='Enter'){
      const unlocked=storyLevel===0||storyCompleted.includes(storyLevel-1);
      if(unlocked) startStoryLevel(storyLevel);
    }
    if (c==='Tab'){ historyScrollY=0; gs=GS.HISTORY; stopMusic(); }
    if (c==='Escape'){ titleSel=0; gs=GS.TITLE; startMusic('title'); }
    return;
  }
  if (gs===GS.CINEMATIC) {
    if (c==='Space'||c==='Enter'||c==='Escape'){ cinematicStartT=null; cinematicVoiced.clear(); lorePageIdx=0; gs=GS.LORE; }
    return;
  }
  if (gs===GS.LORE) {
    if (c==='ArrowRight'||c==='KeyD'||c==='Space'||c==='Enter') {
      if (lorePageIdx < LORE_PAGES.length-1) { lorePageIdx++; }
      else { historyScrollY=0; gs=GS.HISTORY; }
    }
    if (c==='ArrowLeft'||c==='KeyA') {
      if (lorePageIdx > 0) lorePageIdx--;
    }
    if (c==='Escape') { titleSel=0; gs=GS.TITLE; startMusic('title'); }
    return;
  }
  if (gs===GS.HISTORY) {
    if (c==='KeyW'||c==='ArrowUp')   historyScrollY=Math.max(0,historyScrollY-1);
    if (c==='KeyS'||c==='ArrowDown') historyScrollY=Math.min(historyScrollY+1,Math.max(0,battleHistory.length-7));
    if (c==='Escape'||c==='KeyA'||c==='Space'||c==='Enter') { titleSel=0; gs=GS.TITLE; startMusic('title'); }
    return;
  }
  if (gs===GS.DIALOGUE) {
    if (c==='Space'||c==='Enter') advanceDialogue();
    return;
  }
  if (gs===GS.STORY_END) {
    if (storyEndT < 9000) return;
    if (c==='ArrowLeft'||c==='KeyA')  storyEndSel=0;
    if (c==='ArrowRight'||c==='KeyD') storyEndSel= ngPlusUnlocked ? 1 : 0;
    if (c==='Escape') {
      storyMode=false; p1Ready=false; p2Ready=false;
      p1RoundWins=0; p2RoundWins=0; roundNum=1;
      titleSel=0; gs=GS.TITLE; startMusic('title');
    }
    if (c==='Space'||c==='Enter') {
      if (storyEndSel===1 && ngPlusUnlocked) {
        storyCompleted=[]; storyLevel=0; storyLives=STORY_MAX_LIVES;
        localStorage.setItem('wotg_story',JSON.stringify(storyCompleted));
        storyEndSel=0; gs=GS.STORY_MAP; startMusic('select');
      } else {
        storyMode=false; p1Ready=false; p2Ready=false;
        p1RoundWins=0; p2RoundWins=0; roundNum=1;
        titleSel=0; gs=GS.TITLE; startMusic('title');
      }
    }
    return;
  }
  if (gs===GS.MODE) {
    if (modeStep===0) {
      if (c==='KeyA'||c==='ArrowLeft')  { mode1P=true; }
      if (c==='KeyD'||c==='ArrowRight') { mode1P=false; }
      if (c==='Digit1') difficulty=0;
      if (c==='Digit2') difficulty=1;
      if (c==='Digit3') difficulty=2;
      if (c==='Space'||c==='Enter') {
        if (mode1P) { modeStep=1; }
        else        { gs=GS.PICK; }
      }
    } else {
      if (c==='ArrowLeft'||c==='KeyA')  difficulty=Math.max(0,difficulty-1);
      if (c==='ArrowRight'||c==='KeyD') difficulty=Math.min(2,difficulty+1);
      if (c==='Digit1') difficulty=0;
      if (c==='Digit2') difficulty=1;
      if (c==='Digit3') difficulty=2;
      if (c==='Escape'||c==='ArrowUp'||c==='KeyW') modeStep=0;
      if (c==='Space'||c==='Enter') gs=GS.PICK;
    }
    return;
  }
  if (gs===GS.PICK) {
    const _vsUnlocked=getVsUnlocked();
    if (!p1Ready) {
      if (c==='KeyA'||c==='ArrowLeft')  p1Cur=(p1Cur+NUM_GODS-1)%NUM_GODS;
      if (c==='KeyD'||c==='ArrowRight') p1Cur=(p1Cur+1)%NUM_GODS;
      if (c==='KeyW'||c==='ArrowUp') {
        const _c=6,_r=Math.ceil(NUM_GODS/_c);
        p1Cur=Math.min(((Math.floor(p1Cur/_c)+_r-1)%_r)*_c+p1Cur%_c,NUM_GODS-1);
      }
      if (c==='KeyS'||c==='ArrowDown') {
        const _c=6,_r=Math.ceil(NUM_GODS/_c);
        p1Cur=Math.min(((Math.floor(p1Cur/_c)+1)%_r)*_c+p1Cur%_c,NUM_GODS-1);
      }
      if ((c==='Space'||c==='Enter') && _vsUnlocked.has(p1Cur)) {
        p1Choice=p1Cur; p1Ready=true;
      }
    }
    if (!mode1P&&!p2Ready) {
      if (c==='KeyJ') p2Cur=(p2Cur+NUM_GODS-1)%NUM_GODS;
      if (c==='KeyL') p2Cur=(p2Cur+1)%NUM_GODS;
      if (c==='KeyK' && _vsUnlocked.has(p2Cur)) { p2Choice=p2Cur; p2Ready=true; }
    }
    if (p1Ready&&(mode1P||p2Ready)) {
      if (mode1P) { const _unl=[...getVsUnlocked()]; const _opts=_unl.filter(i=>i!==p1Choice); p2Choice=_opts.length?_opts[Math.floor(Math.random()*_opts.length)]:(p1Choice+1)%NUM_GODS; }
      const _vsp=[...new Set([...GOD_SCENARIOS[p1Choice],...GOD_SCENARIOS[p2Choice]])];
      currentScenario=_vsp[Math.floor(Math.random()*_vsp.length)];
      storyMode=false;
      gs=GS.ANNOUNCE; announceT=0;
      stopMusic(); sfxAnnounce(); startMusic('fight');
    }
    if (c==='Escape') { p1Ready=false; p2Ready=false; gs=GS.MODE; modeStep=mode1P?1:0; }
    return;
  }
  if (gs===GS.FIGHT) {
    if (c==='KeyP') { paused=!paused; if(paused){ K._p1j=K._p1a=K._p1s=K._p2j=K._p2a=K._p2s=false; } return; }
    if (!paused) {
      if (c==='KeyW'||c==='Space') K._p1j=true;
      if (c==='KeyJ')              K._p1a=true;
      if (c==='KeyG')              K._p1s=true;
      if (c==='ArrowUp')           K._p2j=true;
      if (c==='KeyL')              K._p2a=true;
      if (c==='Semicolon')         K._p2s=true;
    }
    if (c==='Escape') { paused=false; stopMusic(); specials=[]; F=[]; p1Ready=false; p2Ready=false; p1RoundWins=0; p2RoundWins=0; roundNum=1; titleSel=0; gs=GS.TITLE; startMusic('title'); }
  }
  if ((gs===GS.ANNOUNCE||gs===GS.ROUND_END) && c==='Escape') {
    stopMusic(); specials=[]; F=[]; p1Ready=false; p2Ready=false; p1RoundWins=0; p2RoundWins=0; roundNum=1; titleSel=0; gs=GS.TITLE; startMusic('title');
  }
  if (gs===GS.WIN&&(c==='Space'||c==='Enter'||c==='Escape')) {
    p1Ready=false; p2Ready=false;
    p1RoundWins=0; p2RoundWins=0; roundNum=1;
    winT=0; titleSel=0; gs=GS.TITLE; startMusic('title');
  }
}

// ── Canvas touch ────────────────────────────────────────────
const PICK_CW=75, PICK_GAP=4;
const PICK_CH=100;
const PICK_R1N=6, PICK_R2N=6, PICK_R3N=5;
const PICK_R1W=PICK_R1N*PICK_CW+(PICK_R1N-1)*PICK_GAP;
const PICK_R2W=PICK_R2N*PICK_CW+(PICK_R2N-1)*PICK_GAP;
const PICK_R3W=PICK_R3N*PICK_CW+(PICK_R3N-1)*PICK_GAP;
const PICK_R1X=5;
const PICK_R2X=5;
const PICK_R3X=5;
const PICK_R1Y=50, PICK_R2Y=156, PICK_R3Y=262;
const PICK_CARD_X=482, PICK_CARD_W=313;

function canvasToGame(touch) {
  const r = cv.getBoundingClientRect();
  return { x:(touch.clientX-r.left)*(W/r.width), y:(touch.clientY-r.top)*(H/r.height) };
}
function handleCanvasPos(pos){
  // Pause overlay buttons (checked first — while paused, taps go to Resume/Quit, not other UI)
  if(gs===GS.FIGHT&&paused){
    const bw=140,bh=24,bx=W/2-bw/2,rby=H/2-4,qby=H/2+26;

function spawnDot(x,y){
  const d=document.createElement('div');
  d.className='touch-dot';
  d.style.left=x+'px'; d.style.top=y+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),260);
}
// Left zone — hold left half: move left, hold right half: move right
//             quick tap (<190ms, <22px) OR swipe up (>38px up): jump
(function(){
  const el=document.getElementById('zone-left'); if(!el) return;
  const pts=new Map();
  function sync(){
    const r=el.getBoundingClientRect(); let L=false,R=false;
    const now=Date.now();
    // skip touches held <60ms — still deciding if tap-jump or movement hold
    pts.forEach(p=>{ if(now-p.t0<60) return; if(p.cx-r.left<r.width*0.5) L=true; else R=true; });
    K['KeyA']=L; K['KeyD']=R;
  }
  el.addEventListener('touchstart',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      spawnDot(t.clientX,t.clientY);
      pts.set(t.identifier,{sx:t.clientX,sy:t.clientY,cx:t.clientX,cy:t.clientY,t0:Date.now(),jumped:false});
    }
    sync();
  },{passive:false});
  el.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      const p=pts.get(t.identifier); if(!p) continue;
      // only allow swipe-up jump in first 350ms — prevents accidental jump during long movement holds
      if(!p.jumped&&Date.now()-p.t0<350&&p.sy-t.clientY>38){p.jumped=true;onPress('KeyW');}
      p.cx=t.clientX; p.cy=t.clientY;
    }
    sync();
  },{passive:false});
  el.addEventListener('touchend',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      const p=pts.get(t.identifier); if(!p) continue;
      if(!p.jumped&&Date.now()-p.t0<190&&Math.abs(t.clientX-p.sx)<22&&Math.abs(t.clientY-p.sy)<22)
        onPress('KeyW');
      pts.delete(t.identifier);
    }
    sync();
  },{passive:false});
  el.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)pts.delete(t.identifier);sync();},{passive:false});
})();
// Right zones — special (top 40%), defense (bottom-left), attack (bottom-right)
function wireZone(id,key,oneShot){
  const el=document.getElementById(id); if(!el) return;
  const ids=new Set();
  el.addEventListener('touchstart',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){spawnDot(t.clientX,t.clientY);ids.add(t.identifier);}
    K[key]=true; if(oneShot)oneShot.forEach(c=>onPress(c));
  },{passive:false});
  el.addEventListener('touchend',e=>{
    e.preventDefault();
    for(const t of e.changedTouches)ids.delete(t.identifier);
    if(!ids.size)K[key]=false;
  },{passive:false});
  el.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)ids.delete(t.identifier);if(!ids.size)K[key]=false;},{passive:false});
}

// ── Physics ─────────────────────────────────────────────────
function stepFighter(f, il, ir, ij, ia) {
  if(f.hitstun>0){f.hitstun--;il=ir=ij=ia=false;}
  const g=GODS[f.godIdx], spd=BASE_SPD*g.sm;
  if      (il){f.vx=-spd;f.facing=-1;}
  else if (ir){f.vx= spd;f.facing= 1;}
  else        {f.vx*=FRIC;if(Math.abs(f.vx)<0.1)f.vx=0;}
  // ── God passives — per-physics-step effects (Chalchihuitlicue, Mictecacíhuatl, Tláloc, Xochipilli, etc.) ──
  if(g&&g.passiveStep) g.passiveStep(f, il, ir);
  if(f.onGround&&Math.abs(f.vx)>0.3) f.stepT++;
  else if(f.onGround) f.stepT=0;
  if(ij&&f.jumpsLeft>0){
    const _isFirstJ=f.jumpsLeft===f.maxJumps;
    f.vy=(f.jumpsLeft===f.maxJumps?BASE_J:BASE_DJ)*g.jm;
    f.jumpsLeft--;
    if(f.jumpsLeft<f.maxJumps-1) f.djTimer=18;
    if(_isFirstJ){
      for(let _di=0;_di<5;_di++) specials.push({type:'dust',x:f.x+4+_di*(f.w-8)/4,y:f.y+f.h,
        vx:(Math.random()-0.5)*2.2,vy:-(0.6+Math.random()*0.8),life:12+Math.round(Math.random()*6),maxLife:12,w:3,h:2});
    } else {
      const _jc=g.hi||g.acc||'#ccaaff';
      for(let _di=0;_di<8;_di++){const _a=(_di/8)*Math.PI*2;
        specials.push({type:'spark',x:f.x+Math.round(f.w/2),y:f.y+Math.round(f.h/2),
          vx:Math.cos(_a)*3,vy:Math.sin(_a)*3,life:16,maxLife:16,color:_jc});}
    }
  }
  const _grav=(currentScenario==='omeyocan'&&f.x+f.w/2>W/2)?GRAV*0.38:GRAV; // void side = low gravity
  f.vy=Math.min(f.vy+_grav,MAXFALL);
  f.x+=f.vx; f.y+=f.vy;
  if(f.djTimer>0) f.djTimer--;
  if(f.atkCD>0)   f.atkCD--;
  if(f.knockCD>0) f.knockCD--;
  if(ia&&f.atkCD===0){f.atkTimer=14;f.atkCD=30;}
  if(f.atkTimer>0){
    f.atkTimer--;
    if(f.atkTimer>0&&f.atkTimer<=9) // 5 startup frames, then hitbox activates
      f.hitbox={x:f.facing===1?f.x+f.w:f.x-30,y:f.y+4,w:30,h:26};
    else f.hitbox=null;
  } else f.hitbox=null;
  f.onGround=false;
  const pfy=(f.y-f.vy)+f.h;
  if(f.vy>=0&&pfy<=PLAT.y+1&&f.y+f.h>=PLAT.y&&f.x+f.w>PLAT.x+6&&f.x<PLAT.x+PLAT.w-6){
    const _fvy=f.vy;
    f.y=PLAT.y-f.h;f.vy=0;f.onGround=true;f.jumpsLeft=f.maxJumps;
    if(_fvy>3){
      for(let di=0;di<6;di++){
        specials.push({type:'dust',x:f.x+3+Math.random()*(f.w-6),y:PLAT.y,
          vx:(Math.random()-0.5)*1.8,vy:-(0.5+Math.random()*0.8),
          life:12+Math.round(Math.random()*8),maxLife:12,
          w:3+Math.round(Math.random()*4),h:3+Math.round(Math.random()*4)});
      }
    }
  }
  if(f.specialCD>0) f.specialCD--;
  if(f.rage>0) f.rage--;
  if(f.specTimer>0) f.specTimer--;
  // ── God passives — per-physics-step effects (dispatched earlier, see top of function) ──
  // General: Xólotl paralysis stun (applied to any fighter stunned by Xólotl)
  if((f._stunFrames||0)>0){f.vx=0;f._stunFrames--;}
  // General: Xochiquétzal curse mark decay (counts down on any marked fighter)
  if((f._xochMark||0)>0) f._xochMark--;
}

function aiTick(ai, tgt) {
  let il=false,ir=false,ij=false,ia=false,is=false;
  const d=DIFF_AI[difficulty];
  const gAI=GOD_AI[ai.godIdx]||GOD_AI[12];
  const dx=tgt.x-ai.x, dist=Math.abs(dx);
  // ── Bounded-awareness: record this tick's read of the target, then hard-cap the window ──
  const tgtAction = tgt.specTimer>0 ? 'special'
    : (tgt.hitbox || tgt.atkTimer>0) ? 'attack'
    : !tgt.onGround ? 'jump'
    : 'idle';
  ai.awareness.push({dx, action:tgtAction});
  if(ai.awareness.length>AWARENESS_WINDOW) ai.awareness.shift();
  ai.aiTimer--;
  if(ai.aiTimer<=0){
    ai.aiTimer=Math.round((d.tMin+Math.floor(Math.random()*d.tRng))*gAI.patience);
    const pressAdv=(tgt.hitstun||0)>4;                  // target still reeling from a real hit — press it
    const rattled=!gAI.fearless&&ai.hp/ai.maxHp<=0.25&&!(ai.rage>0); // real danger; rage/fearlessness override it
    // ── Bounded-awareness read: fraction of the window spent attacking, and whether ──
    // ── distance has been closing. Both are 0 until the buffer has at least one entry. ──
    let atkFreq=0, distTrend=0;
    if(ai.awareness.length>0){
      let atkCount=0;
      for(const e of ai.awareness) if(e.action==='attack'||e.action==='special') atkCount++;
      atkFreq=atkCount/ai.awareness.length;
      distTrend=Math.abs(ai.awareness[0].dx)-Math.abs(ai.awareness[ai.awareness.length-1].dx);
    }
    const aCh=Math.max(0,Math.min(1,d.aCh*gAI.aggro+(pressAdv?0.35:0)+(ai.rage>0?0.2:0)-(rattled?0.3:0)-0.25*atkFreq-0.15*Math.max(0,distTrend)/100));
    const farThresh=180*gAI.range, closeThresh=70*gAI.range;
    if(dist>farThresh)                        ai.aiState='CHASE';
    else if(dist<closeThresh&&Math.random()<aCh)ai.aiState='ATTACK';
    else if(dist<closeThresh)                 ai.aiState='RETREAT';
    else                                       ai.aiState=Math.random()<.5?'CHASE':'ATTACK';
  }
  if(ai.aiState==='CHASE')   {ir=dx>20;il=dx<-20;}
  if(ai.aiState==='ATTACK')  {ir=dx>10;il=dx<-10;ia=dist<d.atkR;}
  if(ai.aiState==='RETREAT') {il=dx>0;ir=dx<0;}
  if(ai.aiJumpCD>0) ai.aiJumpCD--;
  if(ai.onGround&&ai.aiJumpCD===0&&
    (Math.random()<d.jCh*gAI.jumpy||ai.x<PLAT.x+20||ai.x>PLAT.x+PLAT.w-50)){ij=true;ai.aiJumpCD=55;}
  if(ai.specialCD===0){
    const pressAdv=(tgt.hitstun||0)>4;             // punish a real opening
    const desperate=ai.hp/ai.maxHp<=0.3;            // same threshold that triggers rage/lastRite in doHits
    const m=d.sMult*(pressAdv?1.4:1)*(desperate?1.3:1)*(ai.rage>0?1.3:1);
    const p=[
      dist>55&&dist<190&&Math.random()<.018*m,
      dist<160&&ai.onGround&&Math.random()<.014*m,
      dist<90&&Math.random()<.010*m,
      dist>30&&Math.random()<.013*m,
      dist<110&&Math.random()<.009*m,
      dist<160&&Math.random()<.012*m,
      dist>40&&dist<200&&Math.random()<.015*m,
      Math.random()<.010*m,
      dist<130&&Math.random()<.011*m,
      dist>30&&dist<200&&Math.random()<.014*m,
      dist<100&&Math.random()<.016*m,
      Math.random()<.012*m,
      dist>0&&Math.random()<.013*m,
      dist<120&&ai.onGround&&Math.random()<.011*m,
      dist<160&&Math.random()<.013*m,
      dist>40&&dist<180&&Math.random()<.014*m,
      dist>40&&dist<180&&Math.random()<.013*m,
    ];
    if(p[ai.godIdx]) is=true;
  }
  return {il,ir,ij,ia,is};
}

function doHits() {
  for(let a=0;a<2;a++){
    const att=F[a],def=F[1-a];
    if(!att.hitbox||att.knockCD>0||def.hp<=0) continue;
    if(def.knockCD>30) continue;
    const h=att.hitbox;
    if(h.x<def.x+def.w&&h.x+h.w>def.x&&h.y<def.y+def.h&&h.y+h.h>def.y){
      const ga=GODS[att.godIdx],gd=GODS[def.godIdx];
      const rageMult=att.rage>0?1.8:1.0;
      let dmg=Math.round((3+Math.random()*4)*ga.dm*rageMult);
      // ── Attacker passives — damage modifiers ──────────────────
      const ag=GODS[att.godIdx]; if(ag&&ag.passiveDamage) dmg=ag.passiveDamage(dmg, att, def);
      // General: Xochiquétzal mark bonus — ×1.15 dmg to any marked defender
      if((def._xochMark||0)>0) dmg=Math.round(dmg*1.15);
      // Divine weight — heavier gods land heavier hits (freeze/shake), lighter gods hit snappier.
      // Reuses ga.wm (already governs torso proportions + defender knockback) — no new stat invented.
      const wMod=0.5+0.5*ga.wm;
      if(def.shielding&&def.shieldHp>0){
        const blocked=Math.ceil(dmg*0.75);
        def.shieldHp=Math.max(0,def.shieldHp-blocked);
        def.hp=Math.max(0,def.hp-(dmg-blocked));
        def.vx=att.facing*1.5; def.vy=-0.5; def.hitstun=4;
        def.hitstunMax=def.hitstun;
        def._hitSeverity=0.15; // shield blunts the hit — reaction stays minimal
        freezeFrames=Math.round(3*wMod); shakeIntensity=Math.round(2*wMod); shakeTimer=5; shakeDuration=5;
      } else {
        def.hp=Math.max(0,def.hp-dmg);
        const fr=1-def.hp/def.maxHp;
        def._hitSeverity=fr; // drives the face-reaction scaling — same signal already driving knockback/hitstun below
        def.vx=att.facing*(5+fr*14)/gd.wm;
        def.vy=-6-fr*5;
        // ── Attacker passives — knockback modifiers (Coatlicue, Tlaltecuhtli, Xólotl, Xochiquétzal) ──
        if(ag&&ag.passiveOnAttack) ag.passiveOnAttack(att, def);
        def.hitstun=18+Math.floor(fr*16);
        def.hitstunMax=def.hitstun;
        const isKO=def.hp<=0;
        freezeFrames=Math.round((isKO?22:Math.min(10,3+Math.floor(dmg/5)))*wMod);
        const _si=isKO?7:Math.min(7,2+Math.floor(dmg/7));
        shakeIntensity=Math.round(_si*wMod); shakeTimer=isKO?14:8; shakeDuration=shakeTimer;
        if(isKO){
          koFlash=14;
          for(let ki=0;ki<60;ki++){
            const ka=Math.random()*Math.PI*2,kr=6+Math.random()*24;
            specials.push({type:'spark',x:def.x+def.w/2+Math.cos(ka)*kr,
              y:def.y+def.h/2+Math.sin(ka)*kr,
              vx:Math.cos(ka)*(2+Math.random()*4),vy:Math.sin(ka)*(2+Math.random()*4)-3,
              life:18+Math.round(Math.random()*14),maxLife:18,
              color:GODS[def.godIdx].acc||'#ffdd44'});
          }
        }
        if(!def.lastRiteUsed&&def.hp>0&&def.hp/def.maxHp<=0.20){
          def.lastRiteUsed=true; def.rage=Math.max(def.rage,90); rageBurst=5;
        }
        // ── Defender-reactive passives (Tezcatlipoca rage-on-hit, Xipe Tótec MUDA shed) ──
        const dg=GODS[def.godIdx]; if(dg&&dg.passiveOnHurt) dg.passiveOnHurt(def, att);
      }
      const hcx2=Math.max(h.x,def.x),hcy2=def.y+def.h*0.35;
      const _hC=GODS[att.godIdx].acc||'#ffcc00',_hH=GODS[att.godIdx].hi||'#ffffff';
      // Impact starburst at contact point
      specials.push({type:'hitstar',x:hcx2,y:hcy2,life:6,maxLife:6,color:_hH});
      // Directional fan sparks toward attacker's facing direction
      for(let si=0;si<5;si++){
        const sa=att.facing*(-0.7+si*0.35);
        specials.push({type:'spark',x:hcx2,y:hcy2,
          vx:Math.cos(sa)*att.facing*(3+Math.random()*3),
          vy:Math.sin(sa)*(2+Math.random()*2)-1.5,
          life:12+Math.round(Math.random()*5),maxLife:12,color:_hC});
      }

function updateSpecials() {
  for(const s of specials){
    s.life--;
    if(s.type==='orb')  {s.x+=s.vx;s.y+=s.vy;}
    if(s.type==='solar'){s.r=Math.min(s.maxR??68,s.r+4.8);}
    if(s.type==='smoke'){s.x+=s.vx;s.y+=s.vy;s.vy+=0.06;}
    if(s.type==='spark'){s.x+=s.vx;s.y+=s.vy;s.vx*=0.88;s.vy+=0.28;}
    if(s.type==='dust'){s.x+=s.vx;s.y+=s.vy;s.vx*=0.92;s.vy+=0.04;}
    if(s.type==='petal'){s.x+=s.vx;s.y+=s.vy;s.vx*=0.90;s.vy+=0.18;s.rot=(s.rot||0)+s.spin;}
  }
  for(const s of specials){
    if(s.hit||s.type==='afterimage') continue;
    const def=F[1-s.owner];
    if(!def||def.hp<=0||def.knockCD>30) continue;
    let hit=false;
    if(s.type==='orb'){
      const nx=Math.max(def.x,Math.min(s.x,def.x+def.w));
      const ny=Math.max(def.y,Math.min(s.y,def.y+def.h));
      hit=Math.hypot(s.x-nx,s.y-ny)<s.r;
    }
    if(s.type==='solar'&&s.damage>0){
      const nx=Math.max(def.x,Math.min(s.x,def.x+def.w));
      const ny=Math.max(def.y,Math.min(s.y,def.y+def.h));
      hit=Math.hypot(s.x-nx,s.y-ny)<s.r;
    }
    if(s.type==='sweep'){
      hit=s.x<def.x+def.w&&s.x+s.w>def.x&&s.y<def.y+def.h&&s.y+s.h>def.y;
    }
    if(hit){
      const att=F[s.owner],gd=GODS[def.godIdx];
      const rageMult=att&&att.rage>0?1.8:1.0;
      const fr=1-def.hp/def.maxHp;
      def._hitSeverity=fr; // special-move hits scale the face reaction same as melee hits
      def.hp=Math.max(0,def.hp-Math.round(s.damage*rageMult));
      if(s.type==='solar'){
        const ang=Math.atan2(def.y+def.h/2-s.y,def.x+def.w/2-s.x);
        def.vx=Math.cos(ang)*(7+fr*9)/gd.wm;
        def.vy=Math.sin(ang)*(7+fr*9)-4;
      } else {
        const dir=s.type==='sweep'?(F[s.owner]?.facing||1):(s.vx>=0?1:-1);
        def.vx=dir*(5+fr*12)/gd.wm;
        def.vy=-6-fr*4;
      }
      def.hitstun=18+Math.floor(fr*14);
      s.hit=true;
      sfxGodHit(att?.godIdx ?? 0); sfxGodHurt(def.godIdx, def._hitSeverity, def.hp<=0);
    }
  }
  specials=specials.filter(s=>s.life>0&&s.y<H+80);
}

function updateFight() {
  _fightTick++;
  const p1j=K._p1j; K._p1j=false;
  const p1a=K._p1a; K._p1a=false;
  const p1s=K._p1s; K._p1s=false;
  stepFighter(F[0],K['KeyA'],K['KeyD'],p1j,p1a);
  if(p1s&&F[0].specialCD===0&&F[0].hitstun===0) doSpecial(F[0],0);

  if(F[1].isAI){
    const ai=aiTick(F[1],F[0]);
    stepFighter(F[1],ai.il,ai.ir,ai.ij,ai.ia);
    if(ai.is&&F[1].specialCD===0&&F[1].hitstun===0) doSpecial(F[1],1);
  } else {
    const p2j=K._p2j;K._p2j=false;
    const p2a=K._p2a;K._p2a=false;
    const p2s=K._p2s;K._p2s=false;
    stepFighter(F[1],K['ArrowLeft'],K['ArrowRight'],p2j,p2a);
    if(p2s&&F[1].specialCD===0&&F[1].hitstun===0) doSpecial(F[1],1);
  }
  F[0].shielding = !!(K['KeyF'] && F[0].hitstun===0 && F[0].shieldHp>0);
  if(!F[0].shielding&&F[0].shieldHp<F[0].maxShieldHp) F[0].shieldHp=Math.min(F[0].maxShieldHp,F[0].shieldHp+0.25);
  F[1].shielding = !F[1].isAI&&!!(K['KeyK']&&F[1].hitstun===0&&F[1].shieldHp>0);
  if(!F[1].shielding&&F[1].shieldHp<F[1].maxShieldHp) F[1].shieldHp=Math.min(F[1].maxShieldHp,F[1].shieldHp+0.25);
  doHits(); updateSpecials();

  // ── Treasure orb — VS mode only ──────────────────────────────
  if(!storyMode){
    treasureSpawnTimer++;
    if(!treasureOrb && treasureSpawnTimer>=nextTreasureIn){
      treasureOrb={x:PLAT.x+80+Math.floor(Math.random()*(PLAT.w-160)),y:PLAT.y-60,life:600,vx:0,vy:0,phase:Math.random()*1000};
      treasureSpawnTimer=0;
      nextTreasureIn=480+Math.floor(Math.random()*480);
    }
    if(treasureOrb){
      treasureOrb.life--;
      if(treasureOrb.life<=0){treasureOrb=null;}
      else{
        // ── Playful movement: gentle idle drift always, curvy wobble-flee when a fighter closes in ──
        const TR=treasureOrb;
        let tvx=Math.sin(_fightTick*0.02+TR.phase)*0.7;
        let tvy=Math.cos(_fightTick*0.017+TR.phase*1.3)*0.45;
        for(let i=0;i<2;i++){
          const hf=F[i];
          const ddx=TR.x-(hf.x+hf.w/2), ddy=TR.y-(hf.y+hf.h/2);
          const dd=Math.hypot(ddx,ddy);
          if(dd<95&&dd>0){
            const push=(1-dd/95)*1.1;
            const wob=Math.sin(_fightTick*0.05+TR.phase+i*3)*0.6;
            tvx+=(ddx/dd)*push-(ddy/dd)*wob;
            tvy+=(ddy/dd)*push+(ddx/dd)*wob;
          }
        }
        TR.vx=TR.vx*0.72+tvx*0.28;
        TR.vy=TR.vy*0.72+tvy*0.28;
        const spMax=2.1,sp=Math.hypot(TR.vx,TR.vy);
        if(sp>spMax){TR.vx=TR.vx/sp*spMax;TR.vy=TR.vy/sp*spMax;}
        TR.x=Math.max(PLAT.x+16,Math.min(PLAT.x+PLAT.w-16,TR.x+TR.vx));
        TR.y=Math.max(PLAT.y-115,Math.min(PLAT.y-45,TR.y+TR.vy));
        for(let i=0;i<2;i++){
          const f=F[i];
          if(Math.abs(f.x+f.w/2-treasureOrb.x)<22&&Math.abs(f.y+f.h/2-treasureOrb.y)<26){
            doTreasure(f,i); treasureOrb=null; break;
          }
        }
      }
    }
  }

  // Separate fighters who are overlapping horizontally (same height plane)
  {
    const a=F[0],b=F[1];
    if(Math.abs((a.y+a.h)-(b.y+b.h))<24){
      const overlap=Math.min(a.x+a.w-b.x, b.x+b.w-a.x);
      if(overlap>0){
        const push=overlap*0.5+0.5;
        if(a.x<b.x){a.x-=push;b.x+=push;}
        else        {a.x+=push;b.x-=push;}
      }
    }
  }

  // Out-of-bounds: apply HP penalty and respawn instead of instant elimination
  for(let _oi=0;_oi<2;_oi++){
    const _of=F[_oi];
    if(_of.hp>0&&(_of.y>H+120||_of.x+_of.w<-100||_of.x>W+100)){
      _of.hp=Math.max(0,_of.hp-20);
      if(_of.hp>0){
        _of.x=PLAT.x+PLAT.w/2-_of.w/2;
        _of.y=PLAT.y-_of.h;
        _of.vx=0; _of.vy=0;
        _of.onGround=true; _of.jumpsLeft=_of.maxJumps;
        _of.hitstun=0; _of.knockCD=45;
      }
      sfxHit(6);
    }
  }
  // Determine which fighters are eliminated this tick before processing any winner
  const eliminated=[
    F[0].hp<=0,
    F[1].hp<=0,
  ];
  // Simultaneous death: award round to whoever has more hp remaining (or P2 on exact tie)
  if(eliminated[0]&&eliminated[1]){
    const wi=F[0].hp>F[1].hp?0:1;
    if(wi===0) p1RoundWins++; else p2RoundWins++;
    // Passive: Mictecacíhuatl (godIdx 8) — track round wins for speed scaling
    F[wi]._roundWins=(F[wi]._roundWins||0)+1;
    stopMusic(); sfxKO(); F[wi].won=true;F[1-wi].won=false;
    if(p1RoundWins>=2||p2RoundWins>=2){
      winner=p1RoundWins>=2?'P1 WINS':'P2 WINS';
      const p1w=p1RoundWins>=2;
      saveBattle(p1w,p1Choice,p2Choice,roundNum,storyMode);
      if(storyMode&&p1w){
        showDialogue(getStoryLevel(storyLevel).outro,()=>{
          showDialogue(getStoryLevel(storyLevel).advice,()=>{
            if(!storyCompleted.includes(storyLevel)){storyCompleted.push(storyLevel);localStorage.setItem('wotg_story',JSON.stringify(storyCompleted));}
            if(storyLevel<STORY_LEVELS.length-1){storyLevel++;startMusic('select');gs=GS.STORY_MAP;}
            else{storyEndT=0;ngPlusUnlocked=true;storyEndSel=0;stopMusic();gs=GS.STORY_END;}
          });
        });
      } else if(storyMode&&!p1w){
        storyLives--;
        if(storyLives<=0){
          const enemyName=GODS[p2Choice].short;
          showDialogue([
            {speaker:enemyName, text:'In notezcauh tlapana, ayohuatl. Amo otihuia ipan in tlamahuizoli.'},
            {speaker:'NARRATOR',  text:'OTLAMIYA — Tezcatlipoca huetzi. In teoamoxtli axan tlamia... amo nochipa.'},
          ],()=>{startMusic('select');storyLives=STORY_MAX_LIVES;gs=GS.STORY_MAP;});
        } else {
          showDialogue([
            {speaker:'TEZCATLIPOCA', text:'In tezcatl tlapana... auh amo pohlihua. '+storyLives+' nemiliztli mani. Amo occepa nihuetzi.'},
          ],()=>{restartStoryFight();});
        }
      } else {gs=GS.WIN;winT=0;}
    } else {winner=wi===0?'P1':'P2';gs=GS.ROUND_END;roundEndT=0;}
    return;
  }

  for(let i=0;i<2;i++){
    if(!eliminated[i]) continue;
    const f=F[i];
    if(f.hp<=0||f.y>H+120||f.x+f.w<-100||f.x>W+100){
      const wi=i===0?1:0;
      if(wi===0) p1RoundWins++; else p2RoundWins++;
      // Passive: Mictecacíhuatl (godIdx 8) — track round wins for speed scaling
      F[wi]._roundWins=(F[wi]._roundWins||0)+1;
      stopMusic();
      sfxGodWin(F[wi].godIdx); F[wi].won=true;F[1-wi].won=false;
      if(p1RoundWins>=2||p2RoundWins>=2){
        winner=p1RoundWins>=2?'P1 WINS':'P2 WINS';
        const p1w=p1RoundWins>=2;
        saveBattle(p1w,p1Choice,p2Choice,roundNum,storyMode);
        if(storyMode&&p1w){
          showDialogue(getStoryLevel(storyLevel).outro,()=>{
            showDialogue(getStoryLevel(storyLevel).advice,()=>{
              if(!storyCompleted.includes(storyLevel)){storyCompleted.push(storyLevel);localStorage.setItem('wotg_story',JSON.stringify(storyCompleted));}
              if(storyLevel<STORY_LEVELS.length-1){
                storyLevel++;
                startMusic('select'); gs=GS.STORY_MAP;
              } else {
                storyEndT=0; ngPlusUnlocked=true; storyEndSel=0;
                stopMusic(); gs=GS.STORY_END;
              }
            });
          });
        } else if(storyMode&&!p1w){
          storyLives--;
          if(storyLives<=0){
            const enemyName=GODS[p2Choice].short;
            showDialogue([
              {speaker:enemyName, text:'In notezcauh tlapana, ayohuatl. Amo otihuia ipan in tlamahuizoli.'},
              {speaker:'NARRATOR', text:'OTLAMIYA — Tezcatlipoca huetzi. In teoamoxtli axan tlamia... amo nochipa.'},
            ],()=>{ startMusic('select'); storyLives=STORY_MAX_LIVES; gs=GS.STORY_MAP; });
          } else {
            const livesLeft=storyLives;
            showDialogue([
              {speaker:'TEZCATLIPOCA', text:'In tezcatl tlapana... auh amo pohlihua. '+livesLeft+' nemiliztli mani. Amo occepa nihuetzi.'},
            ],()=>{ restartStoryFight(); });
          }
        } else {
          gs=GS.WIN; winT=0;
        }
      } else {
        winner=wi===0?'P1':'P2';
        gs=GS.ROUND_END; roundEndT=0;
      }
      break;
    }
  }
}

function pyramid(pcx,by,bw,steps,cM,cD,cS,stair,sh=13,dual=false) {
  const SH=sh;
  const stairW=stair?Math.max(8,Math.round(bw*0.09)):0;
  const stairX=Math.round(pcx-stairW/2);
  for(let i=0;i<steps;i++){
    const w=Math.round(bw*(steps-i)/steps),x=Math.round(pcx-w/2),y=by-(i+1)*SH;
    cx.fillStyle=cM;cx.fillRect(x,y,w,SH);
    cx.fillStyle=cD;cx.fillRect(x,y+5,w,SH-5);
    cx.fillStyle=cS;cx.fillRect(x,y,w,2);
    cx.fillStyle=cS;cx.fillRect(x+w-4,y+2,4,3);
    cx.fillStyle=cD;
    const gap=Math.max(14,Math.round(w/Math.max(4,Math.floor(w/20))));
    for(let si=gap;si<w-4;si+=gap) cx.fillRect(x+si,y+2,1,SH-2);
    if(stair&&stairX>=x&&stairX+stairW<=x+w){
      cx.fillStyle=cS;cx.fillRect(stairX,y,stairW,2);
      cx.fillStyle=cD;cx.fillRect(stairX,y+2,stairW,SH-2);
    }
  }
  if(dual){
    // Dual-shrine top — Templo Mayor (Tláloc left + Huitzilopochtli right)
    const platW=Math.round(bw*0.52),platX=Math.round(pcx-platW/2),platY=by-steps*SH-6;
    cx.fillStyle=cM;cx.fillRect(platX,platY,platW,6);
    cx.fillStyle=cS;cx.fillRect(platX,platY,platW,2);
    const tw=Math.round(platW/2-5),th=24;
    const lx=platX+2,rx=platX+platW-tw-2,ty=platY-th;
    // Left shrine (Tláloc)
    cx.fillStyle=cM;cx.fillRect(lx,ty,tw,th);
    cx.fillStyle=cS;cx.fillRect(lx,ty,tw,2);
    cx.fillStyle=cD;cx.fillRect(lx,ty+15,tw,9);
    cx.fillStyle=cD;cx.fillRect(lx+Math.round(tw/2)-3,ty+4,6,th);
    cx.fillStyle=cS;cx.fillRect(lx+tw-3,ty+2,3,8);
    cx.fillStyle='#1c3448';
    const mw=Math.round((tw-6)/3);
    for(let m=0;m<3;m++) cx.fillRect(lx+3+m*(mw+1),ty-8,mw,8);
    // Right shrine (Huitzilopochtli)
    cx.fillStyle=cM;cx.fillRect(rx,ty,tw,th);
    cx.fillStyle=cS;cx.fillRect(rx,ty,tw,2);
    cx.fillStyle=cD;cx.fillRect(rx,ty+15,tw,9);
    cx.fillStyle=cD;cx.fillRect(rx+Math.round(tw/2)-3,ty+4,6,th);
    cx.fillStyle=cS;cx.fillRect(rx+tw-3,ty+2,3,8);
    cx.fillStyle='#501808';
    for(let m=0;m<3;m++) cx.fillRect(rx+3+m*(mw+1),ty-8,mw,8);
    if(stair){cx.fillStyle=cS;cx.fillRect(stairX,platY,stairW,2);cx.fillStyle=cD;cx.fillRect(stairX,platY+2,stairW,4);}
  } else {
    const tw=Math.max(14,Math.round(bw/steps*1.2)),tx=Math.round(pcx-tw/2),ty=by-steps*SH-16;
    cx.fillStyle=cM;cx.fillRect(tx,ty,tw,16);
    cx.fillStyle=cS;cx.fillRect(tx,ty,tw,2);
    cx.fillStyle=cD;cx.fillRect(tx,ty+10,tw,6);
    if(tw>16){cx.fillStyle=cD;cx.fillRect(Math.round(pcx-3),ty+5,6,11);cx.fillStyle=cS;cx.fillRect(tx+tw-4,ty,4,8);}
    if(stair){cx.fillStyle=cS;cx.fillRect(stairX,ty,stairW,2);cx.fillStyle=cD;cx.fillRect(stairX,ty+2,stairW,14);}
  }
}

function drawWorld(t) {
  // Mountain silhouette
  cx.fillStyle='#0b0608';cx.beginPath();
  [[0,295],[50,270],[110,252],[170,265],[230,248],[300,258],[380,250],[440,256],
   [500,246],[555,260],[615,244],[670,256],[730,262],[790,255],[800,265],[800,322],[0,322]]
  .forEach(([px,py],i)=>i===0?cx.moveTo(px,py):cx.lineTo(px,py));
  cx.closePath();cx.fill();
  // Warm sunrise halo behind Templo Mayor
  for(let r=90;r>0;r-=12){
    const a=(r/90)*0.12;
    cx.fillStyle=`rgba(180,60,8,${a.toFixed(2)})`;
    for(let i=0;i<24;i++){const ang=(i/24)*Math.PI*2;cx.fillRect(400+Math.round(Math.cos(ang)*r)-2,252+Math.round(Math.sin(ang)*r*0.45)-2,4,4);}
  }
  // Small distant pyramid (right mid, behind)
  pyramid(572,296,84,4,'#1c0e06','#100804','#281408',false,9);
  // Left flanking pyramid
  pyramid(112,326,200,7,'#38200e','#221008','#4e2c10',false,13);
  // Right flanking pyramid
  pyramid(688,320,175,6,'#341a08','#201006','#481e08',false,13);
  // Main Templo Mayor — dual temples, centered, dominant
  pyramid(W/2,328,294,9,'#3c2210','#241208','#543014',true,14,true);
  // Copal smoke rising from the flanking-temple peaks (visible in open sky,
  // clear of the WAR OF THE GODS wordmark that covers the main Templo Mayor)
  const drawCopalWisp = (bx, by, seed) => {
    const cycleLen = 5200, riseH = 70;
    // ember glow at the brazier — the smoke's actual source
    const glowPulse = 0.5 + 0.5 * Math.sin(t * 0.006 + seed);
    cx.fillStyle = `rgba(214,120,40,${(0.28 + glowPulse * 0.16).toFixed(2)})`;
    cx.fillRect(bx - 3, by - 2, 6, 4);
    // each puff is a loose ring of tiny 2x2 squares, not one hard block —
    // reads as soft/bubbly instead of a stack of flat squares
    const puffOffsets = [[0,0],[-3,-2],[3,-2],[-2,3],[2,3],[0,-4],[-4,1],[4,1]];
    for (let i = 0; i < 9; i++) {
      const phase = (t + seed + i * (cycleLen / 9)) % cycleLen;
      const prog = phase / cycleLen;
      const wy = by - Math.round(prog * riseH);
      const spread = 3 + prog * 11; // billows wider as it disperses upward
      const wx = bx + Math.round(Math.sin(prog * Math.PI * 2.2 + seed) * spread);
      const a = (1 - prog * prog) * 0.48; // holds longer low, fades faster near the top
      if (a <= 0.02) continue;
      const scale = 0.4 + prog * 1.1; // puff cluster widens as it disperses
      const puffCount = 4 + Math.round(prog * 4); // more tiny squares as it billows
      cx.fillStyle = `rgba(220,214,202,${a.toFixed(2)})`;
      for (let p = 0; p < puffCount; p++) {
        const [ox, oy] = puffOffsets[p % puffOffsets.length];
        cx.fillRect(wx + Math.round(ox * scale) - 1, wy + Math.round(oy * scale) - 1, 2, 2);
      }
    }
  };
  drawCopalWisp(112, 233, 0);   // left flanking pyramid peak
  drawCopalWisp(688, 240, 900); // right flanking pyramid peak
  // Tiny crowd figures filling the plaza
  const cC=[['#120a04','#241006'],['#1a0c06','#301808'],['#0e0804','#201004']];
  for(let i=0;i<120;i++){
    const col=i%40,row=Math.floor(i/40);
    const fx=6+col*20+(row*13)%21,fy=316+row*5;
    const[bc,hc]=cC[i%3];
    cx.fillStyle=bc;cx.fillRect(fx,fy,2,4);
    cx.fillStyle=hc;cx.fillRect(fx,fy-2,2,2);
  }
  // Far-edge foliage
  cx.fillStyle='#061408';
  cx.fillRect(12,316,36,8);cx.fillRect(10,312,12,5);cx.fillRect(38,310,10,5);
  cx.fillRect(752,311,36,8);cx.fillRect(754,307,10,5);cx.fillRect(778,306,12,5);
  cx.fillStyle='#0a1c0a';
  cx.fillRect(16,313,8,4);cx.fillRect(32,310,7,4);cx.fillRect(756,308,7,4);cx.fillRect(776,305,8,4);
  // Lake Texcoco water
  const ly=Math.round(H*0.685);
  const lg=cx.createLinearGradient(0,ly,0,H);
  lg.addColorStop(0,'#082438');lg.addColorStop(0.4,'#0a3048');lg.addColorStop(1,'#040e1a');
  cx.fillStyle=lg;cx.fillRect(0,ly,W,H-ly);
  for(let i=0;i<9;i++){
    const sy=ly+14+i*15,ox=Math.round(Math.sin(t*0.0008+i*0.9)*14);
    cx.fillStyle=`rgba(55,135,195,${(0.05+(i%3)*0.04).toFixed(2)})`;
    cx.fillRect(i*90+ox,sy,55,2);cx.fillRect(i*90+ox+28,sy+7,26,1);
  }
}

function sunGlyph(x,y) {
  cx.fillRect(x+3,y,1,7);cx.fillRect(x,y+3,7,1);
  cx.fillRect(x+1,y+1,1,1);cx.fillRect(x+5,y+1,1,1);
  cx.fillRect(x+1,y+5,1,1);cx.fillRect(x+5,y+5,1,1);
  cx.fillRect(x+2,y+2,3,3);
}

function drawPlatform() {
  const {x,y,w,h}=PLAT;
  cx.fillStyle='#7a6030';
  for(let i=0;i<7;i++){const mx=Math.round(x+24+i*(w-48)/6);cx.fillRect(mx-6,y-9,13,9);}
  cx.fillStyle='#5c4422';cx.fillRect(x,y,w,h);
  cx.fillStyle='#7a5c2a';cx.fillRect(x,y,w,5);
  cx.fillStyle='#3c2c14';
  for(let i=28;i<w;i+=28) cx.fillRect(x+i,y+5,2,h-5);
  cx.fillRect(x,y+Math.round(h*.55),w,2);
  cx.fillStyle='#201408';cx.fillRect(x,y+h-4,w,4);
  cx.fillStyle='#d49010';
  for(let i=0;i<5;i++) sunGlyph(x+42+Math.round(i*(w-84)/4),y+9);
  // Xicalcoliuhqui step-fret trim along bottom edge
  const _sfW=8,_sfN=Math.floor(w/_sfW);
  for(let i=0;i<_sfN;i++){
    const _sx=x+i*_sfW,_sy=y+h-4;
    cx.fillStyle=(i%2===0)?'#c47800':'#3a1e04';
    cx.fillRect(_sx,_sy,4,2);
    cx.fillRect(_sx,_sy+2,2,2);
    cx.fillStyle=(i%2===0)?'#3a1e04':'#c47800';
    cx.fillRect(_sx+4,_sy,4,2);
    cx.fillRect(_sx+6,_sy+2,2,2);
  }
}

// Cartoon eye helpers
function _eyeN(nx,y,ec){
  cx.fillStyle='#080610';cx.fillRect(nx-1,y+3,6,1);
  cx.fillStyle='#FFFFFF';cx.fillRect(nx,y+4,4,2);
  cx.fillStyle='#080610';cx.fillRect(nx-1,y+4,1,2);cx.fillRect(nx+4,y+4,1,2);cx.fillRect(nx,y+6,4,1);
  cx.fillStyle=ec;cx.fillRect(nx+1,y+4,2,2);
  cx.fillStyle='#080610';cx.fillRect(nx+1,y+5,1,1);
  cx.fillStyle='rgba(255,255,255,0.95)';cx.fillRect(nx+1,y+4,1,1);
}
function _eyeF(fx,y,ec){
  cx.fillStyle='#080610';cx.fillRect(fx-1,y+4,5,1);
  cx.fillStyle='#FFFFFF';cx.fillRect(fx,y+5,3,2);
  cx.fillStyle='#080610';cx.fillRect(fx-1,y+5,1,2);cx.fillRect(fx+3,y+5,1,2);cx.fillRect(fx,y+7,3,1);
  cx.fillStyle=ec;cx.fillRect(fx,y+5,2,2);
  cx.fillStyle='#080610';cx.fillRect(fx+1,y+6,1,1);
  cx.fillStyle='rgba(255,255,255,0.85)';cx.fillRect(fx,y+5,1,1);
}
function _smile(x,y){
  cx.fillStyle='#1A0808';cx.fillRect(x+11,y+9,4,1);cx.fillRect(x+10,y+10,2,1);cx.fillRect(x+14,y+10,2,1);
}


// Per-god faces — symmetric construction (lEye=x+7, rEye=x+14, equal sockets)

  switch(gi){

      cx.fillStyle='#167060';cx.fillRect(x+3,y-12,20,3);
      // Five xiuhuitl disc-balls (INAH stone sculpture — round turquoise stones in a row)
      [x+5,x+9,x+13,x+17,x+21].forEach(bx=>{
        cx.fillStyle='#091A14';cx.beginPath();cx.arc(bx,y-13,3,0,Math.PI*2);cx.fill(); // dark ring
        cx.fillStyle='#1EB898';cx.beginPath();cx.arc(bx,y-13,2,0,Math.PI*2);cx.fill(); // teal ball

// [BODY_MARKS] Per-god torso markings sourced from INAH clay/stone sculpture descriptions —
// distinct from drawFacePaint (head) and drawHeaddress (crown). x,y are the sprite's top-left
// (breath offset already applied by the caller); tX/tW = chest block, hX/hW = waist block.
function drawBodyMarks(f, x, y, fac, g, tX, tW, hX, hW) {
  switch (f.godIdx) {
    case 0:{ // Tezcatlipoca — obsidian smoking-mirror disc on the chest
      cx.fillStyle='#0A0A0C';cx.beginPath();cx.arc(x+13,y+16,3,0,Math.PI*2);cx.fill();
      cx.strokeStyle=g.acc;cx.lineWidth=1;cx.beginPath();cx.arc(x+13,y+16,3,0,Math.PI*2);cx.stroke();
      cx.fillStyle='rgba(255,120,80,0.55)';cx.fillRect(x+12,y+15,2,1);
      break;}
    case 1:{ // Quetzalcóatl — feather-relief chevrons covering the torso
      cx.fillStyle=g.hi;
      cx.fillRect(tX+2,y+15,2,1);cx.fillRect(tX+tW-4,y+15,2,1);
      cx.fillRect(tX+3,y+18,2,1);cx.fillRect(tX+tW-5,y+18,2,1);
      break;}
    case 2:{ // Huitzilopochtli — dorsal hummingbird-disguise wing tabs at the shoulders
      cx.fillStyle=g.hat;
      cx.fillRect(tX-2,y+13,3,4);cx.fillRect(tX+tW-1,y+13,3,4);
      break;}
    case 3:{ // Tláloc — water-spiral motif on the chest
      cx.strokeStyle=g.hi;cx.lineWidth=1;
      cx.beginPath();cx.arc(x+13,y+17,2,0,Math.PI*1.5);cx.stroke();
      break;}
    case 4:{ // Xipe Tótec — crossing straps binding the flayed skin (chest + back)
      cx.strokeStyle='#3A0C0C';cx.lineWidth=1;
      cx.beginPath();cx.moveTo(tX,y+13);cx.lineTo(tX+tW,y+19);cx.stroke();
      cx.beginPath();cx.moveTo(tX+tW,y+13);cx.lineTo(tX,y+19);cx.stroke();
      break;}
    case 5:{ // Coatlicue — necklace of hearts and hands with a skull centerpiece, shoulder fangs
      cx.fillStyle=g.acc;cx.fillRect(x+9,y+14,2,2);cx.fillRect(x+16,y+14,2,2);
      cx.fillStyle='#D8D0BC';cx.fillRect(x+12,y+13,2,2);
      cx.fillStyle='#E8E0C8';cx.fillRect(tX-1,y+13,2,2);cx.fillRect(tX+tW-1,y+13,2,2);
      break;}
    case 6:{ // Chalchihuitlicue — huipil chest opening + jade-bead trim
      cx.fillStyle='#0A2018';cx.fillRect(x+12,y+14,2,3);
      cx.fillStyle=g.acc;cx.fillRect(tX,y+20,1,1);cx.fillRect(tX+tW-1,y+20,1,1);
      break;}
    case 7:{ // Mictlantecuhtli — exposed ribs + the liver protruding at the sternum
      cx.fillStyle='#8A7D68';
      cx.fillRect(tX+1,y+15,tW-2,1);cx.fillRect(tX+1,y+17,tW-2,1);
      cx.fillStyle=g.acc;cx.fillRect(x+12,y+19,2,2);
      break;}
    case 8:{ // Mictecacíhuatl — descarnada: sparse rib line
      cx.fillStyle='#3A1030';cx.fillRect(tX+2,y+16,tW-4,1);
      break;}
    case 9:{ // Tonatiuh — the sacrificial heart clutched at the chest
      cx.fillStyle='#CC2200';
      cx.fillRect(x+12,y+16,1,1);cx.fillRect(x+14,y+16,1,1);cx.fillRect(x+13,y+17,1,1);
      break;}
    case 10:{ // Xólotl — traces of red and white pigment on the body
      cx.fillStyle='#CC3322';cx.fillRect(tX+2,y+15,2,2);
      cx.fillStyle='#EEE8DC';cx.fillRect(tX+tW-4,y+18,2,2);
      break;}
    case 11:{ // Coyolxauhqui — a cascabel bell worn at the chest
      cx.fillStyle=g.acc;cx.beginPath();cx.arc(x+13,y+16,2,0,Math.PI*2);cx.fill();
      cx.fillStyle='#8A6A10';cx.fillRect(x+12,y+18,2,1);
      break;}
    case 12:{ // Ometeotl — the dividing seam between the dual creation/destruction halves
      cx.fillStyle='#ffffff';cx.fillRect(x+13,y+13,1,7);
      break;}
    case 13:{ // Tlaltecuhtli — crossed femurs and a skull at the waist (skirt of bones)
      cx.fillStyle='#D8D0BC';
      cx.fillRect(hX+2,y+23,hW-4,1);cx.fillRect(hX+2,y+25,hW-4,1);
      cx.fillStyle='#B8AC90';cx.fillRect(x+12,y+24,2,2);

    case 14:{ // Tlazoltéotl — the spindle whorl (malacate), patron of weavers
      cx.fillStyle='#EEE8DC';cx.beginPath();cx.arc(x+13,y+17,1.5,0,Math.PI*2);cx.fill();
      cx.fillStyle='#1A1418';cx.fillRect(x+12,y+15,1,4);
      break;}
    case 15:{ // Xochipilli — red-painted body tattooed with flowers, spiny pectoral
      cx.fillStyle='#FFB0C8';
      cx.fillRect(tX+2,y+15,1,1);cx.fillRect(tX+tW-3,y+16,1,1);cx.fillRect(x+12,y+19,1,1);
      cx.fillStyle='#8B1A1A';cx.fillRect(x+11,y+13,4,1);
      break;}
    case 16:{ // Xochiquétzal — the yacapapalotl butterfly echoed on the chest
      cx.fillStyle=g.hi;
      cx.fillRect(x+12,y+16,1,1);cx.fillRect(x+14,y+16,1,1);
      cx.fillRect(x+11,y+17,1,1);cx.fillRect(x+15,y+17,1,1);
      break;}
  }
}

function drawSprite(f, t) {
  const x=Math.round(f.x),y=Math.round(f.y);
  const g=GODS[f.godIdx],fac=f.facing;
  const lp=(f.onGround&&Math.abs(f.vx)>0.3)?Math.floor(f.stepT/3)%4:0;
  const atkPh=f.atkTimer>0?f.atkTimer/14:0;
  const atkLean=atkPh>0.78?-fac:atkPh>0.45?fac*2:0;
  // Per-god body proportions — Museo Nacional de Antropología / INAH ceramic sculpture reference
  // [hYO=head y-offset, hWA=head width add, tWA=torso width add, lYO=leg start y-offset]
  const _BP=[[0,2,2,0],[-2,-2,-2,-2],[0,1,3,2],[0,3,5,2],[0,1,1,0],[0,1,6,0],[-1,0,0,-1],[-2,-3,-4,-2],[0,0,0,0],[0,3,2,0],[1,2,0,1],[0,1,2,0],[0,0,0,0],[2,2,6,3],[0,1,2,0],[-2,-2,-2,-2],[-1,0,0,-1]];
  let [hYO,hWA,tWA,lYO]=_BP[f.godIdx]||[0,0,0,0];
  const _breathY=(!f.hitstun&&f.onGround&&Math.abs(f.vx)<0.3)?Math.round(Math.sin(t*0.003+(f.godIdx||0)*1.37)*1):0;
  hYO+=_breathY;

  if(f.rage>0){
    const pa=0.28+Math.sin(t*.016)*.14;
    cx.fillStyle=`rgba(200,10,10,${pa.toFixed(2)})`;
    cx.fillRect(x-6,y-6,f.w+12,f.h+12);
    cx.strokeStyle=`rgba(255,40,20,${(pa*1.6).toFixed(2)})`;
    cx.lineWidth=1;cx.strokeRect(x-5,y-5,f.w+10,f.h+10);
  }
  if(f.djTimer>0){
    const dja=f.djTimer/18,djR=Math.round((1-dja)*20+4);
    const djCx=x+Math.round(f.w/2),djCy=y+Math.round(f.h/2);
