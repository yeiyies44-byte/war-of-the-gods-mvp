    cx.fillStyle='#2a1810';cx.fillRect(x+4,y+17,f.w-8,12);
    const la=0.32+Math.sin(t*.018)*.28;
    cx.fillStyle=`rgba(68,153,255,${la.toFixed(2)})`;cx.fillRect(x-3,y+17,4,f.h-17);
  } else if(f.godIdx===11){ // Coyolxauhqui — cascabeles, crescent moons, silver glow (confirmed INAH)
    const ma=0.28+Math.sin(t*.007)*.20;
    cx.fillStyle=`rgba(200,210,255,${ma.toFixed(2)})`;
    cx.fillRect(x-5,y+10,5,f.h-10);cx.fillRect(x+f.w,y+10,5,f.h-10);
    cx.fillStyle=g.acc;
    cx.fillRect(x+5,y+13,6,5);cx.fillRect(x+f.w-11,y+13,6,5);
    cx.fillStyle=g.body;cx.fillRect(x+6,y+14,4,3);cx.fillRect(x+f.w-10,y+14,4,3);
    cx.fillStyle='#D09818';
    for(let cb=0;cb<4;cb++) cx.fillRect(x+3+cb*5,y+20,4,4);
    cx.fillStyle='#F0C020';
    for(let cb=0;cb<4;cb++) cx.fillRect(x+4+cb*5,y+21,2,2);
    cx.fillStyle=g.alt;cx.fillRect(x+3,y+26,f.w-6,3);
  } else if(f.godIdx===12){ // Ometeotl — dual split body (modern interpretive, intentional)
    cx.fillStyle=g.acc+'99';cx.fillRect(x+3,y+12,Math.round(f.w/2)-3,18);
    cx.fillStyle=g.alt+'99';cx.fillRect(x+Math.round(f.w/2),y+12,Math.round(f.w/2)-3,18);
    cx.fillStyle='#00FFCC';cx.fillRect(x+6,y+18,3,3);
    cx.fillStyle='#FF0055';cx.fillRect(x+f.w-9,y+18,3,3);
    const da=0.32+Math.sin(t*.009)*.20;
    cx.fillStyle=`rgba(0,255,200,${da.toFixed(2)})`;cx.fillRect(x,y+Math.round(f.h/2)-1,Math.round(f.w/2),2);
    cx.fillStyle=`rgba(255,0,85,${da.toFixed(2)})`;cx.fillRect(x+Math.round(f.w/2),y+Math.round(f.h/2)-1,Math.round(f.w/2),2);
    cx.fillStyle=g.acc;cx.fillRect(x+4,y-5,4,5);
    cx.fillStyle=g.alt;cx.fillRect(x+f.w-8,y-5,4,5);
  } else if(f.godIdx===13){ // Tlaltecuhtli — INAH: stone monolith, skull at belt, earth cracks
    cx.fillStyle='#502010';
    cx.fillRect(x+1,y+11,6,21);cx.fillRect(x+f.w-7,y+11,6,21);
    cx.fillRect(x+4,y+8,f.w-8,5);
    cx.fillStyle='#8a1808';cx.fillRect(x+7,y+12,f.w-14,14);
    // Skull at belt/waist (INAH: skull iconography on the monolith belt)
    cx.fillStyle=g.hi;cx.fillRect(x+9,y+24,8,5);
    cx.fillStyle=g.alt;cx.fillRect(x+9,y+24,2,2);cx.fillRect(x+15,y+24,2,2);
    cx.fillStyle=g.body;for(let ti=0;ti<4;ti++) cx.fillRect(x+9+ti*2,y+28,1,2);
    cx.fillStyle=g.acc;
    cx.fillRect(x+7,y+14,3,10);cx.fillRect(x+f.w-10,y+14,3,10);
    cx.fillRect(x+10,y+20,f.w-20,2);
    if(f.onGround&&Math.abs(f.vx)<0.5){
      cx.fillStyle='rgba(180,80,20,0.45)';cx.fillRect(x-8,y+f.h,f.w+16,3);
      cx.fillStyle='rgba(100,180,50,0.28)';cx.fillRect(x-12,y+f.h+3,f.w+24,2);
    }
  } else if(f.godIdx===14){ // Tlazolteotl — unchanged
    const sta=0.18+Math.sin(t*.011)*.14;
    cx.fillStyle=`rgba(255,100,180,${sta.toFixed(2)})`;
    cx.fillRect(x-4,y+16,5,16);cx.fillRect(x+f.w-1,y+20,5,12);
    cx.fillStyle=g.acc;
    cx.fillRect(x+5,y+4,3,3);cx.fillRect(x+f.w-8,y+4,3,3);
    cx.fillStyle=g.alt;cx.fillRect(x+4,y+16,f.w-8,4);
    cx.fillStyle=g.acc+'aa';cx.fillRect(x+2,y+28,f.w-4,8);
  } else if(f.godIdx===15){ // Xochipilli — unchanged
    cx.fillStyle=g.acc;
    cx.fillRect(x+Math.round(f.w/2)-3,y-7,7,7);
    cx.fillStyle=g.alt;cx.fillRect(x+Math.round(f.w/2)-1,y-9,3,3);
    cx.fillStyle='#ff4488';cx.fillRect(x+2,y-6,3,3);cx.fillRect(x+f.w-5,y-6,3,3);
    const ba=0.22+Math.sin(t*.014)*.18;
    cx.fillStyle=`rgba(255,150,180,${ba.toFixed(2)})`;cx.fillRect(x+2,y+14,f.w-4,14);
    cx.fillStyle=g.alt;cx.fillRect(x+5,y+10,f.w-10,3);
  } else if(f.godIdx===16){ // Xochiquetzal — unchanged
    cx.fillStyle=g.alt;
    cx.fillRect(x-5,y+12,5,20);cx.fillRect(x+f.w,y+12,5,20);
    cx.fillRect(x-3,y+6,4,12);cx.fillRect(x+f.w-1,y+6,4,12);
    cx.fillStyle=g.acc;cx.fillRect(x+3,y+10,f.w-6,4);
    const ga=0.18+Math.sin(t*.008)*.13;
    cx.fillStyle=`rgba(255,200,50,${ga.toFixed(2)})`;cx.fillRect(x+1,y+8,f.w-2,28);
  }


  // Head — per-god proportions (INAH ceramic ref): variable width + y-offset
  const hW2=Math.max(8,Math.min(22,14+hWA));
  const hX2=x+Math.round((26-hW2)/2);
  // Cartoon outline: dark border around head
  cx.fillStyle='#060408';
  cx.fillRect(hX2-1,y+1+hYO,hW2+2,12);
  cx.fillStyle=g.body;
  cx.fillRect(hX2,y+2+hYO,hW2,8);
  cx.fillRect(hX2+1,y+10+hYO,hW2-2,1);
  cx.fillRect(hX2+2,y+11+hYO,hW2-4,1);

  // Neck
  cx.fillStyle=g.body;cx.fillRect(x+9,y+10+hYO,8,4);
  cx.fillStyle='#0a0818';
  cx.fillRect(x+6,y+12+hYO,3,2);cx.fillRect(x+f.w-9,y+12+hYO,3,2);

  // Skull paint para Mictecacihuatl
  if(f.godIdx===8){
    cx.fillStyle='rgba(255,255,255,0.72)';cx.fillRect(hX2,y+2+hYO,hW2,10);
    cx.fillStyle=g.body;cx.fillRect(hX2+2,y+4+hYO,4,4);cx.fillRect(hX2+hW2-6,y+4+hYO,4,4);
  }

  // Hair — ajustado al y-offset de la cabeza
  cx.fillStyle='#0a0818';cx.fillRect(x+5,y-3+hYO,16,5);
  cx.fillRect(x+3,y-1+hYO,4,4);cx.fillRect(x+f.w-7,y-1+hYO,4,4);
  cx.fillStyle=g.hat;cx.fillRect(fac===1?x+f.w-7:x+2,y-3+hYO,5,3);

  // Cara — perspectiva 3/4, shifteada con hYO
  const nearX=fac===1?x+14:x+8, farX=fac===1?x+7:x+15;
  cx.fillStyle='#0a0818';cx.fillRect(nearX-1,y+4+hYO,5,1);cx.fillRect(farX,y+5+hYO,3,1);
  cx.fillStyle=g.eye;cx.fillRect(farX,y+6+hYO,2,1);
  cx.fillRect(nearX,y+5+hYO,3,2);
  cx.fillStyle='rgba(255,255,180,0.45)';cx.fillRect(nearX+1,y+5+hYO,1,1);
  cx.fillStyle='#0a0818';cx.fillRect(x+12,y+9+hYO,2,1);
  cx.fillStyle='rgba(10,8,24,0.6)';cx.fillRect(x+9,y+11+hYO,8,1);

  drawFacePaint(f,x+atkLean,y+hYO,fac,g);
  drawHeaddress(f,x+atkLean,y+hYO,fac,g,t);

  if(atkPh>0.45){
    // Focused fist glow — warm energy at the punching hand, not the whole body
    const fistX=fac===1?x+f.w+7:x-13,fistY=y+13;
    const [_fr,_fg,_fb]=hexToRgbArr(g.acc);
    cx.fillStyle=`rgba(${_fr},${_fg},${_fb},0.20)`;cx.fillRect(fistX-4,fistY-4,14,14);
    cx.fillStyle=`rgba(255,235,140,0.38)`;cx.fillRect(fistX-1,fistY-1,8,8);
    cx.fillStyle=`rgba(255,255,230,0.60)`;cx.fillRect(fistX+1,fistY+1,4,4);
    // Energy streak extending from the punch
    cx.fillStyle=`rgba(${_fr},${_fg},${_fb},0.18)`;
    cx.fillRect(fac===1?x+f.w:x-12,y+17,fac*12,2);
    cx.fillRect(fac===1?x+f.w:x-10,y+21,fac*8,1);
  } else if(atkPh>0){
    // Wind-up / retract — subtle warm glow on the arm area only
    const _wa=(atkPh>0.78?(atkPh-0.78)/0.22:atkPh/0.45)*0.10;
    cx.fillStyle=`rgba(255,200,80,${_wa.toFixed(2)})`;cx.fillRect(x+2,y+10,f.w-4,f.h-12);
  }
  if(f.hitstun>0){
    if(f.hitstun>=(f.hitstunMax||f.hitstun)-2){cx.fillStyle='rgba(255,255,255,0.9)';cx.fillRect(x,y,f.w,f.h);}
    else if(Math.floor(f.hitstun/3)%2===0){cx.fillStyle='rgba(255,80,0,0.4)';cx.fillRect(x,y,f.w,f.h);}
  }
  const _hpR=f.hp/f.maxHp;
  if(_hpR<0.5){
    cx.fillStyle='rgba(8,2,16,0.85)';
    cx.fillRect(x+8,y+14,1,7);cx.fillRect(x+9,y+15,1,5);
    cx.fillStyle='rgba(90,70,100,0.5)';cx.fillRect(x+10,y+14,1,5);
    if(_hpR<0.25){
      cx.fillStyle='rgba(8,2,16,0.85)';
      cx.fillRect(x+16,y+10,1,9);cx.fillRect(x+17,y+11,1,7);
      cx.fillStyle='rgba(120,0,0,0.38)';cx.fillRect(x+8,y+14,3,9);
      cx.fillStyle='rgba(90,70,100,0.5)';cx.fillRect(x+18,y+10,1,7);
    }
  }
}

// Parse "#rrggbb" → [r, g, b]
function hexToRgbArr(h){const c=parseInt(h.replace('#',''),16);return[(c>>16)&255,(c>>8)&255,c&255];}

// Element-specific inner detail drawn inside a solar explosion
function drawSolarElementDetail(s,g,fade,t){
  const gi=s.godIdx, r=s.r;
  cx.globalAlpha=fade*0.5;
  cx.lineWidth=1;
  // Fire: Huitzilopochtli(2), Xipe Totec(4), Tonatiuh(9)
  if(gi===2||gi===4||gi===9){
    cx.strokeStyle='#ffcc00';
    for(let i=0;i<8;i++){
      const ang=i*(Math.PI/4)+t*0.002;
      cx.beginPath();cx.moveTo(s.x+Math.cos(ang)*r*.3,s.y+Math.sin(ang)*r*.3);
      cx.lineTo(s.x+Math.cos(ang)*r*.88,s.y+Math.sin(ang)*r*.88);cx.stroke();
    }
  }
  // Water: Tlaloc(3), Chalchihuitlicue(6)
  else if(gi===3||gi===6){
    cx.strokeStyle='#00eeff';
    for(let i=0;i<3;i++){
      cx.beginPath();cx.arc(s.x,s.y,r*(0.22+i*.24),0,Math.PI*2);cx.stroke();
    }
  }
  // Shadow/Obsidian: Tezcatlipoca(0), Xolotl(10)
  else if(gi===0||gi===10){
    cx.strokeStyle=g.acc;
    for(let i=0;i<6;i++){
      const ang=i*(Math.PI/3);
      const len=r*(0.38+Math.sin(t*0.012+i)*.12);
      cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x+Math.cos(ang)*len,s.y+Math.sin(ang)*len);cx.stroke();
    }
  }
  // Death King: Mictlantecuhtli(7)
  else if(gi===7){
    cx.fillStyle=`rgba(10,8,20,${fade*0.4})`;
    cx.beginPath();cx.arc(s.x,s.y,r*1.1,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#D8C8B0';cx.lineWidth=1;
    for(let i=0;i<4;i++){
      const ang=i*(Math.PI/4);
      const len=r*0.55+Math.sin(t*0.008)*2;
      cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x+Math.cos(ang)*len,s.y+Math.sin(ang)*len);cx.stroke();
    }
    cx.fillStyle='#E8DEC4';
    for(let i=0;i<3;i++){
      const ang=t*0.003+i*(Math.PI*2/3);
      cx.fillRect(s.x+Math.cos(ang)*r*0.6-1,s.y+Math.sin(ang)*r*0.6-1,2,2);
    }
  }
  // Death Queen: Mictecacihuatl(8)
  else if(gi===8){
    cx.fillStyle=`rgba(80,20,120,${fade*0.35})`;
    cx.beginPath();cx.arc(s.x,s.y,r*1.1,0,Math.PI*2);cx.fill();
    cx.fillStyle='#FFAA00';
    cx.beginPath();cx.arc(s.x,s.y,r*0.3,0,Math.PI*2);cx.fill();
    cx.fillStyle='#FF8800';
    for(let i=0;i<8;i++){
      const ang=t*0.005+i*(Math.PI/4);
      cx.save();cx.translate(s.x+Math.cos(ang)*r*0.7,s.y+Math.sin(ang)*r*0.7);cx.rotate(ang);
      cx.fillRect(-0.5,-1,1,2);cx.restore();
    }
  }
  // Moon: Coyolxauhqui(11)
  else if(gi===11){
    cx.strokeStyle='#ccccff';cx.lineWidth=2;
    cx.beginPath();cx.arc(s.x,s.y,r*.46,0.45,Math.PI*1.78);cx.stroke();
    cx.lineWidth=1;
  }
  // Serpent Skirt: Coatlicue(5)
  else if(gi===5){
    cx.fillStyle=`rgba(10,20,5,${fade*0.45})`;
    cx.beginPath();cx.arc(s.x,s.y,r*1.1,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#2A3010';cx.lineWidth=1;
    for(let i=0;i<6;i++){
      const ang=i*(Math.PI/3);
      cx.beginPath();cx.arc(s.x+Math.cos(ang)*r*0.65,s.y+Math.sin(ang)*r*0.65,r*0.18,0,Math.PI*2);cx.stroke();
    }
    cx.fillStyle='#D0C8A0';
    [[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy])=>{
      cx.fillRect(s.x+dx*r*0.75-0.5,s.y+dy*r*0.75-1,1,2);
    });
  }
  // Earth Lord: Tlaltecuhtli(13)
  else if(gi===13){
    cx.fillStyle=`rgba(60,30,10,${fade*0.3})`;
    cx.beginPath();cx.arc(s.x,s.y,r*1.1,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#5A3A20';cx.lineWidth=1;
    for(let k=0;k<4;k++){
      const ba=k*(Math.PI/2);
      cx.beginPath();cx.moveTo(s.x,s.y);
      let ox=s.x,oy=s.y;
      for(let j=0;j<4;j++){
        ox+=Math.cos(ba)*2;oy+=Math.sin(ba)*2;
        ox+=(-Math.sin(ba))*(j%2===0?-1:1);oy+=(Math.cos(ba))*(j%2===0?-1:1);
        cx.lineTo(ox,oy);
      }
      cx.stroke();
    }
    cx.fillStyle='#7A5030';
    for(let i=0;i<4;i++){
      const ang=t*0.002+i*(Math.PI/2);
      cx.fillRect(s.x+Math.cos(ang)*r*0.7-1,s.y+Math.sin(ang)*r*0.7-1.5,2,3);
    }
  }
  // Flowers: Xochipilli(15), Xochiquetzal(16)
  else if(gi===15||gi===16){
    cx.fillStyle=g.acc;
    for(let i=0;i<6;i++){
      const ang=i*(Math.PI/3)+t*0.004;
      cx.beginPath();cx.arc(s.x+Math.cos(ang)*r*.46,s.y+Math.sin(ang)*r*.46,3,0,Math.PI*2);cx.fill();
    }
  }
  // Duality: Ometeotl(12)
  else if(gi===12){
    cx.fillStyle='rgba(0,255,204,0.35)';
    cx.beginPath();cx.arc(s.x,s.y,r*.52,Math.PI,0);cx.fill();
    cx.fillStyle='rgba(255,0,85,0.35)';
    cx.beginPath();cx.arc(s.x,s.y,r*.52,0,Math.PI);cx.fill();
  }
  // Steam/Purge: Tlazolteotl(14)
  else if(gi===14){
    cx.strokeStyle=g.acc;
    for(let i=0;i<4;i++){
      const ang=i*(Math.PI/2)+t*0.008;
      cx.beginPath();cx.arc(s.x+Math.cos(ang)*r*.35,s.y+Math.sin(ang)*r*.35,r*.18,0,Math.PI*2);cx.stroke();
    }
  }
  cx.lineWidth=1;cx.globalAlpha=1;
}

// Per-god thematic orb shapes — replaces generic circle in drawSpecials
function drawOrbShape(s,g,a,t){
  const gi=s.godIdx,x=s.x,y=s.y,r=s.r;
  const vx=s.vx||0,vy=s.vy||0;
  const ma=Math.atan2(vy,vx); // motion direction
  const sp=t*0.015;            // slow spin
  cx.save(); cx.globalAlpha=a;
  switch(gi){
    case 1:{ // Quetzalcoatl — feather / pluma emplumada
      cx.translate(x,y); cx.rotate(ma);
      cx.fillStyle='#c89000';
      cx.beginPath(); cx.moveTo(-r*1.4,0); cx.quadraticCurveTo(-r*0.4,r*1.1,r*1.6,0); cx.fill();
      cx.fillStyle='#e8b800';
      cx.beginPath(); cx.moveTo(-r*1.4,0); cx.quadraticCurveTo(-r*0.4,-r*1.1,r*1.6,0); cx.fill();
      cx.fillStyle='#00cc44';
      cx.beginPath(); cx.ellipse(r*1.55,0,r*0.38,r*0.22,0,0,Math.PI*2); cx.fill();
      cx.strokeStyle='rgba(255,255,180,0.9)'; cx.lineWidth=1.5;
      cx.beginPath(); cx.moveTo(-r*1.5,0); cx.lineTo(r*1.7,0); cx.stroke();
      break;}
    case 2:{ // Huitzilopochtli — gota de fuego (treasure)
      cx.translate(x,y); cx.rotate(ma);
      cx.fillStyle='#ff8800';
      cx.beginPath(); cx.ellipse(0,0,r*0.65,r*1.1,0,0,Math.PI*2); cx.fill();
      cx.fillStyle='#ffdd00';
      cx.beginPath(); cx.ellipse(0,r*0.12,r*0.32,r*0.58,0,0,Math.PI*2); cx.fill();
      cx.fillStyle='rgba(255,255,255,0.55)';
      cx.beginPath(); cx.arc(-r*0.18,-r*0.2,r*0.2,0,Math.PI*2); cx.fill();
      break;}
    case 3:{ // Tlaloc — rayo / lightning bolt
      cx.translate(x,y); cx.rotate(ma);
      cx.shadowColor='#00eeff'; cx.shadowBlur=8;
      cx.strokeStyle='#00aaff'; cx.lineWidth=4;
      cx.beginPath();
      cx.moveTo(-r*2,-r*0.45); cx.lineTo(-r*0.4,-r*0.45);
      cx.lineTo(-r*1.1,r*0.1); cx.lineTo(r*0.2,r*0.1);
      cx.lineTo(-r*0.5,r*0.65); cx.lineTo(r*2,r*0.65);
      cx.stroke();
      cx.strokeStyle='#eeffff'; cx.lineWidth=1.5; cx.stroke();
      cx.shadowBlur=0;
      break;}
    case 5:{ // Coatlicue — serpiente con cabeza y lengua
      cx.translate(x,y); cx.rotate(ma);
      cx.fillStyle='#80c020';
      cx.beginPath(); cx.ellipse(-r*0.25,0,r*1.5,r*0.55,0,0,Math.PI*2); cx.fill();
      cx.strokeStyle='#4a7a10'; cx.lineWidth=1;
      for(let i=0;i<3;i++){cx.beginPath(); cx.arc(-r*0.7+i*r*0.68,r*0.08,r*0.26,0,Math.PI*2); cx.stroke();}
      cx.fillStyle='#c09000';
      cx.beginPath(); cx.moveTo(r*1.38,0); cx.lineTo(r*0.82,-r*0.72); cx.lineTo(r*0.82,r*0.72); cx.closePath(); cx.fill();
      cx.fillStyle='#ff9900';
      cx.beginPath(); cx.arc(r*1.15,-r*0.22,r*0.15,0,Math.PI*2); cx.fill();
      cx.strokeStyle='#ff2200'; cx.lineWidth=1.2;
      cx.beginPath(); cx.moveTo(r*1.65,0); cx.lineTo(r*2.05,-r*0.28); cx.moveTo(r*1.65,0); cx.lineTo(r*2.05,r*0.28); cx.stroke();
      break;}
    case 6:{ // Chalchihuitlicue — gema hexagonal de jade
      cx.translate(x,y); cx.rotate(sp);
      cx.fillStyle='#00e8c0';
      cx.beginPath();
      for(let i=0;i<6;i++){const aa=i*Math.PI/3; i===0?cx.moveTo(Math.cos(aa)*r,Math.sin(aa)*r):cx.lineTo(Math.cos(aa)*r,Math.sin(aa)*r);}
      cx.closePath(); cx.fill();
      cx.strokeStyle='rgba(180,255,240,0.7)'; cx.lineWidth=1;
      [[0,-r,0,r],[-r*0.87,-r*0.5,r*0.87,r*0.5],[r*0.87,-r*0.5,-r*0.87,r*0.5]].forEach(([x1,y1,x2,y2])=>{
        cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.stroke();});
      cx.fillStyle='rgba(255,255,255,0.5)'; cx.beginPath(); cx.arc(-r*0.22,-r*0.22,r*0.25,0,Math.PI*2); cx.fill();
      break;}
    case 7:{
      cx.translate(x,y); cx.rotate(ma);
      // Large sculpted bone — dumbbell shape scaled up
      cx.fillStyle='#D8CCBA';

// Per-god thematic sweep visuals — replaces generic rectangle in drawSpecials

        cx.lineTo(fx2-4+Math.round(Math.sin(t*0.015+i*0.7)*3),sy+sh*0.18);cx.lineTo(fx2+2,sy+4);cx.stroke();
        // Inner flame (yellow)
        cx.strokeStyle=`rgba(255,220,0,${(a*(0.7+flicker)).toFixed(2)})`;cx.lineWidth=1.5;
        cx.beginPath();cx.moveTo(fx2,sy+sh);cx.lineTo(fx2+Math.round(Math.sin(t*0.022+i*1.3)*3),sy+sh*0.5);
        cx.lineTo(fx2,sy+sh*0.22);cx.stroke();
      }
      // Ember glow at base
      cx.fillStyle=`rgba(255,180,0,${(a*0.35).toFixed(2)})`;
      cx.fillRect(sx,sy+sh-5,sw,5);
      break;}
    case 3:{ // Tlaloc — lluvia de tormenta
      cx.strokeStyle=`rgba(0,170,255,${(a*0.55).toFixed(2)})`;cx.lineWidth=1.5;
      const nrd=Math.max(5,Math.round(sw/20));
      for(let i=0;i<nrd;i++){
        const rx=sx+(i+0.5)*(sw/nrd);
        const ry=sy+(((i*7+Math.floor(t*0.04))%12)/12)*sh;
        cx.beginPath();cx.moveTo(rx,ry);cx.lineTo(rx-2,ry+8);cx.stroke();
      }
      const lmx=sx+sw*0.5;
      cx.strokeStyle=`rgba(0,230,255,${(a*0.75).toFixed(2)})`;cx.lineWidth=2.5;
      cx.beginPath();cx.moveTo(lmx,sy+2);cx.lineTo(lmx-8,sy+sh*0.4);cx.lineTo(lmx+6,sy+sh*0.6);cx.lineTo(lmx-4,sy+sh-2);cx.stroke();
      cx.strokeStyle=`rgba(200,245,255,${(a*0.8).toFixed(2)})`;cx.lineWidth=1;cx.stroke();
      break;}
    case 7:{ // Mictlantecuhtli — lluvia de huesos con calaveras rotando
      cx.fillStyle=`rgba(14,8,6,${(a*0.55).toFixed(2)})`;cx.fillRect(sx,sy,sw,sh);
      const nb=Math.max(4,Math.round(sw/38));
      for(let i=0;i<nb;i++){
        const bx=sx+sw*(0.08+i*0.84/(nb-1||1));
        const by=sy+(((i*11+Math.floor(t*0.03))%16)/16)*sh;
        const br=t*0.008*(i%2===0?1:-1);
        cx.save(); cx.translate(bx,by); cx.rotate(br);
        // Skull
        cx.fillStyle=`rgba(220,210,190,${(a*0.82).toFixed(2)})`;
        cx.beginPath(); cx.ellipse(0,0,7,6,0,0,Math.PI*2); cx.fill();
        cx.fillStyle=`rgba(10,6,4,${(a*0.9).toFixed(2)})`;
        cx.fillRect(-4,-3,3,3); cx.fillRect(2,-3,3,3); // eye sockets
        cx.fillRect(-2,2,5,2); // jaw void
        cx.fillStyle=`rgba(220,210,190,${(a*0.7).toFixed(2)})`;
        cx.fillRect(-2,3,1,2); cx.fillRect(0,3,1,2); cx.fillRect(2,3,1,2); // teeth
        cx.restore();
        // Bone shaft below skull
        cx.fillStyle=`rgba(200,190,170,${(a*0.6).toFixed(2)})`;
        cx.fillRect(bx-1,by+6,2,6);
      }
      break;}
    case 8:{ // Mictecacihuatl — cempasúchil de la muerte
      cx.fillStyle=`rgba(40,0,60,${(a*0.3).toFixed(2)})`;cx.fillRect(sx,sy,sw,sh);
      const nfl=Math.max(3,Math.round(sw/50));
      for(let i=0;i<nfl;i++){
        const fxx=sx+sw*(0.12+i*0.76/(nfl-1||1));
        const fyy=sy+sh*0.5;
        for(let p=0;p<6;p++){
          const ang=p*(Math.PI/3)+t*0.008;
          cx.fillStyle=p%2===0?`rgba(255,136,0,${(a*0.6).toFixed(2)})`:`rgba(204,102,255,${(a*0.5).toFixed(2)})`;
          cx.beginPath();cx.ellipse(fxx+Math.cos(ang)*7,fyy+Math.sin(ang)*7,3,6,ang,0,Math.PI*2);cx.fill();
        }
        cx.fillStyle=`rgba(255,80,0,${(a*0.7).toFixed(2)})`;cx.beginPath();cx.arc(fxx,fyy,3,0,Math.PI*2);cx.fill();
      }
      break;}
    case 9:{ // Tonatiuh — rayos solares
      cx.fillStyle=`rgba(255,150,0,${(a*0.22).toFixed(2)})`;cx.fillRect(sx,sy,sw,sh);
      cx.strokeStyle=`rgba(255,220,0,${(a*0.72).toFixed(2)})`;cx.lineWidth=2.5;
      const nsr=Math.max(3,Math.round(sw/50));
      for(let i=0;i<nsr;i++){
        const rx=sx+sw*(0.12+i*0.76/(nsr-1||1));
        cx.beginPath();cx.moveTo(rx-5,sy+sh);cx.lineTo(rx,sy+4);cx.lineTo(rx+5,sy+sh);cx.stroke();
      }
      cx.strokeStyle=`rgba(255,255,200,${(a*0.4).toFixed(2)})`;cx.lineWidth=1;
      cx.beginPath();cx.moveTo(sx,sy+sh*0.5);cx.lineTo(sx+sw,sy+sh*0.5);cx.stroke();
      break;}
    case 12:{ // Ometeotl — energía dual creación/destrucción
      cx.fillStyle=`rgba(0,200,150,${(a*0.22).toFixed(2)})`;cx.fillRect(sx,sy,sw/2,sh);
      cx.fillStyle=`rgba(255,0,85,${(a*0.22).toFixed(2)})`;cx.fillRect(sx+sw/2,sy,sw/2,sh);
      const nhalf=Math.max(2,Math.round(sw/2/40));
      cx.strokeStyle=`rgba(0,255,204,${(a*0.6).toFixed(2)})`;cx.lineWidth=1.5;
      for(let i=0;i<nhalf;i++){const hx=sx+(i+0.5)*(sw/2/nhalf);cx.beginPath();cx.moveTo(hx,sy+2);cx.lineTo(hx,sy+sh-2);cx.stroke();}
      cx.strokeStyle=`rgba(255,0,85,${(a*0.6).toFixed(2)})`;
      for(let i=0;i<nhalf;i++){const hx=sx+sw/2+(i+0.5)*(sw/2/nhalf);cx.beginPath();cx.moveTo(hx,sy+2);cx.lineTo(hx,sy+sh-2);cx.stroke();}
      cx.strokeStyle=`rgba(255,255,255,${(a*0.55).toFixed(2)})`;cx.lineWidth=2;
      cx.beginPath();cx.moveTo(sx+sw/2,sy);cx.lineTo(sx+sw/2,sy+sh);cx.stroke();
      break;}
    case 15:{ // Xochipilli — lluvia de pétalos
      cx.fillStyle=`rgba(30,5,15,${(a*0.2).toFixed(2)})`;cx.fillRect(sx,sy,sw,sh);
      const np15=Math.max(5,Math.round(sw/28));
      for(let i=0;i<np15;i++){
        const px15=sx+sw*(0.06+i*0.88/(np15-1||1));
        const py15=sy+sh*0.5+Math.sin(t*0.014+i)*sh*0.3;
        cx.fillStyle=i%2===0?`rgba(255,136,187,${(a*0.72).toFixed(2)})`:`rgba(255,204,68,${(a*0.65).toFixed(2)})`;
        cx.beginPath();cx.ellipse(px15,py15,3,7,t*0.012+i,0,Math.PI*2);cx.fill();
      }
      break;}
    case 16:{ // Xochiquetzal — trampa de hilo de seda y flores
      cx.fillStyle=`rgba(60,10,55,${(a*0.22).toFixed(2)})`;cx.fillRect(sx,sy,sw,sh);
      cx.strokeStyle=`rgba(255,204,68,${(a*0.5).toFixed(2)})`;cx.lineWidth=1;
      const nt16=Math.max(3,Math.round(sw/40));
      for(let i=0;i<nt16;i++){
        const tx=sx+sw*(0.12+i*0.76/(nt16-1||1));
        cx.beginPath();cx.moveTo(tx-sw*0.12,sy);cx.lineTo(tx+sw*0.12,sy+sh);cx.stroke();
        cx.beginPath();cx.moveTo(tx+sw*0.12,sy);cx.lineTo(tx-sw*0.12,sy+sh);cx.stroke();
      }
      const nfl16=Math.max(3,Math.round(sw/55));
      cx.fillStyle=`rgba(255,136,255,${(a*0.58).toFixed(2)})`;
      for(let i=0;i<nfl16;i++){cx.beginPath();cx.arc(sx+sw*(0.18+i*0.64/(nfl16-1||1)),sy+sh*0.5,4,0,Math.PI*2);cx.fill();}
      break;}
    default: break;
  }
}

function drawSpecials(t, pass) {
  for(const s of specials){
    const isAfter=s.type==='afterimage'||s.type==='smoke'||s.type==='dust';
    if(pass===0&&!isAfter) continue;
    if(pass===1&& isAfter) continue;
    const a=s.life/s.maxLife;
    const g=(s.godIdx!==undefined&&GODS[s.godIdx])?GODS[s.godIdx]:null;

    if(s.type==='afterimage'){
      if(g){
        const [br,bg,bb]=hexToRgbArr(g.body);
        const [ar,ag,ab]=hexToRgbArr(g.acc);
        cx.fillStyle=`rgba(${br},${bg},${bb},${(a*0.45).toFixed(2)})`;
        cx.fillRect(Math.round(s.x),Math.round(s.y),s.w,s.h);
        cx.strokeStyle=`rgba(${ar},${ag},${ab},${(a*0.78).toFixed(2)})`;
        cx.lineWidth=1;cx.strokeRect(Math.round(s.x)+1,Math.round(s.y)+1,s.w-2,s.h-2);
      } else {
        cx.fillStyle=`rgba(30,10,50,${(a*0.5).toFixed(2)})`;cx.fillRect(Math.round(s.x),Math.round(s.y),s.w,s.h);
        cx.strokeStyle=`rgba(140,60,240,${(a*0.65).toFixed(2)})`;cx.lineWidth=1;cx.strokeRect(Math.round(s.x)+1,Math.round(s.y)+1,s.w-2,s.h-2);
      }
    }
    if(s.type==='smoke'){
      const r=s.w, bx=Math.round(s.x), by=Math.round(s.y);
      cx.fillStyle=`rgba(20,150,120,${(a*0.20).toFixed(2)})`;
      cx.beginPath();cx.arc(bx,by,r+4,0,Math.PI*2);cx.fill();
      cx.fillStyle=`rgba(195,165,25,${(a*0.55).toFixed(2)})`;
      cx.beginPath();cx.arc(bx,by,r,0,Math.PI*2);cx.fill();
      cx.fillStyle=`rgba(242,232,155,${(a*0.72).toFixed(2)})`;
      cx.beginPath();cx.arc(bx,by,r*0.5,0,Math.PI*2);cx.fill();
      if(r>=5){
        cx.fillStyle=`rgba(20,150,120,${(a*0.38).toFixed(2)})`;
        cx.beginPath();cx.arc(bx+Math.round(r*0.7),by-Math.round(r*0.5),r*0.38,0,Math.PI*2);cx.fill();
        cx.beginPath();cx.arc(bx-Math.round(r*0.6),by+Math.round(r*0.4),r*0.32,0,Math.PI*2);cx.fill();
        cx.fillStyle=`rgba(255,240,100,${(a*0.55).toFixed(2)})`;
        cx.fillRect(bx+Math.round(r*0.3),by-Math.round(r*0.7),2,2);
      }
    }
    if(s.type==='spark'){
      const [sr,sg,sb]=hexToRgbArr(s.color||'#ffcc00');
      cx.fillStyle=`rgba(${sr},${sg},${sb},${(a*0.9).toFixed(2)})`;
      cx.fillRect(Math.round(s.x)-1,Math.round(s.y)-1,2,2);
      cx.fillStyle=`rgba(255,255,200,${(a*0.7).toFixed(2)})`;
      cx.fillRect(Math.round(s.x),Math.round(s.y),1,1);
    }
    if(s.type==='petal'){
      const [pr,pg,pb]=hexToRgbArr(s.color||'#ff88bb');
      cx.save();cx.globalAlpha=a*0.88;
      cx.translate(Math.round(s.x),Math.round(s.y));cx.rotate(s.rot||0);
      cx.fillStyle=`rgb(${pr},${pg},${pb})`;
      cx.beginPath();cx.ellipse(0,0,4,2,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='rgba(255,255,220,0.55)';
      cx.beginPath();cx.ellipse(-1,-0.5,1.5,0.8,0,0,Math.PI*2);cx.fill();
      cx.restore();
    }
    if(s.type==='dust'){
      cx.fillStyle=`rgba(180,140,80,${(a*0.45).toFixed(2)})`;
      cx.fillRect(Math.round(s.x),Math.round(s.y),s.w||3,s.h||3);
      cx.fillStyle=`rgba(220,200,140,${(a*0.25).toFixed(2)})`;
      cx.fillRect(Math.round(s.x)-1,Math.round(s.y)-1,(s.w||3)+2,(s.h||3)+2);
    }
    if(s.type==='hitstar'){
      const _hs=Math.round(2+a*6),_hbx=Math.round(s.x),_hby=Math.round(s.y);
      const [_hr,_hg2,_hb2]=hexToRgbArr(s.color);
      // Cross arms
      cx.fillStyle=`rgba(${_hr},${_hg2},${_hb2},${(a*0.95).toFixed(2)})`;
      cx.fillRect(_hbx-_hs,_hby-1,_hs*2,3);cx.fillRect(_hbx-1,_hby-_hs,3,_hs*2);
      // White center flash
      cx.fillStyle=`rgba(255,255,255,${(a*0.90).toFixed(2)})`;
      cx.fillRect(_hbx-1,_hby-1,3,3);
      // Diagonal accent dots
      const _hd=Math.round(_hs*0.65);
      cx.fillStyle=`rgba(${_hr},${_hg2},${_hb2},${(a*0.60).toFixed(2)})`;
      cx.fillRect(_hbx-_hd-1,_hby-_hd-1,2,2);cx.fillRect(_hbx+_hd-1,_hby-_hd-1,2,2);
      cx.fillRect(_hbx-_hd-1,_hby+_hd-1,2,2);cx.fillRect(_hbx+_hd-1,_hby+_hd-1,2,2);
    }
    if(s.type==='orb'){
      // Elemental velocity trail
      const vx=s.vx||0,vy=s.vy||0,spd=Math.hypot(vx,vy);
      if(spd>1&&g){
        const [cr,cg2,cb]=hexToRgbArr(s.color);
        for(let ti=5;ti>=1;ti--){
          const ta=a*0.32*(ti/5);
          cx.fillStyle=`rgba(${cr},${cg2},${cb},${ta.toFixed(2)})`;
          cx.beginPath();cx.arc(s.x-vx*ti*0.85,s.y-vy*ti*0.85,s.r*(0.18+0.32*(ti/5)),0,Math.PI*2);cx.fill();
        }
      }
      const pulse=0.82+Math.sin(t*0.03)*0.18;
      cx.fillStyle=s.color+'28';cx.beginPath();cx.arc(s.x,s.y,s.r*2.8*pulse,0,Math.PI*2);cx.fill();
      drawOrbShape(s,g,a,t);
    }
    if(s.type==='solar'){
      const fade=Math.min(1,a*2.2);
      cx.strokeStyle=s.color;cx.lineWidth=Math.max(1,3*fade);cx.globalAlpha=fade*0.9;
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.stroke();
      cx.fillStyle=s.color+'40';cx.globalAlpha=fade*0.6;
      cx.beginPath();cx.arc(s.x,s.y,s.r*.7,0,Math.PI*2);cx.fill();
      if(g&&s.r>8) drawSolarElementDetail(s,g,fade,t);
      cx.globalAlpha=1;
    }
    if(s.type==='sweep') drawSweepByGod(s,g,a,t);
  }
  cx.globalAlpha=1;cx.lineWidth=1;
}

function drawHPBars() {
  const BW=240,BH=16;
  for(let i=0;i<2;i++){
    const f=F[i],g=GODS[f.godIdx],fr=f.hp/f.maxHp;
    if(f.hpGhost===undefined||f.hpGhost<f.hp) f.hpGhost=f.hp;
    if(f.hpGhost>f.hp) f.hpGhost=Math.max(f.hp,f.hpGhost-0.3);
    const frGhost=f.hpGhost/f.maxHp;
    const col=fr>.5?'#22cc44':fr>.25?'#ddbb00':'#cc2200';
    const bx=i===0?18:W-18-BW,by=12;
    cx.fillStyle='rgba(0,0,0,0.7)';cx.fillRect(bx-2,by-2,BW+4,BH+52);
    cx.fillStyle='#333';cx.fillRect(bx,by,BW,BH);
    cx.fillStyle='rgba(255,210,60,0.50)'; // ghost — trails behind real bar
    if(i===0) cx.fillRect(bx,by,Math.round(frGhost*BW),BH);
    else      cx.fillRect(bx+BW-Math.round(frGhost*BW),by,Math.round(frGhost*BW),BH);
    cx.fillStyle=col;
    if(i===0) cx.fillRect(bx,by,Math.round(fr*BW),BH);
    else      cx.fillRect(bx+BW-Math.round(fr*BW),by,Math.round(fr*BW),BH);
    cx.fillStyle='rgba(255,255,255,0.12)';cx.fillRect(bx,by,BW,4);
    cx.strokeStyle='#7a6030';cx.lineWidth=2;cx.strokeRect(bx,by,BW,BH);
    cx.fillStyle=i===0?'#ffaa44':'#44aaff';
    cx.font='bold 9px monospace';cx.textAlign=i===0?'left':'right';
    cx.fillText(g.short,i===0?bx:bx+BW,by+BH+11);
    cx.fillStyle='#aaa';cx.font='8px monospace';cx.textAlign=i===0?'right':'left';
    cx.fillText(Math.round(f.hp)+'%',i===0?bx+BW:bx,by+BH+11);
    const sb=by+BH+15;
    const specFr=f.specialCD===0?1:1-f.specialCD/SPEC_CD[f.godIdx];
    cx.fillStyle='rgba(0,0,0,0.45)';cx.fillRect(bx,sb,BW,7);
    cx.fillStyle=f.specialCD===0?'#ffd700':'#5a4010';
    if(i===0) cx.fillRect(bx,sb,Math.round(specFr*BW),7);
    else      cx.fillRect(bx+BW-Math.round(specFr*BW),sb,Math.round(specFr*BW),7);
    cx.strokeStyle='#3a2800';cx.lineWidth=1;cx.strokeRect(bx,sb,BW,7);
    if(f.specialCD===0){
      const _pulse=0.45+Math.sin(Date.now()*0.012)*0.45;
      cx.strokeStyle=`rgba(255,215,0,${_pulse.toFixed(2)})`;cx.lineWidth=2;cx.strokeRect(bx-1,sb-1,BW+2,9);
      cx.fillStyle='#ffd700';cx.font='bold 7px monospace';
      cx.textAlign=i===0?'left':'right';
      cx.fillText('★ '+gstr(g,'specName'),i===0?bx:bx+BW,sb+18);
    }
    const shb=sb+27;
    cx.fillStyle='rgba(0,0,0,0.45)';cx.fillRect(bx,shb,BW,6);
    const shFr=Math.max(0,f.shieldHp/f.maxShieldHp);
    cx.fillStyle=f.shielding?'#00e8ff':shFr>0.3?'#0077aa':'#441100';
    if(i===0) cx.fillRect(bx,shb,Math.round(shFr*BW),6);
    else      cx.fillRect(bx+BW-Math.round(shFr*BW),shb,Math.round(shFr*BW),6);
    cx.strokeStyle='#003344';cx.lineWidth=1;cx.strokeRect(bx,shb,BW,6);
    cx.textAlign='left';
  }
}

function bigText(txt, x, y, sz, fill, border) {
  cx.font=`bold ${sz}px 'Courier New', monospace`;
  cx.textAlign='center';cx.textBaseline='middle';
  cx.fillStyle=border;
  [[-2,0],[2,0],[0,-2],[0,2]].forEach(([dx,dy])=>cx.fillText(txt,x+dx,y+dy));
  cx.fillStyle=fill;cx.fillText(txt,x,y);
  cx.textAlign='left';cx.textBaseline='alphabetic';
}

function drawSerpentBorder(t) {
  const ph = t * 0.001;
  const mx = W / 2;

  // ── LEFT BODY: FIRE SERPENT (xiuhcoatl) ─────────────────────
  cx.fillStyle = '#3c0c02'; cx.fillRect(6, 46, 22, H - 92);
  for (let i = 0; i < 26; i++) {
    const y = 46 + i * 14;
    const fl = Math.round(Math.sin(ph * 3 + i * 0.8) * 1.5);
    cx.fillStyle = '#a82e06'; cx.fillRect(6,  y,     22, 13);
    cx.fillStyle = '#d84a0c'; cx.fillRect(7,  y + 1, 18,  9);
    cx.fillStyle = '#f07820'; cx.fillRect(8,  y + 2, 12,  6);
    cx.fillStyle = '#ffc030'; cx.fillRect(9 + fl, y + 3, 7, 3);
    cx.fillStyle = '#fff068'; cx.fillRect(11 + fl, y + 3, 3, 2);
    // xicalcoliuhqui step-groove (greca, Xochicalco relief reference)
    // full-height vertical run so it always meets the divider below —
    // chains into the next segment's run with zero gap either direction
    cx.fillStyle = '#200802';
    if (i % 2 === 0) {
      cx.fillRect(17, y, 2, 13);
      cx.fillRect(10, y, 7, 2);
    } else {
      cx.fillRect(11, y, 2, 13);
      cx.fillRect(11, y, 7, 2);
    }
    // quetzal plume — feathered serpent
    cx.fillStyle = '#0a7858'; cx.fillRect(26, y + 1, 2, 11);

function drawThunderclouds(t) {
  const sec = t * 0.001;
  const clouds = [
    { ox:  55, oy: 68,  w: 88,  s:  7, spd: 6,  bf: 0.55, bp: 0.0 },
    { ox: 270, oy: 58,  w: 104, s: 13, spd: 4,  bf: 0.70, bp: 2.1 },
    { ox: 490, oy: 76,  w: 72,  s:  3, spd: 8,  bf: 0.85, bp: 3.8 },
    { ox: 660, oy: 63,  w: 96,  s: 19, spd: 5,  bf: 0.62, bp: 1.4 },
    { ox: 160, oy: 90,  w: 64,  s:  5, spd: 7,  bf: 0.78, bp: 5.0 },
  ];
  clouds.forEach(({ ox, oy, w, s, spd, bf, bp }) => {
    const cx2 = Math.round(((ox + sec * spd) % W + W) % W);
    const hw = w >> 1;
    // draw dark storm cloud before overlay — colours will be dimmed ~0.45× by it
    cx.fillStyle = 'rgba(72,60,115,0.78)';
    cx.fillRect(cx2 - hw,      oy + 6,  w,      14);
    cx.fillRect(cx2 - hw + 8,  oy,      w - 16, 12);
    cx.fillRect(cx2 - hw + 20, oy - 8,  w - 40, 12);
    cx.fillStyle = 'rgba(52,42,88,0.60)';
    cx.fillRect(cx2 - hw - 6,  oy + 8,  w + 12, 10);
    cx.fillStyle = 'rgba(22,15,44,0.80)';
    cx.fillRect(cx2 - hw + 4,  oy + 14, w - 8,  5);
    // also draw wrapped copy if cloud straddles the edge
    if (cx2 + hw > W) {
      const wx = cx2 - W;
      cx.fillStyle = 'rgba(72,60,115,0.78)';
      cx.fillRect(wx - hw,      oy + 6,  w,      14);
      cx.fillRect(wx - hw + 8,  oy,      w - 16, 12);
    }
    // lightning bolt from cloud belly — visible even after overlay
    const vis = (Math.sin(sec * bf + bp) + 1) * 0.5;
    if (vis < 0.55) return;
    const ba = (vis - 0.55) * 1.8 * 0.38; // gentle dim alpha before overlay
    const flash = Math.sin(sec * 24 + bp * 3.1) > 0.90;
    for (let i = 0; i < 22; i++) {
      const ys = oy + 19 + i * 8;
      if (ys > H - 52) break;
      const lean = s % 2 === 0 ? 1.3 : -1.1; // diagonal drift per segment
      const jag  = Math.round(Math.sin(s + i * s * 0.239) * 4);
      const bx   = cx2 + jag + Math.round(i * lean);
      if (flash) {
        cx.fillStyle = `rgba(155,120,240,${ba * 1.5})`;
        cx.fillRect(bx - 1, ys, 3, 7);
        cx.fillStyle = `rgba(210,190,255,${ba * 1.7})`;
        cx.fillRect(bx,     ys, 1, 7);
      } else {
        cx.fillStyle = `rgba(70,45,140,${ba})`;
        cx.fillRect(bx, ys, 2, 7);
      }
      const br = (s % 4) + 4;
      if (i === br) {
        const dir = s % 2 === 0 ? 1 : -1;
        for (let b = 0; b < 4; b++) {
          cx.fillStyle = `rgba(55,35,110,${ba * 0.55})`;
          cx.fillRect(bx + dir * b * 3, ys + b * 4, 1, 4);
        }
      }
    }
  });
}

function drawRain(t) {
  const fe = performance.now() - thunderFlashT;

  if (fe < 900) {
    // 1. Full-sky bloom
    const fa = fe < 55 ? 0.32 : 0.32 * Math.max(0, 1 - (fe - 55) / 765);
    cx.fillStyle = `rgba(200,180,255,${fa.toFixed(3)})`;
    cx.fillRect(0, 0, W, H);

    // 2. Jagged bolt from cloud base to ground
    const ba = fe < 80 ? 1.0 : Math.max(0, 1 - (fe - 80) / 480);
    if (ba > 0.01) {
      const segH = 10, seed = thunderBoltX;
      for (let ys = 106; ys < H - 8; ys += segH) {
        const seg = Math.floor((ys - 106) / segH);
        const jag = Math.round(Math.sin(seg * 4.7 + seed * 0.031) * 7);
        const bx  = thunderBoltX + jag;
        cx.fillStyle = `rgba(120,80,255,${(ba * 0.20).toFixed(3)})`;
        cx.fillRect(bx - 3, ys, 7, segH + 2);
        cx.fillStyle = `rgba(215,190,255,${(ba * 0.55).toFixed(3)})`;
        cx.fillRect(bx - 1, ys, 3, segH + 2);
        cx.fillStyle = `rgba(255,252,255,${ba.toFixed(3)})`;
        cx.fillRect(bx,     ys, 1, segH + 2);
      }
    }

    // 3. Ground shockwave + sparks — thunder crushing the floor
    const ga = fe < 80 ? 0.80 : 0.80 * Math.max(0, 1 - (fe - 80) / 330);
    if (ga > 0.01) {
      const gY = Math.round(H * 0.81);
      cx.fillStyle = `rgba(255,250,220,${(ga * 0.85).toFixed(3)})`;
      cx.fillRect(0, gY - 3, W, 5);
      cx.fillStyle = `rgba(195,160,255,${(ga * 0.40).toFixed(3)})`;
      cx.fillRect(0, gY - 16, W, 24);
      const dist = Math.min(fe * 0.22, 90);
      for (let p = 0; p < 9; p++) {
        const ang = (p / 9) * Math.PI;
        const px = Math.round(thunderBoltX + Math.cos(ang) * dist);
        const py = Math.round(gY - Math.abs(Math.sin(ang)) * dist * 0.5);
        if (px >= 0 && px <= W) {
          cx.fillStyle = `rgba(255,238,170,${(ga * 0.90).toFixed(3)})`;
          cx.fillRect(px - 1, py - 1, 3, 3);
        }
      }
    }
  }

  const sec = t * 0.001;
  const cloudBase = 106;
  const totalH = H - cloudBase + 20;
  // deterministic per-drop pseudo-random
  const rnd = (n) => ((Math.sin(n * 127.1) * 43758.5) % 1 + 1) % 1;

  // far drops — small, dim
  cx.fillStyle = 'rgba(100,72,175,0.40)';
  for (let i = 0; i < 40; i++) {
    const fallSp = 160 + rnd(i * 7.31) * 80;
    const windSp = 35  + rnd(i * 5.73) * 20;
    const phase  = rnd(i * 11.9)  * totalH;
    const baseX  = rnd(i * 3.17)  * W;
    const ry = Math.round(cloudBase + (sec * fallSp + phase) % totalH);
    const rx = Math.round(((baseX  + sec * windSp) % W + W) % W);
    cx.fillRect(rx, ry, 1, 1);
  }
  // near drops — slightly bigger, brighter
  cx.fillStyle = 'rgba(118,86,198,0.55)';
  for (let i = 40; i < 70; i++) {
    const fallSp = 200 + rnd(i * 7.31) * 90;
    const windSp = 42  + rnd(i * 5.73) * 18;
    const phase  = rnd(i * 11.9)  * totalH;
    const baseX  = rnd(i * 3.17)  * W;
    const ry = Math.round(cloudBase + (sec * fallSp + phase) % totalH);
    const rx = Math.round(((baseX  + sec * windSp) % W + W) % W);
    cx.fillRect(rx, ry, 2, 2);
  }
}

let _loadingSFX1 = false, _loadingSFX2 = false;

function drawLoading(t) {
  if (!loadingStartT) { loadingStartT = t; }
  const elapsed = t - loadingStartT;

  // Obsidian cut SFX: once at YEIYIES (t=0), once at LOADING (t=700ms)
  if (!_loadingSFX1) { _loadingSFX1 = true; playLoadingSFX(); }
  if (!_loadingSFX2 && elapsed > 700) { _loadingSFX2 = true; playLoadingSFX(); }

  // Auto-advance after 6 seconds
  if (elapsed > 6000) { gs = GS.TITLE; startMusic('title'); return; }

  const W = cv.width, H = cv.height;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.004);
  const pulse2 = 0.5 + 0.5 * Math.sin(t * 0.003 + 1.5);

  // Matcha background gradient (pixel-block style)
  const blockSize = 8;
  for (let by = 0; by < H; by += blockSize) {
    const grad = by / H;
    const r = Math.round(237 - grad * 20);
    const g = Math.round(245 - grad * 15);
    const b = Math.round(224 - grad * 30);
    cx.fillStyle = `rgb(${r},${g},${b})`;
    cx.fillRect(0, by, W, blockSize);
  }

  // ── WATERMARK MOTIFS (Enciso, Design Motifs of Ancient Mexico) ──
  const wm = 'rgba(74,120,56,0.22)';
  cx.fillStyle = wm;

  // Rosette / gear wheel — from Motif 3
  const drawRosette = (ox, oy, r) => {
    cx.fillStyle = wm;
    // 8 radiating spokes
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      for (let d = Math.round(r * 0.28); d <= r; d += 2) {
        const px = ox + Math.round(Math.cos(ang) * d);
        const py = oy + Math.round(Math.sin(ang) * d);
        cx.fillRect(px - 1, py - 1, 3, 3);
      }
    }
    // Outer ring
    for (let i = 0; i < 40; i++) {
      const ang = (i / 40) * Math.PI * 2;
      cx.fillRect(ox + Math.round(Math.cos(ang) * r) - 1, oy + Math.round(Math.sin(ang) * r) - 1, 3, 3);
    }
    // Mid ring
    const rm = Math.round(r * 0.55);
    for (let i = 0; i < 24; i++) {
      const ang = (i / 24) * Math.PI * 2;
      cx.fillRect(ox + Math.round(Math.cos(ang) * rm) - 1, oy + Math.round(Math.sin(ang) * rm) - 1, 2, 2);
    }
    // Center square
    cx.fillRect(ox - 3, oy - 3, 7, 7);
  };

  // Step-fret scroll (xicalcoliuhqui) — from Motif 1
  // Drawn as a pixel bitmap at scale s. Unit grid: 9x9
  const drawStepFret = (ox, oy, s) => {
    cx.fillStyle = wm;
    // Outer top & right L
    cx.fillRect(ox,         oy,         9*s, s);   // top
    cx.fillRect(ox+8*s,     oy,         s,   9*s);  // right
    cx.fillRect(ox,         oy+8*s,     9*s, s);   // bottom
    cx.fillRect(ox,         oy,         s,   9*s);  // left
    // Inner step 1
    cx.fillRect(ox+2*s,     oy+2*s,     5*s, s);
    cx.fillRect(ox+2*s,     oy+2*s,     s,   5*s);
    cx.fillRect(ox+2*s,     oy+6*s,     5*s, s);
    cx.fillRect(ox+6*s,     oy+2*s,     s,   5*s);
    // Inner step 2 — center spiral
    cx.fillRect(ox+4*s,     oy+4*s,     2*s, s);
    cx.fillRect(ox+4*s,     oy+4*s,     s,   2*s);
  };

  // MEXICA SERPENT — prehispanic style: pyramid crest, eye ring, fangs, medallion body
  const drawMexicaSerpentH = (ox, oy, s, numWaves, waveLen) => {
    const scDark  = 'rgba(36,56,32,0.36)';
    const scLight = 'rgba(200,224,160,0.22)';
    const bH = 6; // body height in units

    cx.fillStyle = wm;
    // ── HEAD: stepped-pyramid crest ──
    cx.fillRect(ox,       oy-6*s, 2*s, 2*s);   // crest top tier
    cx.fillRect(ox,       oy-4*s, 4*s, 2*s);   // crest mid tier
    cx.fillRect(ox,       oy-2*s, 6*s, 2*s);   // crest base
    cx.fillRect(ox,       oy-2*s, 6*s, bH*s);  // head block
    // Eye ring (square loop — Mexica ollin/sun motif)
    cx.fillStyle = scDark;
    cx.fillRect(ox+s,   oy-s,     4*s, s);     // top bar
    cx.fillRect(ox+s,   oy+2*s,   4*s, s);     // bottom bar
    cx.fillRect(ox+s,   oy-s,     s,   4*s);   // left bar
    cx.fillRect(ox+4*s, oy-s,     s,   4*s);   // right bar
    cx.fillStyle = scLight;
    cx.fillRect(ox+2*s, oy,       2*s, 2*s);   // highlight inside eye
    // Upper jaw — stepped brow + jaw plate
    cx.fillStyle = wm;
    cx.fillRect(ox+5*s, oy-2*s,   2*s, 2*s);  // brow ridge step
    cx.fillRect(ox+5*s, oy,       6*s, 2*s);  // upper jaw
    cx.fillRect(ox+9*s, oy+2*s,   2*s, 2*s);  // upper fang block
    // Lower jaw
    cx.fillRect(ox+5*s, oy+bH*s-2*s, 6*s, 2*s);
    cx.fillRect(ox+9*s, oy+bH*s-4*s, 2*s, 2*s); // lower fang
    // Forked tongue
    cx.fillStyle = scDark;
    cx.fillRect(ox+10*s, oy+2*s,  3*s, s);
    cx.fillRect(ox+12*s, oy+s,    s,   s);    // fork up
    cx.fillRect(ox+12*s, oy+3*s,  s,   s);   // fork down

    let px = ox + 11*s;
    let curY = oy - 2*s; // body top (center position, bH units tall)

    for (let w = 0; w < numWaves; w++) {
      const up = w % 2 === 0;
      const nextY = up ? oy - bH*s - 2*s : oy + 2*s;

      // Angular corner turn — square block (Mexica right-angle aesthetic)
      cx.fillStyle = wm;
      const minY = Math.min(curY, nextY), maxY = Math.max(curY, nextY) + bH*s;
      cx.fillRect(px, minY, bH*s, maxY - minY);
      // Corner stepped ornament (inner notch)
      cx.fillStyle = scDark;
      if (up) cx.fillRect(px+s, minY+s, bH*s-2*s, s);
      else    cx.fillRect(px+s, maxY-2*s, bH*s-2*s, s);
      px += bH*s; curY = nextY;

      // ── BODY RUN ──
      cx.fillStyle = wm;
      cx.fillRect(px, curY, waveLen*s, bH*s);

      // Zigzag spine along top edge (very Mexica — like xiuhcoatl spine)
      cx.fillStyle = scDark;
      for (let z = 0; z*2 < waveLen; z++)
        cx.fillRect(px+z*2*s, curY+(z%2===0?0:s), 2*s, s);

      // Circular/square medallion markers (Mexica eye/sun pattern)
      for (let m = 0; (m*8+5) < waveLen; m++) {
        const mx = px + (2+m*8)*s, my = curY+s;
        cx.fillStyle = scDark;
        cx.fillRect(mx,       my,       5*s, s);   // top
        cx.fillRect(mx,       my+4*s,   5*s, s);   // bottom
        cx.fillRect(mx,       my+s,     s,   3*s); // left
        cx.fillRect(mx+4*s,   my+s,     s,   3*s); // right
        cx.fillStyle = scLight;
        cx.fillRect(mx+s,     my+s,     3*s, 3*s); // inner glow
        cx.fillStyle = scDark;
        cx.fillRect(mx+2*s,   my+2*s,   s,   s);   // center dot
      }

      // Bottom edge line (belly plate — ventral scales)
      cx.fillStyle = scDark;
      cx.fillRect(px, curY+bH*s-s, waveLen*s, s);
      for (let v = 0; v*4 < waveLen; v++)
        cx.fillRect(px+v*4*s, curY+bH*s-s, s, s); // belly plate separators lighter

      cx.fillStyle = wm;
      px += waveLen*s;

      // Corner back to center
      const cY = oy - 2*s;
      cx.fillStyle = wm;
      const mn2 = Math.min(curY, cY), mx2 = Math.max(curY, cY) + bH*s;
      cx.fillRect(px, mn2, bH*s, mx2 - mn2);
      cx.fillStyle = scDark;
      if (up) cx.fillRect(px+s, mx2-2*s, bH*s-2*s, s);
      else    cx.fillRect(px+s, mn2+s,   bH*s-2*s, s);
      px += bH*s; curY = cY;
      if (w < numWaves-1) {
        cx.fillStyle = wm;
        cx.fillRect(px, curY, bH*s, bH*s);
        // Center connector medallion (small)
        cx.fillStyle = scDark;
        cx.fillRect(px+s, curY+s, bH*s-2*s, bH*s-2*s);
        cx.fillStyle = scLight;
        cx.fillRect(px+2*s, curY+2*s, bH*s-4*s, bH*s-4*s);
        px += bH*s;
      }
    }

    // ── TAIL: stepped pyramid (reverse Mexica style) ──
    cx.fillStyle = wm;
    cx.fillRect(px,           curY,       bH*s,   bH*s);
    cx.fillRect(px+bH*s,      curY+s,     4*s,    bH*s-2*s);
    cx.fillRect(px+bH*s+4*s,  curY+2*s,   3*s,    bH*s-4*s);
    cx.fillRect(px+bH*s+7*s,  curY+2*s,   2*s,    bH*s-4*s);
    cx.fillRect(px+bH*s+9*s,  curY+3*s,   s,      bH*s-6*s);
  };

  // HUMMINGBIRD — Huitzilopochtli's bird, Mexica pixel style, facing right
  const drawHummingbird = (ox, oy, s) => {
    cx.fillStyle = wm;
    // Long beak
    cx.fillRect(ox,      oy,     10*s, s);
    // Head
    cx.fillRect(ox+9*s,  oy-2*s, 5*s, 5*s);
    cx.fillRect(ox+11*s, oy-s,   s,   s);   // eye
    // Upper wing — spreads upward
    cx.fillRect(ox+5*s,  oy-7*s, 4*s, 4*s);
    cx.fillRect(ox+8*s,  oy-10*s,15*s, 7*s);
    for (let f = 0; f < 4; f++) cx.fillRect(ox+(9+f*3)*s, oy-9*s, 2*s, 6*s);
    // Lower wing — spreads downward
    cx.fillRect(ox+5*s,  oy+4*s, 4*s, 4*s);
    cx.fillRect(ox+8*s,  oy+4*s, 15*s, 7*s);
    for (let f = 0; f < 4; f++) cx.fillRect(ox+(9+f*3)*s, oy+4*s, 2*s, 6*s);
    // Body
    cx.fillRect(ox+13*s, oy-2*s, 9*s, 5*s);
    cx.fillRect(ox+15*s, oy-s,   2*s, 3*s);
    cx.fillRect(ox+20*s, oy-s,   2*s, 3*s);
    // Tail fan
    cx.fillRect(ox+21*s, oy-6*s, 2*s, 13*s);
    cx.fillRect(ox+23*s, oy-7*s, 2*s, 15*s);
    cx.fillRect(ox+25*s, oy-5*s, 2*s, 11*s);
    cx.fillRect(ox+27*s, oy-3*s, 2*s, 7*s);
  };

  // ── PLACEMENTS ──
  drawRosette(68,  76,  24);
  drawRosette(732, 76,  24);
  drawRosette(68,  404, 24);
  drawRosette(732, 404, 24);

  drawStepFret(158, 48, 3);
  drawStepFret(554, 48, 3);
  drawStepFret(158, 390, 3);
  drawStepFret(554, 390, 3);

  // Long horizontal serpent — top (s=3, 5 waves, waveLen=20)
  drawMexicaSerpentH(44, 68, 3, 5, 20);

  // Long horizontal serpent — bottom (mirrored, facing left)
  cx.save(); cx.translate(W, 0); cx.scale(-1, 1);
  drawMexicaSerpentH(44, 410, 3, 5, 20);
  cx.restore();

  // Hummingbirds — left side facing right, right side mirrored facing left
  drawHummingbird(10, 240, 3);

  cx.save(); cx.translate(W, 0); cx.scale(-1, 1);
  drawHummingbird(10, 240, 3);
  cx.restore();

  // Small hummingbird center-bottom
  drawHummingbird(316, 432, 2);

  // Deep matcha geometric border — double frame
  cx.fillStyle = '#4A7838';
  cx.fillRect(0, 0, W, 4);
  cx.fillRect(0, H-4, W, 4);
  cx.fillRect(0, 0, 4, H);
  cx.fillRect(W-4, 0, 4, H);

  cx.fillStyle = '#7CAE5A';
  cx.fillRect(8, 8, W-16, 3);
  cx.fillRect(8, H-11, W-16, 3);
  cx.fillRect(8, 8, 3, H-16);
  cx.fillRect(W-11, 8, 3, H-16);

  // Corner ornaments — Aztec-style stepped pyramids
  const drawCornerGlyph = (ox, oy, flipX, flipY) => {
    cx.fillStyle = '#4A7838';
    const sx = flipX ? -1 : 1, sy = flipY ? -1 : 1;
    cx.save(); cx.translate(ox, oy); cx.scale(sx, sy);
    cx.fillRect(0, 0, 20, 4);
    cx.fillRect(0, 4, 16, 4);
    cx.fillRect(0, 8, 12, 4);
    cx.fillRect(0, 12, 8, 4);
    cx.fillRect(0, 0, 4, 20);
    cx.restore();
  };
  drawCornerGlyph(14, 14, 1, 1);
  drawCornerGlyph(W-14, 14, -1, 1);
  drawCornerGlyph(14, H-14, 1, -1);
  drawCornerGlyph(W-14, H-14, -1, -1);

  // Large Tonatiuh ring surrounding YEIYIES name
  const cx2 = cx, cxCtr = W/2, cyCtr = H/2;
  const txtCx = cxCtr, txtCy = cyCtr - 20; // shifted down to clear top serpent border
  const rx = 230, ry = 90; // ellipse: wide to hug the text

  // Faint glow halo behind text
  cx2.fillStyle = 'rgba(160,210,80,0.07)';
  for (let i = 0; i < 72; i++) {
    const a = (i/72)*Math.PI*2;
    cx2.fillRect(txtCx + Math.round(Math.cos(a)*(rx-10))-3, txtCy + Math.round(Math.sin(a)*(ry-10))-3, 6, 6);
  }

  // Radial rays — 8 dotted spokes rotating slowly
  cx2.fillStyle = 'rgba(74,120,56,0.28)';
  for (let i = 0; i < 8; i++) {
    const ang = (i/8)*Math.PI*2 + t*0.00015;
    for (let r = 3; r < 9; r++) {
      const frac = r / 10;
      const bx = txtCx + Math.round(Math.cos(ang)*rx*frac);
      const by = txtCy + Math.round(Math.sin(ang)*ry*frac);
      cx2.fillRect(bx-2, by-2, 4, 4);
    }
  }

  // Inner orbit — 16 medium dots, slow clockwise
  cx2.fillStyle = '#C0D890';
  for (let i = 0; i < 16; i++) {
    const ang = (i/16)*Math.PI*2 + t*0.0006;
    const bx = txtCx + Math.round(Math.cos(ang)*rx);
    const by = txtCy + Math.round(Math.sin(ang)*ry);
    cx2.fillRect(bx-5, by-5, 10, 10);
  }

  // Outer orbit — 32 small dots, counter-clockwise
  cx2.fillStyle = '#7CAE5A';
  for (let i = 0; i < 32; i++) {
    const ang = (i/32)*Math.PI*2 - t*0.0004;
    const bx = txtCx + Math.round(Math.cos(ang)*(rx+18));
    const by = txtCy + Math.round(Math.sin(ang)*(ry+12));
    cx2.fillRect(bx-3, by-3, 6, 6);
  }

  // 4 accent squares at cardinal points (top/bottom/left/right of ellipse)
  cx2.fillStyle = '#4A7838';
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([cx3,cy3]) => {
    cx2.fillRect(txtCx+cx3*(rx+28)-7, txtCy+cy3*(ry+20)-7, 14, 14);
    cx2.fillStyle = '#C0D890';
    cx2.fillRect(txtCx+cx3*(rx+28)-4, txtCy+cy3*(ry+20)-4, 8, 8);
    cx2.fillStyle = '#4A7838';
  });

  // YEIYIES — Helvetica Neue bold oblique, layered outline
  cx.save();
  cx.translate(W/2, cyCtr - 20);
  cx.transform(1, 0, -0.28, 1, 0, 0); // strong oblique shear
  cx.translate(-W/2, -(cyCtr - 20));
  cx.font = '900 82px "Helvetica Neue","Helvetica",Arial,sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  // Drop shadow
  cx.fillStyle = 'rgba(6,20,4,0.95)';
  cx.fillText('YEIYIES', W/2 + 8, cyCtr - 12);
  // Outer dark outline
  cx.fillStyle = '#0E2008';
  for (const [dx,dy] of [[-6,0],[6,0],[0,-6],[0,6],[-5,-4],[5,-4],[-5,4],[5,4],[-4,-6],[4,-6]]) {
    cx.fillText('YEIYIES', W/2+dx, cyCtr-20+dy);
  }
  // Inner accent rim
  cx.fillStyle = '#3A6228';
  for (const [dx,dy] of [[-3,0],[3,0],[0,-3],[0,3],[-2,-2],[2,-2],[-2,2],[2,2]]) {
    cx.fillText('YEIYIES', W/2+dx, cyCtr-20+dy);
  }
  // Main fill
  cx.fillStyle = '#D4F040';
  cx.fillText('YEIYIES', W/2, cyCtr - 20);
  // Subtle top glint
  cx.fillStyle = 'rgba(236,255,160,0.45)';
  cx.fillText('YEIYIES', W/2, cyCtr - 23);
  cx.restore();
  cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
  // PRESENTS — Helvetica Neue, same shear
  cx.save();
  cx.translate(W/2, cyCtr + 32);
  cx.transform(1, 0, -0.28, 1, 0, 0);
  cx.translate(-W/2, -(cyCtr + 32));
  cx.font = '700 22px "Helvetica Neue","Helvetica",Arial,sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillStyle = '#0E2008';
  for (const [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2]]) cx.fillText('PRESENTS', W/2+dx, cyCtr+32+dy);
  cx.fillStyle = '#A8CC78';
  cx.fillText('PRESENTS', W/2, cyCtr + 32);
  cx.restore();
  cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';

  // Animated LOADING dots — cycles through LOADING. / LOADING.. / LOADING...
  const dotCount = Math.floor(t / 400) % 4;
  const loadingStr = 'LOADING' + '.'.repeat(dotCount);
  const alpha = Math.round(160 + pulse * 95);
  bigText(loadingStr, W/2, H - 60, 16, `rgba(36,56,32,${alpha/255})`, `rgba(192,216,144,${alpha/255})`);
  // Smaller "PRESS ANY KEY" below
  bigText('PRESS ANY KEY TO SKIP', W/2, H - 40, 10, '#7CAE5A', '#C0D890');

  // Small progress dots at bottom
  const dotY = H - 30;
  const totalDots = 5;
  const activeDot = Math.floor((elapsed / 5000) * totalDots);
  for (let d = 0; d < totalDots; d++) {
    cx2.fillStyle = d <= activeDot ? '#4A7838' : '#C0D890';
    cx2.fillRect(W/2 - (totalDots * 10)/2 + d * 10, dotY, 6, 6);
  }

  // Decorative Aztec band across top (step-fret pattern)
  cx2.fillStyle = '#7CAE5A';
  for (let i = 0; i < 20; i++) {
    const bx = i * 40;
    cx2.fillRect(bx, 20, 20, 8);
    cx2.fillRect(bx + 20, 24, 20, 4);
  }
  cx2.fillStyle = '#4A7838';
  for (let i = 0; i < 20; i++) {
    const bx = i * 40;
    cx2.fillRect(bx + 4, 22, 12, 4);
  }

  // Same band at bottom
  cx2.fillStyle = '#7CAE5A';
  for (let i = 0; i < 20; i++) {
    const bx = i * 40;
    cx2.fillRect(bx, H-28, 20, 8);
    cx2.fillRect(bx + 20, H-24, 20, 4);
  }
  cx2.fillStyle = '#4A7838';
  for (let i = 0; i < 20; i++) {
    const bx = i * 40;
    cx2.fillRect(bx + 4, H-26, 12, 4);
  }

  // Floating pixel orbs in two corners (pulse2 offset)
  const orbAlpha = Math.round(60 + pulse2 * 80);
  cx2.fillStyle = `rgba(74,120,56,${orbAlpha/255})`;
  cx2.fillRect(Math.round(60 + pulse * 6), Math.round(110 + pulse2 * 8), 10, 10);
  cx2.fillRect(Math.round(W-70 - pulse * 6), Math.round(110 + pulse2 * 8), 10, 10);
  cx2.fillRect(Math.round(60 + pulse * 4), Math.round(H-140 - pulse2 * 6), 8, 8);
  cx2.fillRect(Math.round(W-68 - pulse * 4), Math.round(H-140 - pulse2 * 6), 8, 8);
}

function drawGodCard(gi, t, px, py, pw, ph, playerLabel) {
  const g=GODS[gi];
  const locked=!getVsUnlocked().has(gi);

  // Dynamic scale — sprite fills ~70% height and up to 85% width
  const spAreaTop=py+22;
  const spAreaH=Math.round(ph*0.70);
  const sprScale=Math.max(2,Math.min(Math.floor(pw*0.85/26),Math.floor(spAreaH*0.95/40)));
  const sprW=26*sprScale, sprH=40*sprScale;

  // Panel background
  cx.fillStyle='rgba(5,3,2,0.93)';cx.fillRect(px,py,pw,ph);

  // Top accent bar
  cx.fillStyle=locked?'#1a0800':g.body+'cc';cx.fillRect(px,py,pw,22);

  if(playerLabel){
    const tc=playerLabel==='P1'?'#ff7755':'#55aaff';
    cx.fillStyle=tc;cx.font='bold 8px monospace';cx.textAlign='left';
    cx.fillText(playerLabel,px+6,py+15);

  cx.fillStyle=locked?'#886644':'#ffffff';cx.font='bold 9px monospace';cx.textAlign='center';

  cx.strokeStyle=locked?'#3a1800':ac;cx.lineWidth=2;cx.strokeRect(px,py,pw,ph);cx.lineWidth=1;

  if(!locked){

    const sprTY=spAreaTop+Math.round((spAreaH-sprH)/2);

    cx.translate(sprTX,sprTY);
    cx.scale(sprScale,sprScale);
    const mock={x:0,y:0,w:26,h:40,vx:0,vy:0,facing:1,godIdx:gi,
      atkTimer:0,hitstun:0,hitstunMax:0,djTimer:0,stepT:Math.floor(t/8),

    // Title + special name

    cx.fillText(gstr(g,'title'),px+pw/2,cy);cy+=12;

    if(g.triJump){cx.fillStyle='#00d4e8';cx.font='6px monospace';cx.fillText(TX('tripleJump'),px+pw/2,cy);cy+=9;}

    // Stat dot glyphs — 2×2 grid, 5 dots per stat
    const sLabels=['SPD','PWR','JMP','WGT'];

    const dotSz=4,dotGap=1,colW=Math.round((pw-16)/2);
    [[0,1],[2,3]].forEach(([a,b],ri)=>{
      [a,b].forEach((si,ci)=>{
        const rx=px+8+ci*colW, ry=cy+ri*13;

          cx.fillRect(rx+16+d*(dotSz+dotGap),ry,dotSz,dotSz);

    });

  } else {
    cx.fillStyle='#554433';cx.font='7px monospace';cx.textAlign='center';
    cx.fillText('???',px+pw/2,py+Math.round(ph*0.35));
    cx.fillStyle='#332211';cx.fillText(TX('lockedDesc'),px+pw/2,py+Math.round(ph*0.35)+15);

function drawPlatformRain(t) {
  const sec = t * 0.001;
  const { x:px, y:py, w:pw } = PLAT;
  const rnd = n => ((Math.sin(n * 127.1) * 43758.5) % 1 + 1) % 1;

  // puddles — flat shimmering ovals sitting on the surface
  for (let i = 0; i < 7; i++) {
    const bx = px + 24 + rnd(i * 3.17) * (pw - 48);
    const rw = 18 + rnd(i * 7.3) * 22;
    const rh = 3  + rnd(i * 5.9) * 3;
    const a  = 0.22 + Math.sin(sec * 2.1 + i * 1.9) * 0.07;
    cx.fillStyle = `rgba(38,55,88,${a})`;
    cx.beginPath(); cx.ellipse(bx, py + 2, rw, rh, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = `rgba(130,175,235,${a * 0.5})`;
    cx.beginPath(); cx.ellipse(bx - rw * 0.2, py + 1.5, rw * 0.4, rh * 0.65, 0, 0, Math.PI * 2); cx.fill();
  }

  // splash rings — expanding flat ellipses that fade like water impact
  for (let i = 0; i < 14; i++) {
    const bx    = px + 18 + rnd(i * 11.7) * (pw - 36);
    const cycle = 0.4 + rnd(i * 4.31) * 0.5;
    const phase = rnd(i * 8.91);
    const life  = ((sec / cycle + phase) % 1);
    if (life > 0.68) continue;
    const prog = life / 0.68;
    const r    = prog * 13;
    const a    = (1 - prog) * 0.65;
    cx.strokeStyle = `rgba(120,170,230,${a})`;
    cx.lineWidth = 1.4;
    cx.beginPath(); cx.ellipse(bx, py + 1, r * 1.6, r * 0.45, 0, 0, Math.PI * 2); cx.stroke();
    // second inner ring
    if (prog > 0.25) {
      const r2 = (prog - 0.25) / 0.75 * r * 0.6;
      cx.lineWidth = 0.9;
      cx.beginPath(); cx.ellipse(bx, py + 1, r2 * 1.6, r2 * 0.45, 0, 0, Math.PI * 2); cx.stroke();
    }
    // upward crown drops at impact moment
    if (prog < 0.25) {
      const f = 1 - prog / 0.25;
      cx.fillStyle = `rgba(180,220,255,${f * 0.85})`;
      const cr = 4 * f;
      for (let d = 0; d < 5; d++) {
        const angle = (d / 5) * Math.PI * 2;
        const dx = Math.cos(angle) * cr * 1.2;
        const dy = -Math.abs(Math.sin(angle)) * cr * 1.5 - 1;
        cx.fillRect(Math.round(bx + dx) - 1, Math.round(py + dy), 2, 2);
      }
    }
  }
  cx.lineWidth = 1;
}

function drawTreasureOrb(t) {
  if(!treasureOrb) return;
  const {x,y,life}=treasureOrb;
  const fadeA=Math.min(1,life/60);
  const burstHue=46; // warm gold-white burst
  const pulse=0.94+Math.sin(t*0.006)*0.08;
  const R=15*pulse;

  // ── Spiky starburst aura — Smash-Ball style: alternating long/short sharp rays ──
  cx.save();
  cx.translate(x,y);
  const rayBase=t*0.0012;
  for(let i=0;i<16;i++){
    const ra=rayBase+i*(Math.PI/8);
    const long=i%2===0;
    const len=(long?3.0:1.85)*R;
    const rg=cx.createLinearGradient(0,0,Math.cos(ra)*len,Math.sin(ra)*len);
    rg.addColorStop(0,`hsla(${burstHue},100%,92%,${(0.85*fadeA).toFixed(2)})`);
    rg.addColorStop(1,'rgba(255,255,255,0)');
    cx.strokeStyle=rg; cx.lineWidth=long?2.4:1.4; cx.lineCap='round';
    cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.cos(ra)*len,Math.sin(ra)*len);cx.stroke();
  }
  cx.restore();

  // Soft white bloom so the rays read as erupting from the medallion
  const bloomG=cx.createRadialGradient(x,y,0,x,y,R*2.8);
  bloomG.addColorStop(0,`hsla(${burstHue},100%,93%,${(0.55*fadeA).toFixed(2)})`);
  bloomG.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=bloomG; cx.beginPath();cx.arc(x,y,R*2.8,0,Math.PI*2);cx.fill();

  // ── 4 orbiting glowing spheres (green/orange/red/blue) — real sphere shading + fading orbit trail ──
  const orbCols=[[110,220,140],[230,150,50],[220,60,60],[70,150,220]];
  const orbitRx=R*2.1, orbitRy=R*1.15;
  for(let i=0;i<4;i++){
    const spin=t*0.0022*(i%2===0?1:-1.15)+i*(Math.PI/2);
    const ox=x+Math.cos(spin)*orbitRx, oy=y+Math.sin(spin)*orbitRy;
    const [cr,cg,cb]=orbCols[i];
    cx.strokeStyle=`rgba(${cr},${cg},${cb},${(0.4*fadeA).toFixed(2)})`;
    cx.lineWidth=1.4; cx.lineCap='round';
    cx.beginPath();cx.ellipse(x,y,orbitRx,orbitRy,0,spin-0.9,spin);cx.stroke();
    const sr=R*0.2;
    const sg=cx.createRadialGradient(ox-sr*0.4,oy-sr*0.4,0,ox,oy,sr);
    sg.addColorStop(0,`rgba(255,255,255,${(0.9*fadeA).toFixed(2)})`);
    sg.addColorStop(0.4,`rgba(${cr},${cg},${cb},${fadeA.toFixed(2)})`);
    sg.addColorStop(1,`rgba(${Math.round(cr*0.4)},${Math.round(cg*0.4)},${Math.round(cb*0.4)},${fadeA.toFixed(2)})`);
    cx.fillStyle=sg; cx.beginPath();cx.arc(ox,oy,sr,0,Math.PI*2);cx.fill();
  }

  // ── Circular medallion disc — round "coin" base, lit from the upper-left for a 3D bevel read ──
  cx.save();
  cx.translate(x,y);
  cx.lineJoin='round'; cx.lineCap='round';
  const discR=R*1.15;
  const discG=cx.createRadialGradient(-discR*0.35,-discR*0.35,discR*0.1,0,0,discR*1.05);
  discG.addColorStop(0,`rgba(195,155,95,${fadeA.toFixed(2)})`);
  discG.addColorStop(0.55,`rgba(155,115,65,${fadeA.toFixed(2)})`);
  discG.addColorStop(1,`rgba(110,72,38,${fadeA.toFixed(2)})`);
  cx.fillStyle=discG; cx.beginPath();cx.arc(0,0,discR,0,Math.PI*2);cx.fill();
  cx.strokeStyle=`rgba(255,225,150,${(0.7*fadeA).toFixed(2)})`;
  cx.lineWidth=0.06*R; cx.beginPath();cx.arc(0,0,discR,0,Math.PI*2);cx.stroke();

  // ── Nahui Ollin relief, scaled into this disc's local space, volumetric-shaded fills ──
  cx.scale(R,R);
  const lw=0.055;
  // Every "dark" line in this glyph is a deeply-shaded version of ITS OWN region's color — never a
  // flat neutral tone. That's what keeps the reference from ever reading as having any black in it.
  function tintedDark(rgb){
    const [r,g,b]=rgb;
    return `rgba(${Math.round(r*0.55+15)},${Math.round(g*0.55+15)},${Math.round(b*0.55+15)},${fadeA.toFixed(2)})`;
  }
  const GENERIC_DARK=tintedDark([196,142,64]); // warm amber-brown, for elements that span multiple hues (pendant frame, eye ring/bar)
  function shadedShape(path,rgb,cxc,cyc,rad){
    const [r,g,b]=rgb;
    const grad=cx.createRadialGradient(cxc-rad*0.4,cyc-rad*0.4,rad*0.05,cxc,cyc,rad*1.3);
    grad.addColorStop(0,`rgba(${Math.min(255,r+75)},${Math.min(255,g+75)},${Math.min(255,b+75)},${fadeA.toFixed(2)})`);
    grad.addColorStop(0.5,`rgba(${r},${g},${b},${fadeA.toFixed(2)})`);
    grad.addColorStop(1,`rgba(${Math.round(r*0.62+15)},${Math.round(g*0.62+15)},${Math.round(b*0.62+15)},${fadeA.toFixed(2)})`);
    cx.fillStyle=grad; cx.fill(path);
    cx.strokeStyle=tintedDark(rgb); cx.lineWidth=lw; cx.stroke(path);
  }

  // Left lobe (blue) — scalloped two-bump flame silhouette + its red accent dot
  const pL=new Path2D();
  pL.moveTo(-0.15,-0.38);
  pL.quadraticCurveTo(-0.55,-0.62,-0.78,-0.42);
  pL.quadraticCurveTo(-0.62,-0.30,-0.95,-0.18);
  pL.quadraticCurveTo(-1.30,-0.05,-1.15,0.18);
  pL.quadraticCurveTo(-0.95,0.10,-0.85,0.30);
  pL.quadraticCurveTo(-0.60,0.20,-0.15,0.36);
  pL.closePath();
  shadedShape(pL,[78,118,128],-0.75,-0.05,0.5);
  cx.beginPath();cx.arc(-0.66,0.02,0.10,0,Math.PI*2);
  cx.fillStyle=`rgba(150,52,38,${fadeA.toFixed(2)})`;cx.fill();
  cx.strokeStyle=tintedDark([150,52,38]);cx.lineWidth=lw*0.8;cx.stroke();

  // Right lobe (orange) — mirror of left, its own red accent dot
  const pR=new Path2D();
  pR.moveTo(0.15,-0.38);
  pR.quadraticCurveTo(0.55,-0.62,0.78,-0.42);
  pR.quadraticCurveTo(0.62,-0.30,0.95,-0.18);
  pR.quadraticCurveTo(1.30,-0.05,1.15,0.18);
  pR.quadraticCurveTo(0.95,0.10,0.85,0.30);
  pR.quadraticCurveTo(0.60,0.20,0.15,0.36);
  pR.closePath();
  shadedShape(pR,[196,142,64],0.75,-0.05,0.5);
  cx.beginPath();cx.arc(0.66,0.02,0.10,0,Math.PI*2);
  cx.fillStyle=`rgba(150,52,38,${fadeA.toFixed(2)})`;cx.fill();
  cx.strokeStyle=tintedDark([150,52,38]);cx.lineWidth=lw*0.8;cx.stroke();

  // Top spike (red) with a pale filled inner highlight triangle
  const pT=new Path2D();
  pT.moveTo(0,-1.25);
  pT.quadraticCurveTo(0.24,-0.6,0.38,-0.22);
  pT.quadraticCurveTo(0.15,-0.32,0,-0.15);
  pT.quadraticCurveTo(-0.15,-0.32,-0.38,-0.22);
  pT.quadraticCurveTo(-0.24,-0.6,0,-1.25);
  pT.closePath();
  shadedShape(pT,[176,80,52],0,-0.65,0.55);
  const pTi=new Path2D();
  pTi.moveTo(0,-1.05); pTi.lineTo(0.13,-0.33); pTi.lineTo(-0.13,-0.33); pTi.closePath();
  cx.fillStyle=`rgba(130,165,160,${(fadeA*0.85).toFixed(2)})`;cx.fill(pTi);
  cx.strokeStyle=tintedDark([130,165,160]);cx.lineWidth=lw*0.6;cx.stroke(pTi);

  // Bottom pendant — green/white stripes with black dividers, neck, and a small bead
  cx.save();
  cx.beginPath();cx.rect(-0.16,0.32,0.32,0.5);cx.clip();
  for(let s=0;s<3;s++){
    cx.fillStyle=s%2===0?`rgba(108,128,66,${fadeA.toFixed(2)})`:`rgba(225,212,180,${fadeA.toFixed(2)})`;
    cx.fillRect(-0.16,0.32+s*0.17,0.32,0.17);
  }
  cx.restore();
  cx.strokeStyle=GENERIC_DARK;cx.lineWidth=lw;cx.strokeRect(-0.16,0.32,0.32,0.5);
  for(let s=1;s<3;s++){
    cx.beginPath();cx.moveTo(-0.16,0.32+s*0.17);cx.lineTo(0.16,0.32+s*0.17);
    cx.strokeStyle=GENERIC_DARK;cx.lineWidth=lw*0.6;cx.stroke();
  }
  cx.beginPath();cx.moveTo(0,0.82);cx.lineTo(0,0.88);
  cx.strokeStyle=GENERIC_DARK;cx.lineWidth=lw*1.4;cx.stroke();
  cx.beginPath();cx.arc(0,0.96,0.1,0,Math.PI*2);
  cx.fillStyle=`rgba(225,212,180,${fadeA.toFixed(2)})`;cx.fill();
  cx.strokeStyle=GENERIC_DARK;cx.lineWidth=lw;cx.stroke();

  // Center eye medallion — golden ring with real glow, simplified glowing horizontal-bar eye
  const eyeR=0.44;
  const ringG=cx.createRadialGradient(-eyeR*0.35,-eyeR*0.35,eyeR*0.05,0,0,eyeR*1.15);
  ringG.addColorStop(0,`rgba(230,205,150,${fadeA.toFixed(2)})`);
  ringG.addColorStop(0.6,`rgba(196,142,64,${fadeA.toFixed(2)})`);
  ringG.addColorStop(1,`rgba(120,85,40,${fadeA.toFixed(2)})`);
  const EYE_DARK=`rgba(10,6,5,${fadeA.toFixed(2)})`; // true near-black — matches the codex crop exactly, this is the one place it belongs
  cx.beginPath();cx.arc(0,0,eyeR,0,Math.PI*2);
  cx.fillStyle=ringG;cx.fill();
  cx.strokeStyle=EYE_DARK;cx.lineWidth=lw*1.2;cx.stroke();
  const innerR=eyeR*0.66;

  // Base fill — same warm ochre as the ring, black is outline-only, never a fill.
  cx.beginPath();cx.arc(0,0,innerR,0,Math.PI*2);
  cx.fillStyle=`rgba(196,142,64,${fadeA.toFixed(2)})`;cx.fill();

  // Dark maroon eyelid wedge — covers roughly the top 40% of the disc, matching the reference photo
  cx.save();
  cx.beginPath();cx.arc(0,0,innerR,0,Math.PI*2);cx.clip();
  const pLid=new Path2D();
  pLid.moveTo(-innerR,-innerR);
  pLid.lineTo(innerR,-innerR);
  pLid.lineTo(innerR,-innerR*0.30);
  pLid.quadraticCurveTo(0,-innerR*0.16,-innerR,-innerR*0.30);
  pLid.closePath();
  cx.fillStyle=`rgba(150,58,42,${fadeA.toFixed(2)})`;cx.fill(pLid);
  cx.restore();
  cx.beginPath();
  cx.moveTo(-innerR*0.97,-innerR*0.30);
  cx.quadraticCurveTo(0,-innerR*0.16,innerR*0.97,-innerR*0.30);
  cx.strokeStyle=EYE_DARK;cx.lineWidth=lw*0.95;cx.stroke();

  // White crescent — a genuine thick, uniformly-rounded "smile" band (stroked arc with round
  // caps), not a filled lens tapering to thin points. That taper was exactly what read as an
  // uneven "(" instead of a clean, closed, centered "C" — this shape structurally can't do that.
  const smileCy=-innerR*0.50, smileR=innerR*0.82;
  const smileA0=Math.PI*0.16, smileA1=Math.PI*0.84;
  const smileW=innerR*0.36;
  cx.save();
  cx.beginPath();cx.arc(0,0,innerR,0,Math.PI*2);cx.clip();
  cx.beginPath();cx.arc(0,smileCy,smileR,smileA0,smileA1);
  cx.strokeStyle=EYE_DARK;cx.lineWidth=smileW+lw*1.3;cx.lineCap='round';cx.stroke();
  cx.strokeStyle=`rgba(232,222,198,${fadeA.toFixed(2)})`;cx.lineWidth=smileW;cx.lineCap='round';cx.stroke();
  cx.restore();

  // Outer disc rim outline, bold
  cx.beginPath();cx.arc(0,0,innerR,0,Math.PI*2);
  cx.strokeStyle=EYE_DARK;cx.lineWidth=lw*1.1;cx.stroke();

  cx.restore();
}

function drawFight(t) {
  // ── World space — camera transform applied ─────────────────
  cx.save();
  cx.translate(shakeX, shakeY);
  cx.translate(W / 2, H / 2);
  cx.scale(camZoom, camZoom);
  cx.translate(-camX, -camY);

  drawBattleBG(t);drawPlatform();
  if(RAINY_SCENARIOS.has(currentScenario)){drawThunderclouds(t);drawRain(t);drawPlatformRain(t);}
  drawTreasureOrb(t);
  drawSpecials(t,0);
  drawSprite(F[1],t);drawSprite(F[0],t);
  drawSpecials(t,1);

  if(F.length>=2&&F[0].maxHp>0&&F[1].maxHp>0){
    const _sd=Math.min(0.35,(2-(F[0].hp/F[0].maxHp)-(F[1].hp/F[1].maxHp))*0.175);
    if(_sd>0.02){cx.fillStyle=`rgba(0,0,0,${_sd.toFixed(2)})`;cx.fillRect(0,0,W,H);}
  }
  cx.restore(); // ── Screen space — HUD / post-fx from here ──
  if(koFlash>0){
    const _kfa=koFlash/14;
    cx.fillStyle=`rgba(255,255,255,${(_kfa*0.88).toFixed(2)})`;
    cx.fillRect(0,0,W,H); koFlash--;
  }
  if(rageBurst>0){
    cx.fillStyle=`rgba(200,10,10,${(rageBurst/5*0.45).toFixed(2)})`;
    cx.fillRect(0,0,W,H); rageBurst--;
  }
  drawDigitalFX(t);
  drawHPBars();
  cx.fillStyle='rgba(0,0,0,0.55)';cx.fillRect(W/2-76,6,152,22);
  cx.fillStyle='#888877';cx.font='8px monospace';cx.textAlign='center';
  cx.fillText(TX('round')+' '+roundNum+'  '+(storyMode?TX('storyTag')+(storyLevel+1):mode1P?TX('vsTag'):TX('twoTag')),W/2,19);
  if(storyMode){
    const lbx=W/2-54,lby=28,lbw=108;
    cx.fillStyle='rgba(0,0,0,0.68)';cx.fillRect(lbx,lby,lbw,18);
    cx.fillStyle='#7755aa';cx.font='bold 7px monospace';cx.textAlign='left';cx.textBaseline='middle';
    cx.fillText(TX('lives'),lbx+4,lby+9);
    for(let l=0;l<STORY_MAX_LIVES;l++){
      const lx=lbx+42+l*20,ly=lby+4;
      cx.fillStyle=l<storyLives?'#cc88ff':'#1e0e30';
      cx.beginPath();cx.arc(lx+5,ly+5,5,0,Math.PI*2);cx.fill();
      if(l<storyLives){
        cx.fillStyle='rgba(240,200,255,0.55)';
        cx.beginPath();cx.arc(lx+4,ly+4,2.5,0,Math.PI*2);cx.fill();
      }
    }
    cx.textBaseline='alphabetic';
  }
  for(let d=0;d<2;d++){
    cx.fillStyle=d<p1RoundWins?'#ff4422':'rgba(255,68,34,0.2)';
    cx.beginPath();cx.arc(W/2-56+d*11,13,4,0,Math.PI*2);cx.fill();
    cx.fillStyle=d<p2RoundWins?'#44aaff':'rgba(68,170,255,0.2)';
    cx.beginPath();cx.arc(W/2+45+d*11,13,4,0,Math.PI*2);cx.fill();
  }
  cx.textAlign='left';
  drawHelpButton();
  drawLangButton();
  drawPauseButton();
  if(paused) drawPauseOverlay();
}

// ── Battle post-process ───────────────────────────────────────
function drawDigitalFX(t) {
  // Vignette — subtle edge darkening, keeps focus on fighters
  const vg=cx.createRadialGradient(W/2,H/2,H*0.26,W/2,H/2,H*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(10,0,22,0.36)');
  cx.fillStyle=vg; cx.fillRect(0,0,W,H);

  // Hitstun flash — brief colour burst when a hit lands
  if(F.length>0){
    const maxHit=Math.max(F[0]?.hitstun||0,F[1]?.hitstun||0);
    if(maxHit>0){
      const intensity=maxHit/28;
      const lines=Math.floor(intensity*4)+1;
      for(let i=0;i<lines;i++){
        if(Math.random()>0.4) continue;
        const gy=Math.floor(Math.random()*H);
        const gw=8+Math.floor(Math.random()*50);
        cx.fillStyle=Math.random()<0.5
          ? `rgba(255,0,200,${(intensity*0.18).toFixed(2)})`
          : `rgba(0,220,255,${(intensity*0.18).toFixed(2)})`;
        cx.fillRect(Math.floor(Math.random()*(W-gw)),gy,gw,1);
      }
    }
  }
  // Reset any leaked canvas state
  cx.globalAlpha=1; cx.lineWidth=1;
  cx.textAlign='left'; cx.textBaseline='alphabetic';
}

function drawJungleBG(t) {
  const g=cx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0,'#010a04'); g.addColorStop(0.6,'#062010'); g.addColorStop(1,'#0a2c14');
  cx.fillStyle=g; cx.fillRect(0,0,W,Math.round(H*0.72));
  cx.fillStyle='#c8d8b0'; cx.fillRect(688,16,18,18);
  cx.fillStyle='#010a04'; cx.fillRect(694,12,16,16);
  for(const s of STARS){
    const b=0.12+Math.sin(t*0.0007+s.ph)*0.08;
    cx.fillStyle=`rgba(200,255,200,${b.toFixed(2)})`; cx.fillRect(s.x,s.y%140,1,1);
  }
  cx.fillStyle='#020c05';
  for(let i=0;i<14;i++){
    const tx=(i*57+10)%W,th=70+((i*73)%55),tw=32+((i*37)%24);
    cx.fillRect(tx,Math.round(H*0.72)-th,tw,th);
    cx.beginPath(); cx.moveTo(tx+tw/2,Math.round(H*0.72)-th-28);
    cx.lineTo(tx-6,Math.round(H*0.72)-th+8); cx.lineTo(tx+tw+6,Math.round(H*0.72)-th+8);
    cx.closePath(); cx.fill();
  }
  const ly=Math.round(H*0.685);
  const lg=cx.createLinearGradient(0,ly,0,H);
  lg.addColorStop(0,'#041408'); lg.addColorStop(1,'#020a04');
  cx.fillStyle=lg; cx.fillRect(0,ly,W,H-ly);
  cx.fillStyle='rgba(20,80,30,0.28)';
  for(let v=0;v<7;v++) cx.fillRect(70+v*110+Math.round(Math.sin(t*0.0005+v)*6),0,2,ly);
}

function drawObsidianBG(t) {
  const g=cx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0,'#000008'); g.addColorStop(0.5,'#080020'); g.addColorStop(1,'#100030');
  cx.fillStyle=g; cx.fillRect(0,0,W,Math.round(H*0.72));
  for(const s of STARS){
    const b=0.6+Math.sin(t*0.0014+s.ph)*0.3;
    const c=s.ph%1>0.5?`rgba(180,160,255,${b.toFixed(2)})`:`rgba(255,220,255,${b.toFixed(2)})`;
    cx.fillStyle=c; cx.fillRect(s.x,s.y,s.s,s.s);
  }
  cx.fillStyle='#060016';
  [[100,120,30],[230,90,22],[380,140,40],[530,100,28],[670,110,32],[760,80,18]].forEach(([sx,sh,sw])=>{
    cx.beginPath(); cx.moveTo(sx,Math.round(H*0.72)-sh);
    cx.lineTo(sx-sw,Math.round(H*0.72)); cx.lineTo(sx+sw,Math.round(H*0.72));
    cx.closePath(); cx.fill();
    cx.fillStyle='rgba(120,80,200,0.22)'; cx.fillRect(sx-2,Math.round(H*0.72)-sh,2,sh);
    cx.fillStyle='#060016';
  });
  const ly=Math.round(H*0.685);
  cx.fillStyle='#050015'; cx.fillRect(0,ly,W,H-ly);
  const fa=0.07+Math.sin(t*0.0006)*0.04;
  cx.fillStyle=`rgba(100,60,200,${fa.toFixed(2)})`; cx.fillRect(0,ly,W,H-ly);
}

function drawUnderworldBG(t) {
  const g=cx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0,'#0a0000'); g.addColorStop(0.4,'#280800'); g.addColorStop(1,'#3c1000');
  cx.fillStyle=g; cx.fillRect(0,0,W,Math.round(H*0.72));

    const b=0.3+Math.sin(t*0.0018+s.ph)*0.35;

  }

    cx.fillRect(rx-rw/2,Math.round(H*0.72)-rh,rw,rh);

function drawDreamBG(t) {
  const phase=t*0.0003;
  const rv=Math.round(12+Math.sin(phase)*6), gv=Math.round(4+Math.cos(phase*0.7)*3);
  const g=cx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0,`rgb(${rv},${gv},${gv+18})`);
  g.addColorStop(0.5,`rgb(${rv+8},${gv*3},${gv*3+28})`);
  g.addColorStop(1,`rgb(${rv+18},${gv*5},${gv*5+48})`);
  cx.fillStyle=g; cx.fillRect(0,0,W,Math.round(H*0.72));
  for(const s of STARS){
    const b=0.5+Math.sin(t*0.002+s.ph*3)*0.38;
    const hue=Math.floor((s.ph*360+t*0.05)%360);
    cx.fillStyle=`hsla(${hue},100%,70%,${b.toFixed(2)})`; cx.fillRect(s.x,s.y,s.s+1,s.s+1);
  }
  const ly=Math.round(H*0.72);
