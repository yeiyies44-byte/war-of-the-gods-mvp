// ── Cinematic lore intro (History entry) ─────────────────────
const CINE_SCENES = [
  { t:0,    dur:2200, text:'THE  FIFTH  SUN  ENDED.' },
  { t:2200, dur:2300, text:'THE  GODS  BECAME  CODE.' },
  { t:4500, dur:2700, text:'TEZCATLIPOCA  SHATTERED  THE  MIRROR  OF  CREATION.' },
  { t:7200, dur:2400, text:'SEVENTEEN  DIVINE  FORCES  ROSE  TO  WAR.' },
  { t:9600, dur:2000, text:'EVERY  BATTLE  ECHOES  THE  OBSIDIAN  NETWORK.' },
  { t:11600,dur:2000, text:'ONE  PATH  REMAINS  —  REACH  OMETEOTL.' },
  { t:13600,dur:1400, text:'PROVE  YOUR  WORTH.  THE  GODS  AWAIT.' },
];
const CINE_TOTAL = 15000;

function playCineVoice(text) {
  const ac = getAC(), now = ac.currentTime;
  const words = text.replace(/\s+/g,' ').trim().split(' ').filter(w => w.length > 0);
  const tpw = Math.min(0.22, 1.8 / words.length);
  words.forEach((w, i) => {
    const tOn = now + i * tpw + 0.04;
    const base = 148 + (w.charCodeAt(0) % 9) * 36 + (w.length % 5) * 18;
    const osc = ac.createOscillator(), flt = ac.createBiquadFilter(), env = ac.createGain();
    osc.type = 'square';
    flt.type = 'bandpass'; flt.frequency.value = 820; flt.Q.value = 2.8;
    osc.frequency.setValueAtTime(base * 1.7, tOn);
    osc.frequency.exponentialRampToValueAtTime(base, tOn + 0.038);
    osc.frequency.linearRampToValueAtTime(base * 1.06, tOn + tpw * 0.72);
    env.gain.setValueAtTime(0, tOn);
    env.gain.linearRampToValueAtTime(0.13, tOn + 0.016);
    env.gain.setValueAtTime(0.13, tOn + tpw * 0.52);
    env.gain.exponentialRampToValueAtTime(0.001, tOn + tpw * 0.86);
    osc.connect(flt); flt.connect(env); env.connect(ac.destination);
    osc.start(tOn); osc.stop(tOn + tpw);
  });
}

function drawCinematic(t) {
  if (cinematicStartT === null) cinematicStartT = t;
  const el = t - cinematicStartT;

  if (el >= CINE_TOTAL) {
    cinematicStartT = null; cinematicVoiced.clear(); gs = GS.HISTORY; return;
  }

  // Current scene
  let si = CINE_SCENES.length - 1;
  for (let i = 0; i < CINE_SCENES.length; i++) {
    if (el < CINE_SCENES[i].t + CINE_SCENES[i].dur) { si = i; break; }
  }
  const sc = CINE_SCENES[si];
  const sel = el - sc.t;
  const sp = Math.min(1, sel / sc.dur); // 0→1 within scene

  if (!cinematicVoiced.has(si)) { cinematicVoiced.add(si); playCineVoice(sc.text); }

  cx.fillStyle = '#00000c'; cx.fillRect(0,0,W,H);

  // ── Scene 0: THE FIFTH SUN ENDED ──
  if (si === 0) {
    // Stars
    for (let s = 0; s < 90; s++) {
      const sx = (s*137+11)%W, sy = (s*91+23)%(H*0.8);
      const sa = (0.25 + Math.sin(t*0.0012+s)*0.18) * Math.min(1, sp*3);
      cx.fillStyle = `rgba(255,240,200,${sa.toFixed(2)})`;
      cx.fillRect(sx, sy, s%4===0?2:1, s%4===0?2:1);
    }
    // Pixelated sun fading out
    const sunA = Math.max(0, 1 - sp * 1.3);
    const sr = 44, sunX = W/2, sunY = 165;
    for (let px = -sr; px <= sr; px += 4) {
      for (let py = -sr; py <= sr; py += 4) {
        if (px*px+py*py <= sr*sr) {
          const d = Math.sqrt(px*px+py*py)/sr;
          cx.fillStyle = d<0.35 ? `rgba(255,255,190,${(sunA*0.92).toFixed(2)})`
                       : d<0.65 ? `rgba(255,170,20,${(sunA*0.78).toFixed(2)})`
                                : `rgba(200,60,0,${(sunA*0.48).toFixed(2)})`;
          cx.fillRect(sunX+px, sunY+py, 4, 4);
        }
      }
    }
    // Darkness spreading
    const da = Math.min(0.82, sp * 1.1);
    cx.fillStyle = `rgba(0,0,10,${da.toFixed(2)})`; cx.fillRect(0,0,W,H*0.55);

  // ── Scene 1: THE GODS BECAME CODE ──
  } else if (si === 1) {
    for (let s = 0; s < 90; s++) {
      const sx = (s*137+11)%W, sy = (s*91+23)%(H*0.8);
      const sa = 0.20 + Math.sin(t*0.001+s)*0.12;
      cx.fillStyle = `rgba(255,240,200,${sa.toFixed(2)})`;
      cx.fillRect(sx, sy, 1, 1);
    }
    // Digital rain columns
    for (let col = 0; col < 22; col++) {
      const colX = col*37 + 10;
      const spd = 70 + (col*41)%55;
      for (let row = 0; row < 18; row++) {
        const rowY = ((el*spd/1000*22 + row*28 + col*53) % (H+50)) - 25;
        const ra = Math.max(0, 1 - row/14) * 0.55;
        const gold = col%5===0;
        cx.fillStyle = gold ? `rgba(255,210,40,${ra.toFixed(2)})` : `rgba(30,200,100,${ra.toFixed(2)})`;
        cx.fillRect(colX, Math.round(rowY), 2, 14);
        const ch = (Math.floor(rowY/14)+col*7)%8;
        for (let b = 0; b < 4; b++) { if ((ch>>b)&1) cx.fillRect(colX+b, Math.round(rowY), 1, 2); }
      }
    }
    // God ghost materializing
    if (sp > 0.25) {
      const ghostA = Math.min(0.7, (sp-0.25)*1.8);
      const gIdx = Math.floor(sp * GODS.length) % GODS.length;
      cx.save();
      cx.globalAlpha = ghostA;
      cx.translate(W/2, 190);
      cx.scale(3.2, 3.2);
      const mock = {x:-16,y:-20,w:32,h:40,godIdx:gIdx,facing:1,hp:1,maxHp:1,rage:0,djTimer:0,stepT:Math.floor(t/280)%12,onGround:true,vx:0.5};
      drawSprite(mock, t);
      cx.restore();
    }

  // ── Scene 2: TEZCATLIPOCA SHATTERED THE MIRROR ──
  } else if (si === 2) {
    cx.fillStyle = `rgba(50,0,0,${(0.28*sp).toFixed(2)})`; cx.fillRect(0,0,W,H);
    // Mirror shards flying out
    for (let i = 0; i < 48; i++) {
      const ang = (i/48)*Math.PI*2 + i*0.31;
      const dist = (30 + (i*19)%70) * sp * 4.5;
      const sx2 = W/2 + Math.cos(ang)*dist, sy2 = H/2-15 + Math.sin(ang)*dist;
      const sa2 = Math.max(0, 1 - sp*1.6);
      const col = i%3;
      cx.fillStyle = col===0 ? `rgba(190,190,255,${sa2.toFixed(2)})`
                   : col===1 ? `rgba(80,200,255,${sa2.toFixed(2)})`
                              : `rgba(255,255,255,${sa2.toFixed(2)})`;
      cx.fillRect(Math.round(sx2), Math.round(sy2), 2+(i%3), 2+(i%2));
    }
    // Red aura pulse
    const rgA = (0.22 + Math.sin(t*0.008)*0.1).toFixed(2);
    const rg2 = cx.createRadialGradient(W/2,H/2,12,W/2,H/2,130);
    rg2.addColorStop(0,`rgba(220,30,10,${rgA})`); rg2.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=rg2; cx.fillRect(0,0,W,H);
    // Tezcatlipoca close-up
    cx.save();
    cx.globalAlpha = Math.min(1, sp*3);
    cx.translate(W/2, 200);
    cx.scale(4.8, 4.8);
    const tezMock = {x:-16,y:-20,w:32,h:40,godIdx:0,facing:1,hp:1,maxHp:1,
      rage:Math.floor(t/120)%2===0?1:0,djTimer:0,stepT:0,onGround:true,vx:0};
    drawSprite(tezMock, t);
    cx.restore();

  // ── Scene 3: SEVENTEEN GODS DECLARED WAR ──
  } else if (si === 3) {
    const cols3 = 6;
    GODS.forEach((god, gi) => {
      const col3 = gi % cols3, row3 = Math.floor(gi/cols3);
      const gx3 = 52 + col3*118 + Math.sin(t*0.001+gi)*3;
      const gy3 = 72 + row3*88 + Math.cos(t*0.0014+gi*0.8)*3;
      const appear = Math.min(1, Math.max(0, sp*GODS.length*0.85 - gi*0.25));
      if (appear <= 0) return;
      cx.save();
      cx.globalAlpha = appear * 0.88;
      cx.translate(gx3, gy3);
      cx.scale(1.9, 1.9);
      const m3 = {x:-16,y:-20,w:32,h:40,godIdx:gi,facing:gi%2===0?1:-1,hp:1,maxHp:1,rage:0,djTimer:0,
        stepT:Math.floor((t+gi*190)/290)%12,onGround:true,vx:0.5};
      drawSprite(m3, t);
      cx.restore();
      // Battle sparks
      if (appear > 0.6 && Math.sin(t*0.008+gi*2.4) > 0.72) {
        cx.fillStyle = `rgba(255,210,50,${(0.4+Math.random()*0.4).toFixed(2)})`;
        cx.fillRect(gx3+Math.round(Math.random()*36-18), gy3+Math.round(Math.random()*36-18), 2, 2);
      }
    });

  // ── Scene 4: THE DIGITAL ARENA AWAKENS ──
  } else if (si === 4) {
    drawPlatform();
    // Digital grid
    cx.strokeStyle = 'rgba(50,170,255,0.12)'; cx.lineWidth = 1;
    for (let gx4 = 0; gx4 < W; gx4 += 20) { cx.beginPath(); cx.moveTo(gx4,0); cx.lineTo(gx4,H); cx.stroke(); }
    for (let gy4 = 0; gy4 < H; gy4 += 20) { cx.beginPath(); cx.moveTo(0,gy4); cx.lineTo(W,gy4); cx.stroke(); }
    cx.lineWidth = 1;
    // Arena glow
    const ag = cx.createRadialGradient(W/2, PLAT.y, 0, W/2, PLAT.y, 200);
    ag.addColorStop(0,'rgba(80,60,200,0.35)'); ag.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=ag; cx.fillRect(0,0,W,H);
    // Lightning bolt
    if (Math.sin(t*0.014) > 0.55) {
      const lx4 = W/2 + Math.sin(t*0.007)*90;
      cx.strokeStyle = `rgba(200,150,255,${(0.6+Math.sin(t*0.03)*0.3).toFixed(2)})`; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(lx4, 0);
      for (let seg = 0; seg < 7; seg++) cx.lineTo(lx4 + Math.sin(t*0.03+seg*1.9)*16, seg*(PLAT.y/7));
      cx.stroke(); cx.lineWidth = 1;
    }
    drawThunderclouds(t);

  // ── Scene 5: REACH OMETEOTL ──
  } else if (si === 5) {
    const pyX2 = W/2, pyBase2 = H - 48;
    // Pyramid tiers
    for (let tier = 0; tier < 7; tier++) {
      const tw = Math.round(220 * (1 - tier/7));
      const th = 26, ty2 = pyBase2 - tier * th;
      const br = 0.25 + tier/7 * 0.55 + Math.sin(t*0.005+tier)*0.06;
      cx.fillStyle = `rgba(${Math.round(70+tier*22)},${Math.round(35+tier*15)},${tier*6},0.9)`;
      cx.fillRect(pyX2-tw, ty2-th, tw*2, th);
      cx.fillStyle = `rgba(${Math.round(210+tier*6)},${Math.round(120+tier*16)},${Math.round(10+tier*8)},${br.toFixed(2)})`;
      cx.fillRect(pyX2-tw, ty2-th, tw*2, 3);
    }
    // Golden beam
    const beamH2 = Math.round(sp * (pyBase2 - 42));
    if (beamH2 > 1) {
      const bGrd = cx.createLinearGradient(W/2, pyBase2-beamH2, W/2, pyBase2);
      bGrd.addColorStop(0,'rgba(255,255,190,0.95)'); bGrd.addColorStop(0.4,'rgba(255,210,40,0.45)');
      bGrd.addColorStop(1,'rgba(255,190,0,0.04)');
      cx.fillStyle=bGrd; cx.fillRect(W/2-5, pyBase2-beamH2, 10, beamH2);
    }
    // Glow at top of beam
    if (beamH2 > 10) {
      const bg2 = cx.createRadialGradient(W/2, pyBase2-beamH2, 0, W/2, pyBase2-beamH2, 40);
      bg2.addColorStop(0,'rgba(255,255,200,0.6)'); bg2.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=bg2; cx.fillRect(W/2-42, pyBase2-beamH2-42, 84, 84);
    }
    // OMETEOTL name
    if (sp > 0.55) {
      const oa = Math.min(1,(sp-0.55)*2.3);
      bigText('OMETEOTL', W/2, 52, 20, `rgba(255,240,100,${oa.toFixed(2)})`, `rgba(80,40,0,${oa.toFixed(2)})`);
      cx.fillStyle=`rgba(200,160,50,${(oa*0.55).toFixed(2)})`; cx.font='7px monospace'; cx.textAlign='center';
      cx.fillText('THE  SOURCE  ABOVE  ALL  GODS', W/2, 70); cx.textAlign='left';
    }

  // ── Scene 6: YOUR LEGEND BEGINS NOW ──
  } else if (si === 6) {
    for (let s = 0; s < 80; s++) {
      const sx3 = (s*137+11)%W, sy3 = (s*91+23)%H;
      const sa3 = Math.min(1,sp*2.5) * (0.28+Math.sin(t*0.002+s)*0.16);
      cx.fillStyle = `rgba(255,240,200,${sa3.toFixed(2)})`; cx.fillRect(sx3,sy3,s%4===0?2:1,s%4===0?2:1);
    }
    GODS.forEach((g6, gi) => {
      const gx6 = 34 + (gi%5)*154, gy6 = 50 + Math.floor(gi/5)*36;
      const ga6 = Math.min(1,Math.max(0,sp*GODS.length*0.7 - gi*0.12));
      cx.fillStyle=`rgba(255,200,70,${(ga6*0.65).toFixed(2)})`; cx.font='7px monospace';
      cx.fillText(g6.short, gx6, gy6);
    });
    // Tezcat large silhouette fading in
    if (sp > 0.3) {
      const ta6 = Math.min(0.55,(sp-0.3)*1.4);
      cx.save(); cx.globalAlpha=ta6; cx.translate(W/2,210); cx.scale(5,5);
      const m6={x:-16,y:-20,w:32,h:40,godIdx:0,facing:1,hp:1,maxHp:1,rage:1,djTimer:0,stepT:0,onGround:true,vx:0};
      drawSprite(m6,t); cx.restore();
    }
    if (sp > 0.72) {
      const fa6 = (sp-0.72)/0.28;
      cx.fillStyle=`rgba(0,0,0,${(fa6*0.9).toFixed(2)})`; cx.fillRect(0,0,W,H);
    }
  }

  // ── Letterbox + scene text ──
  cx.fillStyle='rgba(0,0,0,0.9)'; cx.fillRect(0,0,W,38); cx.fillRect(0,H-48,W,48);
  const tf = sp < 0.14 ? sp/0.14 : sp > 0.82 ? (1-sp)/0.18 : 1;
  if (tf > 0) {
    cx.fillStyle=`rgba(255,240,200,${tf.toFixed(2)})`; cx.font='bold 11px monospace'; cx.textAlign='center';
    cx.fillText(sc.text, W/2, H-16); cx.textAlign='left';
  }

  // Top label
  cx.fillStyle='rgba(180,140,60,0.45)'; cx.font='7px monospace'; cx.textAlign='center';
  cx.fillText('— ORIGIN  LORE —', W/2, 24); cx.textAlign='left';

  // Progress bar
  cx.fillStyle='rgba(40,10,60,0.9)'; cx.fillRect(0,H-4,W,4);
  cx.fillStyle=`rgba(170,80,255,0.75)`; cx.fillRect(0,H-4,Math.round(W*el/CINE_TOTAL),4);

  // Skip hint (first 2s and last 1.5s)
  if (el < 2000) {
    cx.fillStyle='rgba(120,90,150,0.7)'; cx.font='7px monospace'; cx.textAlign='right';
    cx.fillText('SPACE — skip', W-14, 24); cx.textAlign='left';
  }
}

// ── Lore screen ───────────────────────────────────────────────
// Right panel bounds: x 510–790, y 52–(H-52)
const LORE_PX = 510, LORE_PW = 280, LORE_CX = 650;

function drawLorePageVisual(pageIdx, t) {
  // Clip to right panel so sprites never bleed into the text column
  cx.save();
  cx.beginPath();
  cx.rect(LORE_PX, 52, LORE_PW, H - 104);
  cx.clip();

  if (pageIdx === 0) {
    // Fine grid + digital rain + Tezcatlipoca portrait
    cx.strokeStyle = 'rgba(0,220,180,0.08)'; cx.lineWidth = 1;
    for (let gx = LORE_PX; gx < LORE_PX+LORE_PW; gx += 18) { cx.beginPath(); cx.moveTo(gx,52); cx.lineTo(gx,H-52); cx.stroke(); }
    for (let gy = 52; gy < H-52; gy += 18) { cx.beginPath(); cx.moveTo(LORE_PX,gy); cx.lineTo(LORE_PX+LORE_PW,gy); cx.stroke(); }
    for (let i = 0; i < 22; i++) {
      const px2 = LORE_PX + 8 + (i*41)%258;
      const py2 = ((t*0.055 + i*44) % (H - 120)) + 52;
      const pa = 0.20 + Math.sin(t*0.003+i)*0.10;
      cx.fillStyle = i%4===0 ? `rgba(255,215,0,${pa.toFixed(2)})` : `rgba(0,200,160,${pa.toFixed(2)})`;
      cx.fillRect(px2, Math.round(py2), 2, 12);
    }
    cx.save(); cx.globalAlpha = 0.72 + Math.sin(t*0.0018)*0.12;
    cx.translate(LORE_CX, 210); cx.scale(4.2, 4.2);
    drawSprite({x:-16,y:-20,w:32,h:40,godIdx:0,facing:1,hp:1,maxHp:1,rage:0,djTimer:0,stepT:Math.floor(t/300)%12,onGround:true,vx:0.5}, t);
    cx.restore();

  } else if (pageIdx === 1) {
    // Shattered mirror fragments radiating from centre
    const rg1 = cx.createRadialGradient(LORE_CX, 200, 12, LORE_CX, 200, 105);
    rg1.addColorStop(0, 'rgba(180,20,0,0.32)'); rg1.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = rg1; cx.fillRect(LORE_PX, 52, LORE_PW, H-104);
    for (let i = 0; i < 48; i++) {
      const ang = (i/48)*Math.PI*2 + t*0.0003;
      const dist = 48 + (i*19)%72 + Math.sin(t*0.001*((i%3)+1)+i)*16;
      const mx = LORE_CX + Math.cos(ang)*dist;
      const my = 200 + Math.sin(ang)*dist*0.52;
      const ma = 0.20 + Math.sin(t*0.006+i)*0.16;
      const col = i%3;
      cx.fillStyle = col===0?`rgba(190,190,255,${ma.toFixed(2)})`:col===1?`rgba(80,200,255,${ma.toFixed(2)})`:`rgba(255,80,30,${ma.toFixed(2)})`;
      cx.fillRect(Math.round(mx), Math.round(my), 2+(i%3), 2+(i%2));
    }
    cx.save(); cx.globalAlpha = 0.75;
    cx.translate(LORE_CX, 200); cx.scale(4.0, 4.0);
    drawSprite({x:-16,y:-20,w:32,h:40,godIdx:0,facing:1,hp:1,maxHp:1,rage:1,djTimer:0,stepT:0,onGround:true,vx:0}, t);
    cx.restore();

  } else if (pageIdx === 2) {
    // War council — 6 enemy gods in a 2×3 grid
    [1, 2, 3, 7, 11, 14].forEach((gi, i) => {
      const col = i % 2, row = Math.floor(i/2);
      const gx2 = LORE_PX + 42 + col * 130;
      const gy2 = 90 + row * 96 + Math.sin(t*0.0015+i*0.8)*5;
      cx.save(); cx.globalAlpha = 0.55 + Math.sin(t*0.002+i)*0.12;
      cx.translate(gx2, gy2); cx.scale(2.2, 2.2);
      drawSprite({x:-13,y:-20,w:26,h:40,godIdx:gi,facing:i%2===0?-1:1,hp:1,maxHp:1,rage:0,djTimer:0,stepT:Math.floor((t+gi*200)/300)%12,onGround:true,vx:0.5}, t);
      cx.restore();
      const hexP = GODS[gi].acc.replace('#','').match(/../g)||['88','88','88'];
      const [r2,g3,b2] = hexP.map(h=>parseInt(h,16));
      cx.fillStyle = `rgba(${r2},${g3},${b2},0.80)`;
      cx.font = '6px monospace'; cx.textAlign = 'center';
      cx.fillText(GODS[gi].short, gx2, gy2+52); cx.textAlign = 'left';
    });

  } else if (pageIdx === 3) {
    // Tezcat in action + converging mirror shards
    cx.save(); cx.globalAlpha = 0.70 + Math.sin(t*0.002)*0.12;
    cx.translate(LORE_CX, 205); cx.scale(4.5, 4.5);
    drawSprite({x:-16,y:-20,w:32,h:40,godIdx:0,facing:1,hp:1,maxHp:1,rage:0,djTimer:0,stepT:Math.floor(t/280)%12,onGround:true,vx:0.8}, t);
    cx.restore();
    for (let i = 0; i < 20; i++) {
      const ang = (i/20)*Math.PI*2;
      const dist = Math.max(2, 90 - ((t*0.045 + i*18)%108));
      const mx = LORE_CX + Math.cos(ang)*dist;
      const my = 205 + Math.sin(ang)*dist*0.5;
      cx.fillStyle = `rgba(200,200,255,${Math.max(0, dist/90*0.55).toFixed(2)})`;
      cx.fillRect(Math.round(mx)-1, Math.round(my)-1, 3, 2);
    }

  } else {
    // Final page: all 17 gods miniature grid
    GODS.forEach((g, i) => {
      const col = i % 3, row = Math.floor(i/3);
      const gx5 = LORE_PX + 32 + col * 82;
      const gy5 = 80 + row * 65 + Math.sin(t*0.0016+i*0.7)*4;
      if (gy5 > H - 72) return;
      cx.save(); cx.globalAlpha = 0.38 + Math.sin(t*0.002+i*0.6)*0.10;
      cx.translate(gx5, gy5); cx.scale(1.55, 1.55);
      drawSprite({x:-13,y:-20,w:26,h:40,godIdx:i,facing:i%2===0?1:-1,hp:1,maxHp:1,rage:0,djTimer:0,stepT:Math.floor((t+i*150)/310)%12,onGround:true,vx:0.5}, t);
      cx.restore();
    });
  }

  cx.restore(); // end clip
}

function drawLore(t) {
  const page = lang==='nah'?(LORE_PAGES_NAH[lorePageIdx]||LORE_PAGES[lorePageIdx]):lang==='es'?LORE_PAGES_ES[lorePageIdx]:LORE_PAGES[lorePageIdx];

  // Background per page
  cx.fillStyle = '#000010'; cx.fillRect(0,0,W,H);
  if (page.bg === 0) drawFirstSunBG(t);
  else if (page.bg === 1) drawTemploMayorBG(t);
  else if (page.bg === 2) drawCoatepecBG(t);
  else if (page.bg === 3) drawOmeyocanBG(t);
  else { drawSky(t); drawWorld(t); }

  // Readability overlay
  cx.fillStyle = 'rgba(0,0,0,0.74)'; cx.fillRect(0,0,W,H);

  // Digital grid tint matching page color
  const hexP = page.color.replace('#','').match(/../g)||['00','88','88'];
  const [pr,pg,pb] = hexP.map(h=>parseInt(h,16));
  cx.strokeStyle = `rgba(${pr},${pg},${pb},0.05)`; cx.lineWidth = 1;
  for (let gx = 0; gx < W; gx += 32) { cx.beginPath(); cx.moveTo(gx,0); cx.lineTo(gx,H); cx.stroke(); }
  for (let gy = 0; gy < H; gy += 32) { cx.beginPath(); cx.moveTo(0,gy); cx.lineTo(W,gy); cx.stroke(); }

  // Vertical divider separating text panel from visual panel
  cx.fillStyle = `rgba(${pr},${pg},${pb},0.08)`; cx.fillRect(505, 52, 2, H-104);

  // Right-panel visuals
  drawLorePageVisual(lorePageIdx, t);

  // ── TOP LETTERBOX ──
  cx.fillStyle = 'rgba(0,0,0,0.92)'; cx.fillRect(0,0,W,52);

  cx.fillStyle = 'rgba(180,140,60,0.55)'; cx.font = '7px monospace'; cx.textAlign = 'center';
  cx.fillText(lang==='es'?'— TRADICIÓN  ·  GUERRA DE LOS DIOSES  ·  ORIGEN —':'— HISTORY MODE  ·  WAR OF THE GODS  ·  ORIGIN LORE —', W/2, 14);
  cx.textAlign = 'left';

  // Page title (large, centered left panel)
  bigText(page.title, 255, 38, 14, page.color, page.accent);

  // Subtitle
  cx.fillStyle = page.color + 'aa'; cx.font = 'italic 8px monospace'; cx.textAlign = 'center';
  cx.fillText(page.subtitle, 255, 52); cx.textAlign = 'left';

  // Divider below header
  cx.strokeStyle = page.color + '44'; cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(18, 62); cx.lineTo(495, 62); cx.stroke();

  // ── NARRATIVE TEXT ──
  cx.font = '10px monospace';
  let textY = 80;
  page.body.forEach(line => {
    if (textY > H - 62) return;
    if (line === '') { textY += 7; return; }
    // Highlight lines that look like emphasis (short, start with capital)
    const isEmphasis = line.startsWith('"') || (line.length < 38 && /^[A-Z]/.test(line) && !line.includes(','));
    cx.fillStyle = isEmphasis ? page.color + 'dd' : '#ccc8ba';
    cx.fillText(line, 22, textY);
    textY += 15;
  });

  // ── BOTTOM BAR ──
  cx.fillStyle = 'rgba(0,0,0,0.92)'; cx.fillRect(0, H-52, W, 52);

  // Page indicator dots
  const total = LORE_PAGES.length;
  for (let i = 0; i < total; i++) {
    const dotX = W/2 - (total-1)*13 + i*26;
    cx.fillStyle = i === lorePageIdx ? page.color : '#2a2218';
    cx.beginPath(); cx.arc(dotX, H-33, i===lorePageIdx?7:5, 0, Math.PI*2); cx.fill();
    if (i === lorePageIdx) {
      cx.fillStyle = 'rgba(255,255,255,0.35)';
      cx.beginPath(); cx.arc(dotX-2, H-36, 2, 0, Math.PI*2); cx.fill();
    }
    // Dot label (tiny page number)
    cx.fillStyle = i===lorePageIdx ? '#fff' : '#443322';
    cx.font = '6px monospace'; cx.textAlign = 'center';
    cx.fillText(i+1, dotX, H-30); cx.textAlign = 'left';
  }

  // Page counter
  cx.fillStyle = page.color + '88'; cx.font = 'bold 8px monospace';
  cx.fillText((lorePageIdx+1)+' / '+total, 22, H-44);

  // Navigation hint
  cx.fillStyle = '#555566'; cx.font = '8px monospace'; cx.textAlign = 'center';
  if (lorePageIdx < LORE_PAGES.length-1) {
    cx.fillText(lang==='es'?'◄ A / ATRÁS     D / ESPACIO ► SIGUIENTE     ESC  MENÚ':'◄ A / BACK     D / SPACE ► NEXT PAGE     ESC  TITLE', W/2, H-13);
  } else {
    cx.fillText(lang==='es'?'◄ A / ATRÁS     ESPACIO / TOCA ► HISTORIAL     ESC  MENÚ':'◄ A / BACK     SPACE / TAP ► BATTLE RECORDS     ESC  TITLE', W/2, H-13);
  }
  cx.textAlign = 'left';

  // Right-tap / left-tap hint (mobile)
  cx.fillStyle = `rgba(${pr},${pg},${pb},0.30)`;
  cx.font = '7px monospace'; cx.textAlign = 'left';
  cx.fillText('◄ tap', 18, H-30);
  cx.textAlign = 'right';
  cx.fillText('tap ►', W-18, H-30);
  cx.textAlign = 'left';
}

// ── History screen ───────────────────────────────────────────
function drawHistory(t) {
  drawSky(t);
  cx.fillStyle='rgba(0,0,0,0.88)'; cx.fillRect(0,0,W,H);

  // ── header ──
  cx.fillStyle='rgba(12,8,20,0.95)'; cx.fillRect(0,0,W,46);
  cx.strokeStyle='#4a3000'; cx.lineWidth=1; cx.beginPath(); cx.moveTo(0,46); cx.lineTo(W,46); cx.stroke();
  bigText(TX('histTitle'),W/2,30,14,'#ffd700','#5a2000');

  if(battleHistory.length===0){
    // empty state
    bigText(TX('histEmpty'),W/2,H/2-20,16,'#555544','#111');
    cx.fillStyle='#444'; cx.font='9px monospace'; cx.textAlign='center';
    cx.fillText('Play VS BATTLE or STORY to record history.',W/2,H/2+10);
    cx.textAlign='left';
  } else {

    // ── compute stats ──
    const total = battleHistory.length;
    const p1wins = battleHistory.filter(e=>e.p1win).length;
    const p2wins = total - p1wins;
    const storyCount = battleHistory.filter(e=>e.story).length;

    // god win/play counts
    const godW = new Array(NUM_GODS).fill(0);  // wins as p1
    const godP = new Array(NUM_GODS).fill(0);  // total appearances
    battleHistory.forEach(e=>{
      godP[e.p1]++; godP[e.p2]++;
      if(e.p1win) godW[e.p1]++; else godW[e.p2]++;
    });

    // top 6 by appearances
    const ranked = [...Array(NUM_GODS).keys()]
      .filter(i=>godP[i]>0)
      .sort((a,b)=>godP[b]-godP[a])
      .slice(0,6);

    // ── SECTION 1: summary strip ──
    const SY=54;
    cx.fillStyle='rgba(30,20,10,0.6)'; cx.fillRect(10,SY,W-20,38);
    cx.strokeStyle='#3a2800'; cx.lineWidth=1; cx.strokeRect(10,SY,W-20,38);
    const cols4=[['BATTLES',total,'#ffd700'],[`P1 WINS`,p1wins,'#ff7744'],[`P2 WINS`,p2wins,'#44aaff'],['STORY',storyCount,'#cc88ff']];
    cols4.forEach(([lbl,val,col],i)=>{
      const cx2=10+i*(W-20)/4+(W-20)/8;
      cx.fillStyle=col; cx.font='bold 14px monospace'; cx.textAlign='center';
      cx.fillText(val,cx2,SY+20);
      cx.fillStyle='#776644'; cx.font='7px monospace';
      cx.fillText(lbl,cx2,SY+32);
    });
    cx.textAlign='left';

    // ── SECTION 2: god usage bar chart ──
    const CY=100;
    cx.fillStyle='rgba(10,6,16,0.7)'; cx.fillRect(10,CY,W-20,ranked.length*30+22);
    cx.strokeStyle='#3a2050'; cx.lineWidth=1; cx.strokeRect(10,CY,W-20,ranked.length*30+22);
    cx.fillStyle='#aa88ff'; cx.font='7px monospace'; cx.textAlign='left';
    cx.fillText('TOP GODS — BATTLES PLAYED',18,CY+12);
    cx.textAlign='left';

    const maxP = ranked.length ? godP[ranked[0]] : 1;
    const BAR_X=90, BAR_W=W-20-BAR_X-20;
    ranked.forEach((gi,i)=>{
      const ry=CY+18+i*30;
      const plays=godP[gi], wins=godW[gi];
      const pct=plays/maxP;
      const wpct=plays>0?wins/plays:0;

      // row bg
      cx.fillStyle=i%2===0?'rgba(30,18,50,0.4)':'rgba(20,12,36,0.3)';
      cx.fillRect(14,ry,W-28,26);

      // god name
      cx.fillStyle=GODS[gi].acc; cx.font='bold 8px monospace'; cx.textAlign='left';
      cx.fillText(GODS[gi].short,18,ry+11);
      cx.fillStyle='#665544'; cx.font='6px monospace';
      cx.fillText(gstr(GODS[gi],'title').slice(0,18),18,ry+21);

      // play bar (gold)
      cx.fillStyle='rgba(80,55,10,0.5)'; cx.fillRect(BAR_X,ry+4,BAR_W,9);
      cx.fillStyle='rgba(200,128,10,0.75)'; cx.fillRect(BAR_X,ry+4,Math.round(BAR_W*pct),9);

      // win bar (purple overlay on top)
      cx.fillStyle='rgba(140,80,220,0.55)'; cx.fillRect(BAR_X,ry+4,Math.round(BAR_W*wpct),9);

      // numbers
      cx.fillStyle='#ffd700'; cx.font='bold 7px monospace'; cx.textAlign='right';
      cx.fillText(plays+'P',BAR_X-4,ry+12);
      cx.fillStyle='#aa66ff';
      cx.fillText(Math.round(wpct*100)+'%W',W-16,ry+12);
      cx.textAlign='left';
    });

    // chart legend
    const legendY=CY+ranked.length*30+26;
    cx.fillStyle='rgba(200,128,10,0.7)'; cx.fillRect(BAR_X+4,legendY-8,28,6);
    cx.fillStyle='#aa6633'; cx.font='6px monospace';
    cx.fillText('PLAYED',BAR_X+36,legendY-3);
    cx.fillStyle='rgba(140,80,220,0.6)'; cx.fillRect(BAR_X+106,legendY-8,28,6);
    cx.fillStyle='#9966cc';
    cx.fillText('WIN %',BAR_X+138,legendY-3);

    // ── SECTION 3: recent matches table ──
    const TY = legendY+12;
    const rowH=34;
    const visible=Math.min(battleHistory.length,Math.floor((H-TY-24)/rowH));
    const tableH=visible*rowH+18;

    cx.fillStyle='rgba(10,6,16,0.7)'; cx.fillRect(10,TY,W-20,tableH);
    cx.strokeStyle='#3a2800'; cx.lineWidth=1; cx.strokeRect(10,TY,W-20,tableH);

    // column header
    cx.fillStyle='rgba(20,14,8,0.9)'; cx.fillRect(10,TY,W-20,14);
    cx.fillStyle='#886644'; cx.font='6px monospace'; cx.textAlign='left';

  cx.textAlign='left';

  const ROW_Y=[50,136,222,308];

  STORY_LEVELS.forEach((lvl,i)=>{

    // Act label above first node in each row
    if(col===0){

    cx.fillStyle=done?'rgba(80,40,150,0.5)':isCur&&unlocked?'rgba(110,55,210,0.28)':'rgba(12,8,20,0.78)';
    cx.fillRect(lx,ly,BW,BH);
    cx.strokeStyle=done?'#aa66ff':isCur&&unlocked?'#cc88ff':unlocked?'#3a2250':'#161020';
    cx.lineWidth=isCur&&unlocked?2:1; cx.strokeRect(lx,ly,BW,BH);

    cx.fillStyle=unlocked?'#776699':'#221830';
    cx.font='6px monospace'; cx.textAlign='right';

    cx.fillStyle=done?'#bbaadd':unlocked?'#aaaacc':'#2e2244';

  cx.fillStyle='#7755aa'; cx.font='bold 8px monospace'; cx.textAlign='left'; cx.textBaseline='middle';

    cx.fillStyle=l<storyLives?'#cc88ff':'#1e0e30';
    cx.beginPath(); cx.arc(px+7,405,7,0,Math.PI*2); cx.fill();

      cx.fillStyle='rgba(240,200,255,0.5)';
      cx.beginPath(); cx.arc(px+5,403,3,0,Math.PI*2); cx.fill();

  cx.fillStyle='rgba(0,0,0,0.65)'; cx.fillRect(W/2-82,428,164,22);
  cx.textBaseline='middle';
  cx.fillStyle='#886644'; cx.font='bold 7px monospace'; cx.textAlign='left';
  cx.fillText(TX('difficulty'),W/2-78,439);

  cx.fillStyle=_dcols[difficulty]; cx.font='bold 8px monospace'; cx.textAlign='right';

  cx.fillText('◄ MENU', 30, 13);

// ── Portrait close-up for pre-battle dialogue ────────────────
function drawPortraitCloseup(godIdx, pcx, pcy, facingRight, active, t) {
  const g = GODS[godIdx];
  const scale = 3.5;
  const bob = active ? Math.sin(t * 0.0022) * 4 : 0;

  // Accent glow behind active portrait
  if (active) {
    const hx = g.acc.replace('#','');
    const pr = parseInt(hx.slice(0,2),16), pg = parseInt(hx.slice(2,4),16), pb = parseInt(hx.slice(4,6),16);
    const ga = (0.22 + Math.sin(t*0.003)*0.07).toFixed(2);
    cx.save();
    cx.translate(pcx, pcy + bob);
    const grd = cx.createRadialGradient(0,-10,8,0,-10,88);
    grd.addColorStop(0, `rgba(${pr},${pg},${pb},0.55)`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = grd; cx.globalAlpha = parseFloat(ga);
    cx.fillRect(-90,-110,180,200);
    cx.globalAlpha = 1;
    cx.restore();
  }

  // Scaled-up sprite
  const mock = { x:-16, y:-20, w:32, h:40, godIdx,
    facing: 1,
    hp:1, maxHp:1, rage:0, djTimer:0, atkTimer:0, hitstun:0,
    stepT: active ? (Math.floor(t/300)%12) : 0,
    onGround:true, vx: active ? 0.5 : 0 };
  cx.save();
  cx.globalAlpha = active ? 1.0 : 0.28;
  cx.translate(pcx, pcy + bob);
  if (!facingRight) cx.scale(-1, 1);
  cx.scale(scale, scale);
  drawSprite(mock, t);
  cx.restore();

  // Name plate
  const nameColor = active ? g.acc : '#443322';
  cx.fillStyle = nameColor;
  cx.font = active ? 'bold 8px monospace' : '7px monospace';
  cx.textAlign = 'center';
  cx.fillText(g.short, pcx, pcy + 88);
  cx.textAlign = 'left';
}

// ── Dialogue screen ──────────────────────────────────────────
function drawDialogue(t) {
  if (dialogueIdx >= dialogueQueue.length) { advanceDialogue(); return; }
  const line = dialogueQueue[dialogueIdx];
  drawBattleBG(t);

  if (dialoguePreBattle) {
    // ── Cinematic pre-battle close-up layout ──
    cx.fillStyle = 'rgba(0,0,8,0.76)'; cx.fillRect(0,0,W,H);

    // Determine speaker
    const p1Nm = GODS[p1Choice].name, p2Nm = GODS[p2Choice].name;
    const p1Active = line.speaker===p1Nm || line.speaker===GODS[p1Choice].short;
    const p2Active = line.speaker===p2Nm || line.speaker===GODS[p2Choice].short;
    const bothActive = !p1Active && !p2Active; // NARRATOR → both at half

    // Subtle divider beam
    cx.fillStyle = 'rgba(180,140,60,0.07)';
    cx.fillRect(W/2-1, 50, 2, 280);

    // Portraits
    drawPortraitCloseup(p1Choice, 175, 195, true,  p1Active||bothActive, t);
    drawPortraitCloseup(p2Choice, 625, 195, false, p2Active||bothActive, t);

    // Cinematic letterbox bars
    cx.fillStyle = 'rgba(0,0,0,0.88)';
    cx.fillRect(0, 0, W, 42);
    cx.fillRect(0, H-116, W, 116);

    // Top bar: scenario label
    cx.fillStyle = 'rgba(180,140,60,0.5)'; cx.font = '7px monospace'; cx.textAlign = 'center';
    cx.fillText('— '+( getStoryLevel(storyLevel)?.name||'STORY' ).toUpperCase()+' —', W/2, 26);
    cx.textAlign = 'left';

    // Dialogue box inside bottom bar
    const boxY = H - 108, boxW = W - 40;
    cx.strokeStyle = '#3a1a55'; cx.lineWidth = 1; cx.strokeRect(20, boxY, boxW, 94);
    cx.strokeStyle = 'rgba(160,80,255,0.10)'; cx.strokeRect(24, boxY+3, boxW-8, 88);

    // Speaker label
    const speakerCol = line.speaker==='NARRATOR' ? '#ffcc44'
                     : p1Active ? GODS[p1Choice].acc : GODS[p2Choice].acc;
    cx.fillStyle = speakerCol; cx.font = 'bold 9px monospace';
    cx.fillText('[ '+line.speaker+' ]', 30, boxY+18);

    // Portrait side indicator (small triangle pointing to speaker)
    if (p1Active) {
      cx.fillStyle = speakerCol;
      cx.beginPath(); cx.moveTo(162,boxY-4); cx.lineTo(170,boxY+4); cx.lineTo(154,boxY+4); cx.closePath(); cx.fill();
    } else if (p2Active) {
      cx.fillStyle = speakerCol;
      cx.beginPath(); cx.moveTo(W-162,boxY-4); cx.lineTo(W-170,boxY+4); cx.lineTo(W-154,boxY+4); cx.closePath(); cx.fill();
    }

    // Dialogue text
    cx.fillStyle = '#e8e8e8'; cx.font = '10px monospace';
    const maxW = boxW - 52, words = line.text.split(' ');
    let lStr = '', lY = boxY + 36;
    words.forEach(w => {
      const test = lStr+w+' ';
      if (cx.measureText(test).width > maxW && lStr) { cx.fillText(lStr.trim(),30,lY); lStr=''; lY+=16; }
      lStr = test;
    });
    if (lStr.trim()) cx.fillText(lStr.trim(), 30, lY);

    // Advance prompt
    if (Math.floor(t/480)%2===0) {
      cx.fillStyle = '#9955ee'; cx.font = '8px monospace'; cx.textAlign = 'right';
      cx.fillText('SPACE ▶', W-28, boxY+88); cx.textAlign = 'left';
    }

    // Progress dots
    const dl = dialogueQueue.length;
    for (let i = 0; i < dl; i++) {
      cx.fillStyle = i < dialogueIdx ? '#7733aa' : i===dialogueIdx ? '#cc88ff' : '#2a1a44';
      cx.fillRect(W/2 - dl*7 + i*14, boxY+96, 10, 3);
    }

  } else {
    // ── Standard dialogue (outro / advice / narration) ──
    cx.fillStyle = 'rgba(0,0,0,0.46)'; cx.fillRect(0,0,W,H);
    const boxH=114, boxY=H-boxH-14;
    cx.fillStyle='rgba(6,4,20,0.93)'; cx.fillRect(20,boxY,W-40,boxH);
    cx.strokeStyle='#7733bb'; cx.lineWidth=2; cx.strokeRect(20,boxY,W-40,boxH);
    cx.strokeStyle='rgba(200,150,255,0.15)'; cx.lineWidth=1; cx.strokeRect(24,boxY+4,W-48,boxH-8);
    const _spkGod=GODS.find(g=>g.name===line.speaker||g.short===line.speaker);
    const speakerColor=line.speaker==='NARRATOR'?'#ffcc44':_spkGod?_spkGod.acc:'#88ccff';
    cx.fillStyle=speakerColor; cx.font='bold 10px monospace';
    cx.fillText(line.speaker+':',32,boxY+22);
    cx.fillStyle='#eeeeee'; cx.font='10px monospace';
    const maxW2=W-96, words2=line.text.split(' ');
    let lineStr='', lineY=boxY+42;
    words2.forEach(w=>{
      const test=lineStr+w+' ';
      if(cx.measureText(test).width>maxW2&&lineStr){ cx.fillText(lineStr.trim(),32,lineY); lineStr=''; lineY+=16; }
      lineStr=test;
    });
    if(lineStr.trim()) cx.fillText(lineStr.trim(),32,lineY);
    if(Math.floor(t/500)%2===0){
      cx.fillStyle='#aa66ff'; cx.font='9px monospace'; cx.textAlign='right';
      cx.fillText('SPACE / TAP ▶',W-32,boxY+boxH-10); cx.textAlign='left';
    }
  }
}

// ── Utility functions ────────────────────────────────────────
function saveBattle(p1wins, p1GodIdx, p2GodIdx, numRounds, isStory) {
  const now=new Date();
  const d=(now.getMonth()+1)+'/'+now.getDate()+'/'+String(now.getFullYear()).slice(-2);
  battleHistory.push({p1:p1GodIdx, p2:p2GodIdx, p1win:p1wins, rounds:numRounds, date:d, story:isStory||false});
  if(battleHistory.length>50) battleHistory.shift();
  localStorage.setItem('wotg_history',JSON.stringify(battleHistory));
}

function showDialogue(lines, callback, preBattle=false) {
  dialogueQueue=lines; dialogueIdx=0; dialogueCallback=callback;
  dialoguePreBattle=preBattle;
  gs=GS.DIALOGUE; stopMusic();
}

function advanceDialogue() {
  dialogueIdx++;
  if(dialogueIdx>=dialogueQueue.length){
    dialogueQueue=[]; dialogueIdx=0; dialoguePreBattle=false;
    if(dialogueCallback){ const cb=dialogueCallback; dialogueCallback=null; cb(); }
  }
}

function startStoryLevel(lvl) {
  storyLevel=lvl; storyMode=true; mode1P=true;
  storyLives=STORY_MAX_LIVES;
  currentScenario=STORY_LEVELS[lvl].scenario;
  p1Choice=0; p2Choice=STORY_LEVELS[lvl].enemy;
  p1Ready=true; p2Ready=true;
  roundNum=1; p1RoundWins=0; p2RoundWins=0;
  showDialogue(getStoryLevel(lvl).intro, ()=>{
    gs=GS.ANNOUNCE; announceT=0; sfxAnnounce(); startMusic('fight');
  }, true);
}

function restartStoryFight() {
  roundNum=1; p1RoundWins=0; p2RoundWins=0;
  gs=GS.ANNOUNCE; announceT=0; sfxAnnounce(); startMusic('fight');
}

// ── Credits scroll content — god names/titles from GODS[], display data from GOD_CREDITS[] ──

// ── Story End / Credits ──────────────────────────────────────
function drawStoryEnd(t) {
  const et = storyEndT;

  // ── PHASE 0: Fade to black (0–1400ms) ──
  if (et < 1400) {
    drawSky(t); drawWorld(t); drawPlatform();
    const ov = Math.min(et / 1000, 1);
    cx.fillStyle = `rgba(0,0,0,${ov.toFixed(3)})`; cx.fillRect(0,0,W,H);
    return;
  }

  cx.fillStyle = '#000'; cx.fillRect(0,0,W,H);

  // ── PHASE 1: Tagline (1400–4600ms) ──
  if (et < 4600) {
    const local = et - 1400;
    const fadeIn  = Math.min(local / 700, 1);
    const fadeOut = local > 2500 ? Math.max(1 - (local-2500)/700, 0) : 1;
    cx.globalAlpha = Math.max(0, fadeIn * fadeOut);
    cx.font = 'bold 20px Georgia, "Times New Roman", serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = '#1a0a00';
    cx.fillText(TX('storyEndLine'), W/2+3, H/2+3);
    cx.fillStyle = '#e8d4a0';
    cx.fillText(TX('storyEndLine'), W/2, H/2);
    cx.globalAlpha = 1;
    cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
    return;
  }

  // ── PHASE 2+: Cinematic darkened battlefield ──
  const bgA = Math.min((et-4600)/1600, 1);

  // Slow left-right pan via translate
  const panX = Math.sin(et * 0.00007) * 20;
  cx.save();
  cx.translate(panX, 0);
  cx.globalAlpha = bgA;
  drawSky(t * 0.25);
  drawWorld(t * 0.25);
  cx.globalAlpha = 1;
  cx.restore();

  // Prestige dark overlay
  cx.fillStyle = `rgba(0,0,10,${(0.80*bgA).toFixed(3)})`; cx.fillRect(0,0,W,H);

  // Vignette
  if (bgA > 0) {
    const vig = cx.createRadialGradient(W/2,H/2,H*0.14,W/2,H/2,H*0.86);
    vig.addColorStop(0,'rgba(0,0,0,0)');
    vig.addColorStop(1,`rgba(0,0,10,${(0.92*bgA).toFixed(2)})`);
    cx.fillStyle=vig; cx.fillRect(0,0,W,H);
  }

  // Letterbox bars
  cx.fillStyle='rgba(0,0,0,0.97)';
  cx.fillRect(0,0,W,54);
  cx.fillRect(0,H-70,W,70);
  const lineA = (bgA*0.55).toFixed(2);
  cx.strokeStyle=`rgba(139,90,0,${lineA})`; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(0,54); cx.lineTo(W,54); cx.stroke();
  cx.beginPath(); cx.moveTo(0,H-70); cx.lineTo(W,H-70); cx.stroke();

  // ── HEADER: "STORY MODE COMPLETE" ──
  cx.globalAlpha = bgA;
  bigText(TX('storyComplete'), W/2, 31, 15, '#ffd700', '#3a1800');
  cx.fillStyle='#8b5a00'; cx.font='7px monospace'; cx.textAlign='center';
  for(let i=0;i<7;i++) cx.fillText('✦', 56+i*114, 31);
  cx.textAlign='left'; cx.globalAlpha=1;

  // ── CREATOR CREDIT (fades in at 5900ms) ──
  const cA = Math.min(Math.max((et-5900)/1300, 0), 1);
  if (cA > 0) {
    cx.globalAlpha = cA;

    // "A GAME BY" label
    cx.fillStyle='#665533'; cx.font='9px monospace';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(TX('storyEndTag'), W/2, H/2-44);

    // Radial glow
    const gp = (0.20 + Math.sin(t*0.0018)*0.09).toFixed(3);
    const gr = cx.createRadialGradient(W/2,H/2,12,W/2,H/2,152);
    gr.addColorStop(0,`rgba(255,195,45,${gp})`);
    gr.addColorStop(0.5,`rgba(160,80,10,${(gp*0.28).toFixed(3)})`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=gr; cx.fillRect(W/2-156,H/2-72,312,118);

    // "YEIYIES" — layered depth + moving shimmer
    cx.font='bold 46px Georgia, "Times New Roman", serif';
    cx.textBaseline='middle';

    cx.fillStyle='rgba(0,0,0,0.92)';
    cx.fillText('YEIYIES', W/2+4, H/2+14);
    cx.fillStyle='#3d1a00';
    cx.fillText('YEIYIES', W/2+2, H/2+8);

    const shimPos = (Math.sin(t*0.0032)+1)/2;
    const shim = cx.createLinearGradient(W/2-190,H/2-24,W/2+190,H/2+18);
    shim.addColorStop(0,'#a05018');
    shim.addColorStop(Math.max(0.01,shimPos-0.16),'#c87820');
    shim.addColorStop(shimPos,'#fff8e0');
    shim.addColorStop(Math.min(0.99,shimPos+0.16),'#ffd700');
    shim.addColorStop(1,'#a05018');
    cx.fillStyle=shim;
    cx.fillText('YEIYIES', W/2, H/2+6);

    cx.textAlign='left'; cx.textBaseline='alphabetic'; cx.globalAlpha=1;
  }

  // ── FINAL STATS (fades in at 7800ms) ──
  const sA = Math.min(Math.max((et-7800)/1000, 0), 1);
  if (sA > 0) {
    cx.globalAlpha = sA;
    const statsY = H/2 + 58;
    const storyBattles = battleHistory.filter(e=>e.story).length;
    const items = [
      {label:TX('levelsCleared'), val:Math.min(storyCompleted.length,STORY_LEVELS.length)+'/'+STORY_LEVELS.length, col:'#ffd700'},
      {label:TX('storyBattles'), val:storyBattles, col:'#88ff88'},
      {label:TX('chosenGod'), val:GODS[0].short, col:'#cc88ff'},
    ];
    const iW=170, iG=22;
    const totW=items.length*iW+(items.length-1)*iG;
    const sx=Math.round(W/2-totW/2);
    items.forEach(({label,val,col},i)=>{
      const bx=sx+i*(iW+iG);
      cx.fillStyle='rgba(0,0,6,0.72)'; cx.fillRect(bx,statsY,iW,44);
      cx.strokeStyle=col+'55'; cx.lineWidth=1; cx.strokeRect(bx,statsY,iW,44);
      cx.fillStyle=col+'66'; cx.fillRect(bx+1,statsY+1,iW-2,2);
      cx.fillStyle=col; cx.font='bold 16px monospace';
      cx.textAlign='center'; cx.fillText(String(val),bx+iW/2,statsY+25);
      cx.fillStyle='#554433'; cx.font='6px monospace';
      cx.fillText(label,bx+iW/2,statsY+38); cx.textAlign='left';
    });
    cx.globalAlpha=1;
  }

  // ── BUTTONS (appear after 9000ms) ──
  const btnA = Math.min(Math.max((et-9000)/800, 0), 1);
  if (btnA > 0) {
    cx.globalAlpha = btnA;
    const btnY=H-56, btnH=30, btnW=192;

    // Return to Menu
    const mX=W/2-btnW-16;
    const mSel = storyEndSel===0;
    cx.fillStyle=mSel?'rgba(120,80,0,0.95)':'rgba(80,48,6,0.85)';
    cx.fillRect(mX,btnY,btnW,btnH);
    cx.strokeStyle='#ffd700'; cx.lineWidth=mSel?2:1; cx.strokeRect(mX,btnY,btnW,btnH);
    if (mSel) { cx.shadowColor='#ffd700'; cx.shadowBlur=8; cx.strokeRect(mX,btnY,btnW,btnH); cx.shadowBlur=0; }
    cx.fillStyle='#ffd700'; cx.font=`${mSel?'bold ':''} 10px monospace`;
    cx.textAlign='center'; cx.fillText(TX('returnMenu'),mX+btnW/2,btnY+19);

    // New Game
    const nX=W/2+16;
    const nSel = storyEndSel===1 && ngPlusUnlocked;
    cx.fillStyle=nSel?'rgba(90,0,130,0.95)':'rgba(40,0,68,0.85)';
    cx.fillRect(nX,btnY,btnW,btnH);
    cx.strokeStyle='#cc88ff'; cx.lineWidth=nSel?2:1; cx.strokeRect(nX,btnY,btnW,btnH);
    if (nSel) { cx.shadowColor='#cc88ff'; cx.shadowBlur=8; cx.strokeRect(nX,btnY,btnW,btnH); cx.shadowBlur=0; }
    cx.fillStyle= ngPlusUnlocked ? '#cc88ff' : '#664488';
    cx.font=`${nSel?'bold ':''} 10px monospace`;
    cx.fillText(TX('newGame'),nX+btnW/2,btnY+19);

    cx.fillStyle='#2e1a06'; cx.font='7px monospace';
    cx.fillText(TX('storyEndHint'), W/2, H-8);
    cx.textAlign='left'; cx.globalAlpha=1;
  }

  // ── GODS ROSTER SCROLL (starts at 9500ms, fills ~60s credits music) ──
  const scrollA = Math.min(Math.max((et - 9500) / 1400, 0), 1);
  if (scrollA > 0) {
    const scrollElapsed = Math.max(et - 10200, 0);
    const scrollY0 = (H - 72) - scrollElapsed * 0.025;

    cx.save();
    cx.globalAlpha = scrollA * 0.92;
    cx.beginPath(); cx.rect(60, 56, W - 120, H - 132); cx.clip();

    let ly = scrollY0;
    const lh = 17;

    const _sep = () => {
      if (ly > 50 && ly < H - 72) {
        cx.fillStyle = '#5a3800'; cx.font = '7px monospace'; cx.textAlign = 'center';
        cx.fillText('── ✶ ──────────── ✶ ──────────── ✶ ──', W/2, ly);
      }
      ly += lh;
    };
    const _line = (txt, size, col, bold) => {
      if (ly > 50 && ly < H - 72) {
        cx.fillStyle = col; cx.font = `${bold?'bold ':''}${size}px monospace`; cx.textAlign = 'center';
        cx.fillText(txt, W/2, ly);
      }
      ly += lh;
    };
    const _italic = (txt, col) => {
      if (ly > 50 && ly < H - 72) {
        cx.fillStyle = col; cx.font = 'italic 7px Georgia,serif'; cx.textAlign = 'center';
        cx.fillText(txt, W/2, ly);
      }
      ly += lh;
    };

    _sep();
    _line('LOS 17 DIOSES / THE 17 GODS', 11, '#ffd700', true);
    _line('PANTEÓN MEXICA · MEXICA PANTHEON', 7, '#8b5a00', false);
    _sep();
    ly += lh * 0.5;

    GODS.forEach((g, i) => {
      const cr = GOD_CREDITS[i];
      _line(g.name, 10, cr.col, true);
      _line(g.title + ' · ' + cr.elem, 7, '#a07840', false);
      _italic(cr.phrase, '#d4c090');
      ly += Math.round(lh * 0.5);
    });

    ly += lh;
    _sep();
    ly += lh * 0.5;
    _line('UN JUEGO DE · A GAME BY', 7, '#665533', false);
    _line('YEIYIES', 14, '#ffd700', true);
    _line('JAHDIEL GUILLÉN · CDMX · 2026', 7, '#8b5a00', false);
    ly += lh * 0.5;
    _sep();
    ly += lh * 0.5;
    _line('SONIDOS · SOUNDS', 7, '#554422', false);
    _line('ELEVENLABS AI', 9, '#c8a060', true);
    _line('Voz sobrenatural · Supernatural voice synthesis', 7, '#554422', false);
    ly += lh * 0.5;
    _line('LENGUA NÁHUATL · NAHUATL LANGUAGE', 7, '#554422', false);
    _italic('Codex Florentino · Cantares Mexicanos', '#886633');
    ly += lh * 0.5;
    _line('REFERENCIA CULTURAL · CULTURAL REFERENCE', 7, '#554422', false);
    _line('INAH — Instituto Nacional de Antropología e Historia', 8, '#c8a060', true);
    _line('Museo Nacional de Antropología · CDMX', 7, '#554422', false);
    ly += lh * 0.5;
    _sep();
    ly += lh * 0.5;
    _italic('In tlaltipac ticnemih · On this earth we live', '#886633');
    _italic('In tonatiuh tlachia · The sun watches over us', '#886633');
    ly += lh;
    _line('✶', 14, '#ffd70066', false);
    _sep();

    cx.restore();
  }
}

// ── Main loop ────────────────────────────────────────────────
let lastLoopT = 0;
let physAccum = 0;
const PHYS_STEP = 1000 / 55; // physics at 55fps — slightly slower than original 60fps
let musicStarted = false;
let _prevGs = -1;

function loop(t) {
  try {
  const dt = Math.min(t - lastLoopT, 50);
  lastLoopT = t;

  // ── Ambient management on state change ──────────────────────
  if (gs !== _prevGs) {
    const prev = _prevGs;
    _prevGs = gs;
    if (prev === GS.LORE || prev === GS.HISTORY || prev === GS.STORY_MAP) {
      stopAmbient(); stopMicroAmbients();
    }
    if (prev === GS.LORE || prev === GS.HISTORY || prev === GS.STORY_MAP ||
        prev === GS.DIALOGUE || prev === GS.CINEMATIC) {
      stopVoiceAmbient();
    }
    if (prev === GS.FIGHT) stopRainAmbient();
    if (gs === GS.LORE) {
      startAmbient('ambient_lore', 0.40); startMicroAmbients();
      startVoiceAmbient('voice_sacred', 0.32);
    } else if (gs === GS.HISTORY) {
      startAmbient('ambient_lore', 0.40); startMicroAmbients();
      startVoiceAmbient('voice_sacred', 0.38);
    } else if (gs === GS.STORY_MAP) {
      startAmbient('ambient_map', 0.35); startMicroAmbients();
      startVoiceAmbient('voice_map', 0.28);
    } else if (gs === GS.DIALOGUE) {
      const _dlgElem = storyMode ? (_GOD_GROUP[p2Choice] || 'wind') : 'wind';
      startVoiceAmbient(`voice_${_dlgElem}`, 0.55);
    } else if (gs === GS.CINEMATIC) {
      startVoiceAmbient('voice_cinematic', 0.50);
    }
  }
  // Rain in fight: auto start/stop based on current scenario
  if (gs === GS.FIGHT) {
    if (RAINY_SCENARIOS.has(currentScenario) && !_rainAudio) startRainAmbient();
    else if (!RAINY_SCENARIOS.has(currentScenario) && _rainAudio) stopRainAmbient();
  }

  if(gs===GS.ANNOUNCE){
    announceT+=dt;
    if(announceT>=ANNOUNCE_TOTAL){
      startFight(); gs=GS.FIGHT;
      setTimeout(()=>sfxFight(),100);
    }
  }

  if(gs===GS.ROUND_END){
    roundEndT+=dt;
    if(roundEndT>=ROUND_END_DURATION){
      roundNum++;
      gs=GS.ANNOUNCE; announceT=0; sfxAnnounce();
    }
  }

  if(gs===GS.WIN){
    winT+=dt;
    if(winT>=WIN_DISPLAY_DURATION){
      p1Ready=false; p2Ready=false;
      p1RoundWins=0; p2RoundWins=0; roundNum=1;
      titleSel=0; gs=GS.TITLE; startMusic('title');
    }
  }

  if(gs===GS.STORY_END){
    storyEndT+=dt;
    if(storyEndT>=4600&&!currentThemeData&&!bgAudio) startMusic('credits');
  }

  if(gs===GS.FIGHT&&!paused){
    physAccum+=dt;
    if(freezeFrames > 0){ freezeFrames--; }
    else { while(physAccum>=PHYS_STEP && gs===GS.FIGHT){ updateFight(); physAccum-=PHYS_STEP; } }
    if(shakeTimer > 0){
      const amp = Math.round(shakeIntensity * (shakeTimer / shakeDuration));
      shakeX = shakeTimer % 2 === 0 ? amp : -amp;
      shakeY = shakeTimer % 3 === 0 ? Math.round(amp * 0.5) : -Math.round(amp * 0.3);
      shakeTimer--;
    } else { shakeX = 0; shakeY = 0; }
    updateCamera(dt);
  } else if(gs!==GS.FIGHT){ physAccum=0; }

  if     (gs===GS.LOADING)   drawLoading(t);
  else if(gs===GS.TITLE)     drawTitle(t);
  else if(gs===GS.MODE)      drawMode(t);
  else if(gs===GS.PICK)      drawPick(t);
  else if(gs===GS.ANNOUNCE)  drawAnnounce(t);
  else if(gs===GS.FIGHT)     drawFight(t);
  else if(gs===GS.ROUND_END) drawRoundEnd(t);
  else if(gs===GS.WIN)       drawWin(t);
  else if(gs===GS.DIALOGUE)  drawDialogue(t);
  else if(gs===GS.HISTORY)   drawHistory(t);
  else if(gs===GS.STORY_MAP) drawStoryMap(t);
  else if(gs===GS.CINEMATIC) drawCinematic(t);
  else if(gs===GS.LORE)      drawLore(t);
  else if(gs===GS.STORY_END) drawStoryEnd(t);

  if(showHelp) drawHelp();

  } catch(e) { console.error('loop error:', e); }
  requestAnimationFrame(loop);
}

// Start title music on first user gesture
document.addEventListener('pointerdown', ()=>{
  if(!musicStarted){ musicStarted=true; startMusic('title'); }
}, {once:true});
document.addEventListener('keydown', ()=>{
  if(!musicStarted){ musicStarted=true; startMusic('title'); }
}, {once:true});

requestAnimationFrame(loop);

// ── ?autoplay — dev shortcut para captura de pantalla ────────
if(new URLSearchParams(location.search).get('autoplay')==='1'){
  setTimeout(()=>{
    storyMode=false; mode1P=true; difficulty=1;
    p1Choice=0; p2Choice=3;
    gs=GS.ANNOUNCE; announceT=0;
    startFight(); gs=GS.FIGHT;
  }, 800);
}

// ── iOS / mobile setup ───────────────────────────────────────
// Request landscape orientation (works in PWA / Expo WebView)
if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
  window.screen.orientation.lock('landscape').catch(() => {});
}
// Prevent iOS rubber-band scroll
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
